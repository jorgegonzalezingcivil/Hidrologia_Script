analisis_de_precipitaciones:
  - >
    En este numeral se presentan los análisis correspondientes a la 
    información de precipitación obtenida en las estaciones de lluvia de 
    interés en la zona de proyecto.

precipitacion_total_mensual:
  - >
    De acuerdo con el numeral 3.1, las siguientes son las estaciones con 
    registros de precipitación seleccionadas para los análisis del proyecto 
    ya que cuentan con una longitud de series mayor a 15 años.
  - >
    La estación ACACIAS, que se observa en el Gráfico 51 y Gráfico 52 tiene 
    registros mensuales completos desde el año 1980 hasta el 2023, con 
    excepción del año 2012 y 2014 que tiene algunos vacíos.
  - >
    La estación ACUEDUCTO ESMERALDA tiene registros desde el año 1986 de 
    manera intermitente hasta el año 1993, luego desde 1994 hasta mediados 
    de 1997 no existen registros; posteriormente hasta el año 2020 tiene 
    series completas con algunos vacíos en 2007, 2008 y 2009; por último, 
    desde el año 2021 a 2023 también tiene algunos vacíos en la serie 
    mensual, esto se observa en el Gráfico 53 y Gráfico 54.
  - >
    La estación AEROPUERTO VANGUARDIA que se presenta en el Gráfico 55 y 
    Gráfico 56, tiene registros desde 1980 hasta 2023 completos en su 
    serie.
  - >
    La estación ALCALDÍA tiene registros desde el año 1995 hasta el 2023, 
    con intermitencias en los años 1999, 2006, 2007, 2020, 2021, 2022 y 
    2023, como se observa en el Gráfico 57 y Gráfico 58.
  - >
    La estación BASE APIAY tiene registros desde el año 1980 hasta el año 
    2015, con intermitencias en la mayoría de sus años y en algunos casos 
    con años totalmente vacíos como lo es el periodo 1985 a 1988, 1993, 
    1995 a 1996, como se observa en el Gráfico 59 y Gráfico 510.
  - >
    La estación BUENAVISTA cuenta con registros desde el año 1994 hasta el 
    año 2023 con algunas intermitencias en el año 2004, 2006 y 2008, como 
    se muestra en el Gráfico 511 y Gráfico 512.
  - >
    La estación ICA VILLAVICENCIO cuenta con algunos registros en el año 
    2006 y 2007, luego vuelve a tener información desde el año 2010 hasta 
    el 2023 con algunos vacíos en el año 2018 y 2019. Lo anterior se puede 
    observar en el Gráfico 513 y Gráfico 514.
  - >
    En el Gráfico 515 y Gráfico 516 se presenta la información de la 
    estación MANZANARES la cual tiene información registrada desde el año 
    1980 hasta 1999.
  - >
    En la estación Salinas de Upín se tiene información registrada desde el 
    año 1980 hasta el año 1994, como se presenta en el Gráfico 517 y 
    Gráfico 518.
  - >
    La estación SENA contiene registros desde el año 1985 hasta el año 2023 
    con algunas intermitencias puntuales y otras en periodos prolongados 
    como el año 1989, 1991, 1992, 1995, 1996, 2020 y 2021, pero en general 
    todos los años cuentan con algún tipo de información, como se ve en el 
    Gráfico 519 y Gráfico 520.
  - >
    En el Gráfico 521 y Gráfico 522 se observa que se tienen registros en 
    la estación SERVITA desde el año 1995 hasta el año 2023, con buenos 
    datos ya que solo dos meses puntuales no cuentan con información.
  - >
    La estación ICA VILLAVICENCIO AUTOMÁTICA solo tiene un año completo de 
    registro correspondiente al 2009 y otros datos aislados del 2021. Esta 
    inmediatamente se descarta por falta de información.
  - >
    La estación UNILLANOS que se presenta en el Gráfico 523 y Gráfico 524 
    cuenta con registros desde el año 1984 hasta el 1989 con varias 
    intermitencias, luego en el periodo de 1990 a 1993 son vacíos y vuelve 
    a tener información con intermitencias hasta el año 2023.
  - >
    Como se observa en los gráficos anteriores de precipitación promedio 
    mensual, todas las estaciones presentan un régimen de lluvias bimodal, 
    con periodos de invierno entre abril a julio y octubre a noviembre, 
    mientras los periodos secos son de diciembre a marzo y agosto.

analisis_de_consistencia:
  - >
    Para conocer la confiabilidad de los datos de precipitación total de 
    las estaciones mencionadas, se realizó para cada una de ellas el 
    análisis consistencia de sus registros mediante la metodología de 
    dobles masas, utilizando la información de las estaciones 
    geográficamente más cercanas.
  - >
    Este método es utilizado para verificar la confiabilidad e idoneidad de 
    una estación pluviométrica o si existe alguna inconsistencia importante 
    en sus datos de precipitación. Se relacionan los datos totales 
    mensuales de precipitación de una determinada estación y los totales 
    mensuales de las estaciones cercanas en la región.
  - >
    El ejercicio se realizó para las estaciones seleccionadas del IDEAM que 
    cuentan con un buen registro de datos para ser tenidas en cuenta en los 
    análisis hidrológicos de acuerdo con el numeral 5.1. Para el análisis 
    se utilizó el cálculo del coeficiente de correlación para determinar 
    entre cada estación su comportamiento. En la Ilustración 51 se observan 
    los resultados donde la correlación varía entre 0.5 y 1.0.
  - >
    En términos generales, la mayoría de las estaciones se obtuvo una buena 
    consistencia entre los datos registrados por ella y sus cercanas 
    geográficamente de acuerdo con el coeficiente de correlación calculado 
    que supera los valores de 0.80 lo que el Consultor considera adecuado.
  - >
    Las estaciones con código 35020030 MANZANARES, 35035030 SALINAS DE UPIN 
    y 35030370 ICA VILLAVICENCIO AUTOMÁTICA son las que tienen las peores 
    correlaciones con las demás, esencialmente por la ausencia de datos, 
    por lo que se descartan para continuar con los análisis.

analisis_de_datos_dudosos:
  - >
    Con las series de datos de la precipitación total mensual se procede a 
    analizar si algún dato se considera dudoso o anómalo a partir de la 
    metodología del rango intercuartílico (IQR), la cual aplica para datos 
    de una serie que no se asemejan a una distribución normal, el análisis 
    identifica los valores considerados atípicos que son los que se 
    encuentran por fuera de un rango definidos intercuartílico (Q3 – Q1). 
    El valor del primer cuartil es el percentil 25 y el del tercer cuartil 
    es el percentil 75 de la serie de datos.
  - >
    Utilizando un script de R.LTWB de la Escuela Colombiana de Ingeniería 
    Julio Garavito, para los cuartiles definidos se realiza el análisis 
    tipo box plot de las estaciones identificadas y filtradas de acuerdo 
    con el numeral anterior.
  - >
    En el Gráfico 525 se presentan los resultados para cada estación, donde 
    se observa que no todas tienen datos anómalos y las que si son muy 
    pocos valores.
  - >
    En total se tiene que para las estaciones analizadas hay 8 datos 
    anómalos según la metodología IQR, en el Gráfico 526 se presenta la 
    serie sin outliers que continuará con el proceso de análisis 
    estadístico de los siguientes numerales.

complemento_de_datos_faltantes:
  - >
    Aunque se comprobó que las estaciones pluviométricas no descartadas en 
    el ejercicio de análisis de consistencia por dobles masas tienen un 
    alto grado de confiabilidad, se hace necesario completar los datos de 
    los años donde no se cuenta con registros completos para las estaciones 
    seleccionadas.
  - >
    Retomando la información de todas las estaciones para identificar la 
    longitud real de las series, en el Gráfico 527 se observa una gran 
    intermitencia en la década de 1980 para la mayoría de las estaciones y 
    otras que no tienen registros recientes ya que fueron suspendidas en un 
    año determinado.
  - >
    Si bien en análisis anteriores se consideraron adecuadas las estaciones 
    por su correlación estadística, como ejercicio de buena práctica se 
    decide descartar las estaciones que tengan muchos vacíos o ausencia de 
    datos reciente, esto con el fin de no generar una serie predominante 
    con datos sintéticos y que no tengan en cuenta los fenómenos climáticos 
    que vienen ocurriendo en el país.
  - >
    En conclusión, las estaciones excluidas por serie incompleta en los 
    últimos años, intermitencias por años incompletos y mala correlación 
    con las otras son '35020030' MANZANARES, '35030370' ICA VILLAVICENCIO, 
    '35035010' BASE AÉREA APIAY, '35035030' SALINAS DE UPIN y '35035100' 
    ICA VILLAVICENCIO AUTOMÁTICA; las demás estaciones continúan al proceso 
    de complemento de datos.
  - >
    En el Gráfico 528 se observa la serie de precipitación que será objeto 
    de complemento de datos.
  - >
    Para el ejercicio de complemento de datos de precipitación se tienen 
    los métodos disponibles en la literatura descritos en la Tabla 51.
  - >
    Para este caso se selecciona un método que tenga en cuenta la 
    espacialidad de las estaciones, que pueda ser completada toda la serie 
    y que mantenga la tendencia general de la zona estudiada (valores 
    similares de media y desviación estándar). Se selecciona entonces el 
    método de Multivariante con ecuación de encadenamiento (MICE).
  - >
    En el Gráfico 529 se presentan las series de precipitación completadas, 
    donde se observa que la década de 1980 fue completada en la mayoría de 
    las estaciones lo cual haría que se tuviera información sintética de 
    gran magnitud.
  - >
    Como último filtro para genera los insumos de modelos lluvia 
    escorrentía de los capítulos posteriores de este informe, se tomará una 
    longitud de serie de 27 años que corresponde desde el año de 1997 
    (donde se inician las series con intermitencias) hasta el año 2023.

anomalias_enso:
  - >
    Se observa que en la totalidad de las estaciones estudiadas los 
    registros tienen tendencia hacia los valores medios o mínimos y los 
    datos anómalos corresponden a valores máximos asociados a eventos 
    extremos.
  - >
    Los datos anómalos observados se consideran que son eventos reales 
    asociados al fenómeno de Oscilación del Sur El Niño (l Niño-Southern 
    Oscillation -ENSO), los cuales pueden ser comparados con el Índice del 
    Niño Oceánico (Oceanic Nino Index - ONI).
  - >
    El fenómeno de El Niño es un evento climático relacionado con el 
    calentamiento en el Pacífico Oriental Ecuatorial, que ocurre de forma 
    cíclica, aunque errónea con ciclos entre 3 y 8 años. En contraste, 
    ocurre el fenómeno de La Niña que corresponde a la presencia de lluvias 
    intensas por el enfriamiento del ciclo.
  - >
    El ONI es calculado como la media móvil de tres puntos de la serie 
    mensual de anomalías de la temperatura de la superficie del mar. De 
    acuerdo con este índice, en condiciones El Niño (La Niña), el ONI debe 
    ser igual o superior (igual o inferior) a medio grado Celsius de 
    anomalía, se clasificó cada año desde 1950 para luego poder analizar 
    separadamente los datos climatológicos recopilados de las estaciones 
    terrestres de la zona de estudio.
  - >
    En la Ilustración 52 se observa la clasificación del tipo de fenómeno 
    ENSO de acuerdo con los registros históricos del ONI.
  - >
    La asociación de eventos anómalos pero reales puede realizarse 
    comparando la serie histórica de precipitación con los picos positivos 
    de la serie, como se muestra en el Gráfico 530 al Gráfico 537.
  - >
    Se observa que los datos extremos de precipitación están efectivamente 
    asociados a anomalías presentadas por el fenómeno ENSO, por lo cual no 
    se excluyen esto datos de la serie a utilizar para análisis 
    posteriores.
  - >
    Con lo anterior, se puede realizar la agregación de los datos 
    completados por fenómeno climatológico, como se presenta del Gráfico 
    538 al Gráfico 541.

analisis_espacial_de_la_precipitacion:
  - >
    Con la serie de datos completados, se construye un mapa de la 
    distribución espacial de la precipitación para determinar los valores 
    promedio de este parámetro a nivel total o mensual, comúnmente usando 
    el método de las isoyetas.
  - >
    Este método consiste en el trazado de líneas de igual precipitación 
    llamadas isoyetas utilizando los datos puntuales reportados por las 
    estaciones meteorológicas. Comúnmente estas líneas se dibujan 
    observando la orografía de la región y los planos obtenidos mediante 
    otros estudios e información de referencia, sin embargo, también se 
    pueden utilizar técnicas de interpolación ráster que utilizan métodos 
    numéricos para la construcción de isoyetas.
  - >
    IDW: Utiliza un método de interpolación que estima los valores de las 
    celdas calculando promedios de los valores de los puntos de datos de 
    muestra cercanos de cada celda de procesamiento. Cuanto más cerca está 
    un punto del centro de la celda que se está estimando, más influencia o 
    peso tendrá en el proceso de cálculo del promedio.
  - >
    KRIGING: Es un procedimiento de estadísticas geográficas avanzado que 
    genera una superficie estimada a partir de un conjunto de puntos 
    dispersados con valores z. Aún más que con otros métodos de 
    interpolación, se debe realizar una investigación profunda del 
    comportamiento espacial del fenómeno representado por los valores z 
    antes de seleccionar el mejor método de estimación para generar la 
    superficie de salida.
  - >
    VECINO NATURAL: La interpolación de Vecino Natural halla el subconjunto 
    de muestras de entrada más cercano a un punto de consulta y aplica 
    ponderaciones sobre ellas basándose en áreas proporcionales para 
    interpolar un valor.
  - >
    SPLINE: Utiliza un método de interpolación que estima valores usando 
    una función matemática que minimiza la curvatura general de la 
    superficie, lo que resulta en una superficie suave que pasa exactamente 
    por los puntos de entrada.
  - >
    De la literatura consultada para la selección del mejor método de 
    interpolación, se tomó como referencia el trabajo “ANÁLISIS DE LA 
    DISTRIBUCIÓN E INTERPOLACIÓN ESPACIAL DE LAS LLUVIAS EN BOGOTÁ, 
    COLOMBIA” desarrollado por Vargas et al., en donde analizaron la 
    estadística global mediante verificación del grado de ajuste al modelo 
    real por medio de validaciones cruzadas y evaluación visual 
    estableciendo de manera cualitativa los patrones de comportamiento de 
    las isolíneas y superficies para los métodos de interpolación IDW y 
    Kriging. Las conclusiones principales del trabajo de Vargas et al. 
    fueron las siguientes:
  - >
    El método IDW es el que mejor representa el comportamiento espacial de 
    la precipitación debido a que se obtienen los menores errores absolutos 
    en la comparación de los valores interpolados con los observados.
  - >
    El modelo Kriging requiere un elevado número de estaciones con 
    registros, mientras que los modelos IDW no tienen restricciones en este 
    aspecto.
  - >
    El modelo Kriging genera sobreestimaciones de precipitación mientras 
    que el modelo IDW no genera sobreestimaciones de la precipitación, sin 
    embargo, produce concentraciones bastante fuertes en los puntos de 
    medición.
  - >
    Considerando esto se podría concluir que el método más conveniente a 
    utilizar es el IDW. Con la información de los numerales anteriores, se 
    puede construir el mapa de isoyetas con las estaciones seleccionadas.
  - >
    Tomando la agregación realizada del numeral anterior, a través del 
    script SIG presentado en la Ilustración 53, se generan los mapas de 
    isoyetas de precipitación total mensual multianual para cada fenómeno 
    climatológico.
  - >
    De la Ilustración 54 a la Ilustración 57 se observa que la distribución 
    espacial de la precipitación a pesar del fenómeno es similar, teniendo 
    como mayor cantidad de lluvia hacia el costado noroccidental en la 
    región montañosa y menor hacia la ciudad de Villavicencio.

precipitacion_maxima_en_24_horas:
  - >
    Se consultaron las precipitaciones máximas en 24 horas registradas en 
    las estaciones meteorológicas seleccionadas, esto como insumo para 
    realizar la construcción de hietogramas para la estimación de máximas 
    avenidas.

analisis_estadistico_de_eventos_maximos:
  - >
    Se tomaron los datos de precipitación diaria disponibles en la 
    plataforma digital del IDEAM para las estaciones confiables y con datos 
    registrados desde el año 1997 hasta el 2023, con el fin de tener series 
    históricas mínimas de 25 años para analizar los eventos máximos de 
    precipitación los cuales se presentan en el Gráfico 542.
  - >
    Utilizando la herramienta computacional Hydrognomon se realizó el 
    análisis de comparación de las series máximas a las distribuciones de 
    probabilidad conocidas, con el fin de seleccionar la que mejor ajuste 
    tenga y a partir de esta calcular los valores de precipitación para 
    diferentes periodos de retorno.
  - >
    Del Gráfico 543 al Gráfico 558 se presenta los resultados de cálculo 
    del histograma de frecuencia y el ajuste a las probabilidades definidas 
    para cada una de las estaciones.
  - >
    En la Tabla 52 se presenta las distribuciones de probabilidad 
    seleccionadas para cada estación.
  - >
    Con estos resultados se calcularon las precipitaciones esperadas para 
    diferentes periodos de retorno mediante el uso del programa Hydrognomon 
    (Ilustración 58). En la Tabla 53 y Gráfico 559 se presentan los 
    resultados obtenidos.
  - >
    Con estos resultados se construyen las isoyetas de precipitación máxima 
    para conocer el comportamiento espacial de los eventos extremos; 
    adicionalmente con esta información se calcula la precipitación máxima 
    para cada uno de los periodos de retorno a estudiar en la zona de 
    proyecto. En la Ilustración 59 a la Ilustración 515 se presentan los 
    resultados del ejercicio.
  - >
    A partir de una estadística zonal del ráster generado de isoyetas por 
    cada periodo de retorno cuyos resultados se presentan a continuación 
    para cada microcuenca de las corrientes.

hietograma_de_diseno:
  - >
    De acuerdo con la norma NS-085 de la EAAB-ESP y el Manual de Drenaje 
    del INVIAS tomados como literatura de referencia, para los análisis de 
    eventos de lluvia se recomienda una duración de la tormenta de 3 horas.
  - >
    Asumiendo la hipótesis anterior, se procede a construir los hietogramas 
    de tormenta para diferentes periodos de retorno, a partir del método de 
    Huff (1967); en este método se asumen distribuciones temporales para 
    tormentas fuertes en áreas de hasta 1036 km2. En donde los patrones de 
    distribución temporal se desarrollan para cuatro grupos de 
    probabilidad, de los más severos (primer cuartil) hasta los menos 
    severos (cuarto cuartil).
  - >
    En comparación con otros métodos como el bloque alterno y la tormenta 
    instantánea, el método de Huff este pico no se encuentra en esta misma 
    localización dentro del hietograma, se presenta más una tendencia 
    similar al comportamiento de un hidrograma producto de la modelación 
    lluvia-escorrentía, razón por la cual se considera más conveniente 
    utilizar este método para elaborar los hietogramas de diseño.
  - >
    De acuerdo con lo anterior, utilizando la Ilustración 519 para un 50% 
    de probabilidad que se refiere a un evento de intensidad media, es 
    decir no la más extrema ni la menos intensa, se tomó la relación del 
    valor de porcentaje de precipitación acumulada para un porcentaje del 
    tiempo total de lluvia transcurrido, con lo cual se pueden construir 
    los hietogramas de precipitación.
  - >
    Se realizó el ejercicio de construcción de los hietogramas para cada 
    una de las subcuencas delimitadas en el numeral 4.1, tomando como 
    insumo la precipitación máxima calculada en el numeral 5.2.1. En el 
    Anexo 3.7 de presentan las hojas de cálculo de los hietogramas. En el 
    Gráfico 560 al Gráfico 580 se presentan los resultados para cada 
    periodo de retorno.

influencia_del_cambio_climatico:
  - >
    Como parte de las acciones ante el cambio climático que se viene 
    evidenciando a nivel mundial, el IDEAM ha realizado estudios y planes 
    para informar y mitigar las acciones que este fenómeno genera sobre el 
    país.
  - >
    Dentro de éstos se tiene la Comunicación Nacional del cambio climático, 
    que actualmente se encuentra en su tercera entrega que data del año 
    2015, presentando los escenarios de cambio climático desarrollados para 
    Colombia, tomando como base información del periodo 1976 a 2005, 
    considerado el clima de referencia, y pronosticando los cambios 
    principalmente en temperatura y precipitación para los periodos 
    2011-2040, 2041-2070 y 2071-2100.
  - >
    En la Ilustración 520 se presenta los impactos de este fenómeno para el 
    periodo de ejecución del proyecto.
  - >
    En esta Comunicación Nacional también se han hecho proyecciones a nivel 
    departamental sobre estos cambios de temperatura y precipitación, para 
    los tres escenarios futuros, con lo que se puede observar de manera más 
    exacta cual es la estimación de aumento o disminución de estas 
    variables para el departamento del Meta y la ciudad de Villavicencio.
  - >
    De acuerdo con la Ilustración 521, en los próximos años se tendrá una 
    disminución de precipitación del 7.46% y posteriormente de la década 
    del 2040 también disminución del 5.68%, sin embargo, como margen de 
    seguridad para la estimación de caudales en la cuenca de estudio, las 
    magnitudes de los hietogramas de diseño no se afectarán en el volumen 
    resultante de los análisis estadísticos que puede presentarse en la 
    creciente.

series_de_precipitacion_diaria:
  - >
    De acuerdo con la delimitación de la cuenca en estudio (numeral 4.1), 
    la localización de estaciones meteorológicas (Ilustración 34) y la 
    distribución espacial de la precipitación (numeral 5.1.5), desde el 
    punto de vista de esta Consultoría no se puede seleccionar una estación 
    específica para tomar la serie de datos diarios de precipitación ya que 
    se encuentran alejadas del sitio de proyecto.
  - >
    En este sentido con las estaciones seleccionadas según los resultados 
    de los numerales anteriores, el periodo de tiempo asumido para los 
    análisis y la metodología de interpolación para construir las 
    isolíneas, se realizó un extenso ejercicio de construcción de la serie 
    de precipitación diaria para las cuencas de estudio, con un total de 
    9862 datos en la ventana de tiempo de análisis.
  - >
    En primera instancia para este ejercicio se realizó el complemento de 
    3670 datos diarios identificados como faltantes (Ilustración 522) 
    siguiendo la misma metodología del numeral 5.1.3 para las ocho 
    estaciones seleccionadas; en la Gráfico 581 se observa el resultado de 
    las series completadas.
  - >
    En la Ilustración 523 se presenta algunos ejemplos del ejercicio de 
    interpolación realizado para la ventana de tiempo a escala diaria que 
    como se mencionó anteriormente corresponde a 9862 datos.
  - >
    Como insumo para los análisis del numeral 5.5 a través de la 
    estadística zonal con herramientas SIG se construyeron las series 
    específicas para la zona de proyecto.

curvas_idf:
  - >
    Las curvas IDF son una representación gráfica de la relación existente 
    entre dos parámetros de la precipitación: intensidad y duración, y su 
    frecuencia de ocurrencia; así, en ellas se dibuja un promedio de 
    intensidades de lluvia contra sus correspondientes duraciones, para 
    diferentes frecuencias de ocurrencia dentro del grupo de datos 
    estudiado, conocidas como periodos de retorno. Estas curvas usualmente 
    se ajustan a una ecuación de la siguiente forma.
  - >
    Donde: i=intensidad de la precipitación para una duración dada (mm/h)
  - >
    T=Frecuencia de ocurrencia o periodo de retorno (años)
  - >
    a, b, m, n=coeficientes y exponentes que varían de una región a otra.
  - >
    De acuerdo con la información reportada en la plataforma de datos 
    abiertos del IDEAM, consultada en la fecha de desarrollo de este 
    informe se tienen dos estaciones con una curva IDF disponible que 
    corresponde a Base Aérea Apiay con una ventana temporal del año 1972 al 
    2010 y a la estación Salinas de Upín con una ventana temporal de 1970 a 
    1992. Sin embargo, teniendo en cuenta que estas estaciones fueron 
    descartadas para los análisis hidrológicos, pero primordialmente que 
    los datos utilizados no son recientes, se descarta el uso de esta 
    información al considerarse no actualizada.
  - >
    En este caso se construyen de manera sintética las curvas IDF a partir 
    de metodologías en función del a precipitación máxima registrada en 24 
    horas en una estación. De acuerdo con el numeral 3.1 y 4.1, y 
    utilizando el ejercicio del numeral inmediatamente anterior de 
    construcción de series de precipitación diaria, para este caso de 
    estudio se opta por tomar los máximos anuales de dicha serie sintética 
    construida para el área de proyecto.
  - >
    En el Gráfico 583 se observan los valores de referencia para el área de 
    proyecto; si bien los valores de las tres subcuencas cercanas son 
    similares, para la estimación de la curva IDF se toma los mayores 
    correspondientes a la subcuenca W440.
  - >
    A continuación, se presentan tres ejercicios realizados para la 
    construcción de curvas IDF a partir de diferentes metodologías, con el 
    fin de determinar criterios de similitud o conveniencia para realizar 
    la selección de la curva IDF a utilizar en el desarrollo de los 
    estudios posteriores.

metodologia_invias:
  - >
    Para Colombia, existen una serie de regionalizaciones que definen 
    magnitudes de los parámetros a, b, m, n para las cinco regiones del 
    país. Una de estas regionalizaciones, es la publicada por el Ministerio 
    de Transporte en el manual de diseños de estructuras de drenaje INVIAS. 
    Para este caso, la ecuación general es modificada para quedar en 
    términos de la precipitación máxima en 24 horas promedio multianual; la 
    ecuación queda así de la siguiente forma.
  - >
    Donde: i= Intensidad de precipitación (mm/h)
  - >
    M=Precipitación máxima promedio anual en 24 h a nivel multianual
  - >
    a, b, c, d=Parámetros de ajuste de la regresión regionalizados.
  - >
    Como valores de precipitación máxima promedio anual 24 h a nivel 
    multianual, se han tomado los registros mencionados en el numeral 
    anterior cuyo promedio multianual es de 126.69 mm. En la Tabla 58 y 
    Gráfico 584 se presentan los resultados de esta metodología.

metodologia_registro_pluviometrico_de_silva:
  - >
    La curva IDF fue calculada a partir de una segunda metodología 
    planteada por Silva. Este método es empleado cuando no se cuenta con 
    información pluviográfica suficiente en la zona y requiere de datos de 
    precipitación máxima en 24 horas, en este caso se toma la información 
    de los máximos estimados en la zona de proyecto en una longitud de 
    serie de 27 años. Cada curva es expresada siguiente forma:
  - >
    Donde: I = Intensidad de la lluvia (mm/h).
  - >
    a, c = Coeficiente particular para cada periodo de retorno.
  - >
    b, n = Coeficientes de la zona. b ≅ 10 minutos, n ≅0.6.
  - >
    El valor numérico de n es del orden de 0.5 y en general está 
    comprendido entre 0.5 y 0.6. En el presente estudio se adoptó el valor 
    de n = 0.6 asociado a lluvias más intensas. La magnitud de b, por su 
    parte, está comprendida entre 5 y 20 minutos; en el presente estudio se 
    adoptó un valor de 10 minutos como valor medio del intervalo 
    recomendado.
  - >
    Este método requiere realizar una conversión adicional, la cual es una 
    relación entre la precipitación máxima en 24 h y la precipitación 
    máxima en una hora. Teniendo en cuenta el lapso de información, como 
    método de validación se utilizará el valor promedio de 126.78 mm de la 
    serie como el equivalente al volumen de escorrentía en un evento de 
    periodo de retorno de 2.33 años y con lo cual se varía el coeficiente 
    de transformación de la lluvia que como se presenta en la memoria de 
    cálculo del Anexo 3.8 se definió en 0.369.
  - >
    Para la serie de datos de precipitación máxima en 24 horas de la 
    estación de medición, se calcula la probabilidad de excedencia según 
    Weibull, para determinar de esta manera el valor de K de la ecuación. 
    El procedimiento y resultados parciales se muestran a continuación, en 
    donde además se aprecia la relación de K con el período de retorno Tr, 
    como se muestra en la el Gráfico 585.
  - >
    Los resultados de la aplicación del método de Silva (1998) para el caso 
    de estudio, arrojaron las curvas IDF para la estación SENA mostrada en 
    el Gráfico 586.

comparacion_de_metodologias:
  - >
    Una vez construidas las curvas IDF a partir de las metodologías 
    descritas anteriormente, se procedió a realizar una comparación gráfica 
    de los resultados para algunos de los periodos de retorno considerados, 
    con el fin de conocer la diferencia de tendencia y comportamiento entre 
    ellas, como se observa en el Gráfico 587.
  - >
    Se observa que para periodos de retorno bajo se tiene la misma 
    tendencia hacia duraciones mayores, mientras que para periodo de 
    retornos medio y altos ya existe una diferencia importante en la 
    magnitud entre las dos metodologías.
  - >
    Para las duraciones iniciales de lluvia el inicio de la curva entre las 
    dos metodologías difiere bastante para todos los periodos de retorno 
    siendo más altos en la INVIAS.
  - >
    Teniendo en cuenta que la metodología de SILVA parte de un análisis 
    estadístico de la serie de valores de precipitación máxima y no solo 
    del promedio como la INVIAS se prefiere el uso de la metodología de 
    SILVA. Además de la experiencia del Consultor que en otros proyectos se 
    ha hecho comparación entre el método de SILVA y curvas IDF construidas 
    a partir de pluviogramas de la estación de estudio, tienen tanto la 
    tendencia como la magnitud similar en comparación al método INVIAS.
  - >
    Por lo anterior, en caso de requerirse un análisis que tenga como 
    insumo la IDF se recomienda utilizar la generada por el método de 
    SILVA.

analisis_hidrologico:
  - >
    El objetivo general del presente capítulo consiste en realizar la 
    estimación hidrológica de la cuenca asociada a las corrientes presentes 
    frente a los eventos de creciente en diferentes periodos de retorno, 
    condiciones medias y otros parámetros que deben desarrollarse.

analisis_de_caudales_medios_balance_hidrico_a_largo_plazo:
  - >
    En este numeral se presenta el cálculo de los caudales medios mensuales 
    a partir de los datos de precipitación, evapotranspiración y 
    temperatura para las cuencas delimitadas asociadas al área de 
    influencia.
  - >
    En este numeral se presenta el cálculo de los caudales medios mensuales 
    a partir de los datos de precipitación, evapotranspiración y 
    temperatura para las cuencas delimitadas asociadas al área de 
    influencia.

rendimiento_hidrico:
  - >
    De acuerdo con la zonificación hidrográfica definida en el numeral 4.2, 
    la Quebrada No. 2 se encuentra en la subzona hidrográfica del río 
    Guatiquía. Según el Estudio Nacional del Agua desarrollado por el IDEAM 
    en el año 2022, se tiene que la cuenca de este cuerpo de agua definido 
    en esta subzona hidrográfica corresponde a 1847 km2 y la oferta 
    disponible es de 3122.7 Mm3 para el año medio, 7728.3 Mm3 para el año 
    húmedo y 1032.4 Mm3 para el año seco, con lo que se obtiene unos 
    rendimientos de 56.61 l/s/km2, 132.68 l/s/km2 y 17.72 l/s/km2 
    respectivamente.
  - >
    Para el caso de la zona de estudio se prevé entonces que para el área 
    de 13.55 km2 del caño Maizaro el caudal medio será aproximadamente de 
    726.4 l/s, el caudal base en época húmeda de 1797.8 l/s y el caudal 
    mínimo en año seco de 240.17 l/s; para el área de 1.10 km2 del caño 
    Danubio el caudal medio será aproximadamente de 59 l/s, el caudal base 
    en época húmeda de 145.9 l/s y el caudal mínimo en año seco de 19.50 
    l/s y por último para el área de 0.26 km2 del caño Calatrava el caudal 
    medio será aproximadamente de 13.9 l/s, el caudal base en época húmeda 
    de 34.5 l/s y el caudal mínimo en año seco de 4.61 l/s. El primer dato 
    será utilizado como medio de validación de la curva de duración de 
    caudales dada la ausencia de instrumentación en la corriente de estudio 
    mientras que el segundo será usado para completar los vacíos de la 
    serie sintética que por las expresiones matemáticas no se puedan 
    utilizar o sean menores a 0.
  - >
