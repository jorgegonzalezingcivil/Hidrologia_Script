indice_de_retencion_y_regulacion_hidrica:
  - >
    El Índice de Retención y Regulación Hídrica (IRH) corresponde a la 
    relación entre un volumen parcial que equivale al área bajo el límite 
    del caudal medio de la CDC y el volumen total equivalente a la 
    sumatoria bajo el área de la CDC, su interpretación es la capacidad de 
    la cuenca para la retención y regulación del agua en términos de 
    estabilidad o déficit. En el Anexo 4 dentro de la memoria de cálculo de 
    análisis hidrológico de la microcuenca se encuentra el cálculo del IRH.
  - >
    El IRH se calcula de la siguiente manera:
  - >
    Donde:𝑄𝑖 = Caudal medio en la posición 𝑖, de una serie ordenada de 
    caudales de mayor a menor (m3/s).
  - >
    𝑄𝑖+1 = Caudal medio en la posición 𝑖+1, de una serie ordenada de 
    caudales de mayor a menor (m3/s).
  - >
    𝑃 𝑒𝑥𝑐 𝑖+1 = Es la probabilidad de excedencia del caudal medio en la 
    posición 𝑖+1 (%).
  - >
    𝑃 𝑒𝑥𝑐 𝑖 = Es la probabilidad de excedencia del caudal medio en la 
    posición 𝑖 (%).
  - >
    Donde:𝑄𝑚𝑒𝑑𝑖𝑜 = Caudal promedio de la serie de datos de caudal (m3/s).
  - >
    𝑃𝑒𝑥𝑐 𝑚𝑒𝑑 = Es la probabilidad de excedencia del caudal promedio de la 
    serie de caudales (%).
  - >
    𝑃𝑒𝑥𝑐 𝑚 = Es la probabilidad de excedencia del caudal medio diario 
    inmediatamente menor al caudal promedio (%).
  - >
    𝑃𝑒𝑥𝑐 𝑚+1 = Es la probabilidad de excedencia del caudal medio diario 
    inmediatamente mayor al caudal promedio (%).
  - >
    Δ𝑃𝑒𝑥𝑐 = Es la diferencia entre probabilidades de excedencia (%).
  - >
    𝑄𝑖 = Caudal medio diario en la posición 𝑖, de la serie ordenada de 
    caudales de mayor a menor (m3/s).
  - >
    𝑄𝑖+1 = Caudal medio diario en la posición 𝑖+1, de una serie ordenada de 
    caudales de mayor a menor (m3/s).
  - >
    𝑄𝑚 = Caudal medio diario inmediatamente menor al caudal promedio de la 
    serie ordenada de caudales (m3/s).
  - >
    𝑄𝑚+1 = Caudal medio diario o mensual inmediatamente mayor al caudal 
    promedio de la serie ordenada de caudales (m3/s).
  - >
    El IDEAM ha clasificado el IRH como se muestra en la Tabla 615. 
    Interpretación IRH.
  - >
    Con los resultados obtenidos del numeral anterior y aplicando las 
    expresiones matemáticas descritas anteriormente, en el Gráfico 617 al 
    Gráfico 619 se presenta el área bajo la curva que da como resultado un 
    IRH de 0.80 para el Caño Maizaro (Alta), de 0.91 para el Caño Danubio 
    (Muy Alta) y de 0.79 para el Caño Calatrava (Alta).
