curva_de_duracion_de_caudales:
  - >
    Para establecer la serie de caudales que presente una confiabilidad 
    determinada generalmente se construyen las curvas de duración de 
    caudales medios diarios de la cuenca en estudio. Estas curvas 
    representan la frecuencia de los caudales diarios registrados en un año 
    determinado con registros completos. El gráfico de duración de caudales 
    diarios se construye en las ordenadas el caudal y en las abscisas el 
    porcentaje del tiempo en el cual el caudal es excedido. En el Gráfico 
    614 al Gráfico 616 se presentan los resultados de la construcción de 
    estas curvas a partir de los resultados del numeral anterior y en el 
    Anexo 4 dentro de la memoria de cálculo de análisis hidrológico de la 
    microcuenca se encuentra el cálculo de la curva de duración de 
    caudales.
