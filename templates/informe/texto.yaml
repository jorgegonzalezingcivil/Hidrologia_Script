caudal_ambiental:
  - >
    El caudal ambiental se define como el volumen por unidad de tiempo que 
    se requiere para mantener el funcionamiento y resiliencia de los 
    ecosistemas acuáticos y provisión de servicios ecosistémicos, con lo 
    que se asocia a la oferta hídrica disponible sobre los cuerpos de agua.
  - >
    El IDEAM y ANLA han definido distintas metodologías para la estimación 
    de este caudal:
  - >
    Q95: Es el caudal con una probabilidad de excedencia del 95% según la 
    curva de duración de caudales de la cuenca, el cual puede ser estimado 
    en series mensuales de acuerdo con el Northern Great Plains Resource 
    Program (NGPRP, 1974).
  - >
    QIRH: Se basa en el índice de retención y regulación hídrica, IRH. Si 
    IRH es menor que 0.7 corresponde al 75% de la CDC; en caso contrario al 
    85%.
  - >
    7Q10: Corresponde al caudal estimado a partir del ajuste de 
    probabilidad para un periodo de retorno de 10 años de caudales mínimos 
    definidos a partir del promedio móvil de siete días en la serie diaria 
    de caudales; este método al requerir caudales a nivel diario se 
    descarta para el estudio ya que no se cuenta con esta información.
  - >
    Tomando los resultados de los numerales anteriores, se definen con las 
    dos metodologías seleccionadas el caudal ambiental se tiene que para el 
    Caño Maizaro el Q95 es de 37.49 l/s y el QIRH es de 231.13 l/s, para el 
    Caño Danubio el Q95 es de 3.04 l/s y el QIRH es de 18.76 l/s y para el 
    Caño Calatrava el Q95 es de 1.06 l/s y el QIRH es de 5.32 l/s. En el 
    Anexo 4 dentro de la memoria de cálculo de análisis hidrológico de la 
    microcuenca se encuentra el cálculo del caudal ambiental.
  - >
    Para efectos de cálculos que tomen como insumo el caudal ambiental, se 
    tomará el QIRH que corresponde al mayor entre los métodos calculados.
