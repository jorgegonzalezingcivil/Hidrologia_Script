# =============================================================================
# APARTADOS NUEVOS
# =============================================================================
# Temas que la cadena produce y que los informes base no cubrian. Se redactan
# con explicacion teorica y resultados, al mismo nivel que los demas.
# -----------------------------------------------------------------------------

analisis_de_dobles_masas:
  - >
    El analisis de dobles masas es la prueba grafica clasica de homogeneidad de
    una serie hidrologica. Consiste en acumular los valores de la estacion que
    se examina frente a los acumulados de un patron construido con las
    estaciones vecinas, y observar la recta resultante: si las condiciones de
    medida no han cambiado, los dos acumulados crecen en proporcion constante y
    los puntos se alinean.
  - >
    Un quiebre en la pendiente de esa recta senala el momento en que la relacion
    entre la estacion y su entorno dejo de ser la misma. Las causas habituales
    son un traslado del instrumento, un cambio de operador o de aparato, el
    crecimiento de obstaculos alrededor del pluviometro o un cambio en el
    procedimiento de lectura. Ninguna de ellas se manifiesta como un dato
    anomalo aislado, y por eso el analisis de datos dudosos no las detecta: la
    serie sigue siendo verosimil, solo que describe dos regimenes de medida
    distintos unidos en un mismo registro.
  - >
    La correccion consiste en multiplicar el tramo afectado por la razon entre
    las dos pendientes, de modo que toda la serie quede referida a un mismo
    periodo de medida. Se corrige el tramo anterior al quiebre y no el
    posterior, porque el mas reciente es el que refleja las condiciones
    actuales de la estacion.
  - >
    Se aplica esta prueba a las {n_estaciones_consistencia} estaciones con
    registro suficiente. El criterio para declarar un quiebre es un cambio de
    pendiente que supere el umbral declarado en la configuracion del estudio y
    que se sostenga sobre un numero minimo de anios, para no confundir un
    quiebre con la variabilidad interanual propia del regimen.

analisis_de_sensibilidad_de_longitud_de_series:
  - >
    La longitud de la serie disponible condiciona todo el analisis posterior. Un
    umbral exigente deja pocas estaciones y concentra el resultado en unas
    pocas ubicaciones; uno laxo admite series cortas cuya media multianual es
    menos representativa del clima. Ninguno de los dos extremos es
    universalmente correcto, y la eleccion debe quedar registrada.
  - >
    Por esa razon el estudio evalua de forma sistematica cuantas estaciones
    sobreviven a cada umbral de longitud y a cada ventana temporal, y presenta
    esa matriz al consultor antes de fijar el criterio. La decision se toma
    sobre el dato y no sobre una convencion heredada.

factor_de_reduccion_por_area:
  - >
    La lamina que entrega el analisis de frecuencia es puntual: corresponde a lo
    que registraria un pluviometro. La lluvia que cae simultaneamente sobre toda
    una cuenca es menor, porque una tormenta no cubre por igual cada punto del
    area en el mismo instante. El factor de reduccion por area corrige esa
    diferencia y crece en importancia con el tamano de la cuenca y con la
    brevedad de la tormenta.
  - >
    El factor que corresponde es el de la DURACION DE DISENO, no el de la lamina
    de veinticuatro horas, y por eso solo puede aplicarse una vez que la lamina
    ha sido desagregada a esa duracion. Aplicarlo antes daria un valor que no
    corresponde a la tormenta que se modela.

diagrama_de_budyko:
  - >
    El diagrama de Budyko representa la fraccion de la precipitacion que
    retorna a la atmosfera frente al indice de aridez, es decir, frente a la
    razon entre la energia disponible para evaporar y el agua disponible para
    ser evaporada. Es la forma adimensional de la formulacion y permite situar
    la cuenca respecto de sus dos limites fisicos.
  - >
    El primero es el limite de agua disponible: no puede evaporarse mas agua de
    la que precipita. El segundo es el de energia disponible: no puede
    evaporarse mas de lo que la radiacion permite. Toda cuenca real cae por
    debajo de ambos, y la curva de Budyko describe la trayectoria media que
    siguen las cuencas del mundo entre esos dos extremos.
  - >
    Situar las subcuencas del estudio en ese diagrama indica en que regimen
    opera la cuenca. Un indice de aridez cercano a la unidad corresponde al codo
    de la curva, que es la zona en que la formulacion es mas sensible a la
    lamina de entrada: alli un error moderado en la precipitacion se traslada
    amplificado a la escorrentia.
  - >
    Conviene una advertencia de lectura. Los puntos se posan sobre la curva
    porque la evapotranspiracion real se calculo con ella, de modo que el
    diagrama comprueba la implementacion y no valida el modelo. Validarlo
    exigiria caudal observado en la cuenca, que este estudio no tiene.

isotermas:
  - >
    El campo de temperatura se obtiene por regresion contra la elevacion y no
    por interpolacion espacial. En terreno montanoso la cota explica la
    temperatura mucho mejor que la vecindad horizontal: dos estaciones separadas
    pocos kilometros pero con varios cientos de metros de desnivel no registran
    temperaturas parecidas.
  - >
    Esa eleccion tiene una consecuencia util. Si la temperatura depende
    linealmente de la elevacion, las isotermas coinciden exactamente con las
    curvas de nivel, y el reparto de area por rango de temperatura se obtiene de
    la distribucion altimetrica de la cuenca sin necesidad de construir un
    raster intermedio ni de introducir una resolucion de celda que no procede de
    ningun dato.
  - >
    El gradiente se ajusta ademas mes a mes, porque su valor cambia a lo largo
    del ano: en temporada seca la radiacion calienta mas las partes bajas y la
    recta se empina, mientras que la nubosidad de la temporada humeda la aplana.
    Un unico gradiente anual repartiria ese efecto por igual entre todos los
    meses.

infiltracion_por_schosinsky:
  - >
    La infiltracion se estima con el modelo analitico de Schosinsky y Losilla,
    que determina la fraccion de la lluvia mensual que entra al suelo a partir
    de tres efectos independientes: la textura del suelo, la pendiente del
    terreno y la cobertura vegetal. Cada uno aporta un coeficiente y su suma,
    acotada a la unidad, es la fraccion que se infiltra.
  - >
    La retencion del follaje se descuenta antes de aplicar ese coeficiente,
    porque esa parte de la lluvia no llega al suelo. Por debajo de una lamina
    mensual minima se retiene toda la precipitacion: no alcanza a mojar el
    follaje lo suficiente para que gotee, y ese mes no aporta infiltracion.
  - >
    La infiltracion basica del suelo, que gobierna el primero de los tres
    coeficientes, se deriva del grupo hidrologico determinado para la cuenca y
    no de valores tomados de estudios de otras zonas. Esa es una diferencia
    deliberada respecto de la practica habitual: un valor de infiltracion
    medido en otro suelo describe ese suelo.

contraste_con_el_estudio_nacional_del_agua:
  - >
    El balance hidrico se cierra sobre si mismo: la precipitacion, la
    evapotranspiracion y el area proceden de la misma cadena de calculo, de modo
    que el resultado seria internamente coherente aunque alguno de esos insumos
    estuviese equivocado. Por esa razon se contrasta el rendimiento obtenido con
    el que el Estudio Nacional del Agua del IDEAM publica para la subzona
    hidrografica, que es un dato ajeno y con otra metodologia.
  - >
    El contraste se hace contra una BANDA y no contra un valor unico. El estudio
    nacional publica la oferta en condicion de ano humedo, medio y seco, y
    comparar contra uno solo de esos valores sugiere una precision que no
    existe: lo que la referencia informa es entre que limites se mueve la
    subzona.
  - >
    Conviene interpretar la comparacion como orden de magnitud y no como
    validacion. Las escalas no son equiparables, porque la subzona abarca un
    area mucho mayor y heterogenea, y las metodologias tampoco coinciden. Una
    cuenca alta rinde por unidad de area mas que el promedio de la subzona a la
    que pertenece, de modo que una diferencia en ese sentido es esperable.

verificacion_de_resultados:
  - >
    Todo estudio hidrologico sin registros de caudal descansa sobre una cadena
    de modelos que no puede validarse de forma directa. Por esa razon se
    incorporan verificaciones cruzadas entre partes independientes del calculo,
    cuyo desacuerdo revela un error que ninguna de ellas detectaria por si sola.
  - >
    Se verifican cuatro coherencias. La primera contrasta la lamina de
    escorrentia que el metodo de perdidas deja disponible con el volumen del
    hidrograma que la transformacion produce: son la misma agua contada de dos
    maneras. La segunda compara el balance hidrico de largo plazo con el
    promedio de la serie mensual, calculados por caminos distintos. La tercera
    contrasta la infiltracion bruta con la escorrentia neta del balance. La
    cuarta compara el rendimiento obtenido con el que publica el Estudio
    Nacional del Agua.
  - >
    Las verificaciones que no cierran se reportan de forma explicita, con su
    magnitud, en el apartado de decisiones que requieren criterio. Un estudio
    que no puede explicar sus discrepancias no es defendible ante interventoria.
