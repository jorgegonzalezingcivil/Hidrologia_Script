    del balance hídrico de una cuenca y se subdivide en dos: 
    evapotranspiración potencial y evapotranspiración real.

evapotranspiracion_potencial:
  - >
    La evapotranspiración potencial es la cantidad máxima de agua que es 
    capaz de perderse en una capa de vegetación verde que se considere 
    continua y de altura corta, bajo la premisa que la cantidad de agua que 
    suministra el suelo es ilimitada.
  - >
    El cálculo de la evapotranspiración potencial (Ep) en mm/mes, se 
    realiza por medio de la siguiente expresión definida por Thronthwaite 
    (1948) descrita en la Nota Técnica 002-2018 del IDEAM titulada 
    “Validación de las fórmulas de evapotranspiración de referencia (Eto) 
    para Colombia”, que se encuentra en función de la temperatura de la 
    estación de medición:
  - >
    Constante que es función del índice de calor anual (a):
  - >
    Para la estación que cuenta con datos de temperatura mensual 
    completados en la totalidad de meses del año se realizó el cálculo de 
    este parámetro a nivel mensual el cual se presenta en el Anexo 4.
  - >
    En el Gráfico 69 se presenta los resultados del cálculo de este 
    parámetro para la zona de proyecto, en donde el valor medio mensual 
    multianual es 125.5 mm, el valor máximo 198.2 mm y el valor mínimo 95.9 
    mm.
