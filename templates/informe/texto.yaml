analisis_de_crecientes:
  - >
    Para las cuencas mencionadas anteriormente en este numeral se realiza 
    la estimación de los caudales de crecientes para periodos de retorno de 
    2.33, 5, 10, 15, 25, 50 y 100 años.

descripcion_del_modelo:
  - >
    Este método se desarrolló empíricamente por el departamento 
    estadounidense de conservación de suelos, en el año 1972, con el fin de 
    estimar las abstracciones (las cuales se refieren principalmente a la 
    intercepción, detención superficial e infiltración) necesarias a la 
    lluvia total que se precipita sobre la cuenca para obtener la 
    precipitación de excesos, que luego conformará la escorrentía 
    superficial directa sobre la cuenca.
  - >
    Con base en lo anterior, se puede decir que el exceso de precipitación 
    o la escorrentía superficial directa es siempre menor o igual a la 
    precipitación total, también que existe una cierta cantidad de 
    precipitación para la cual no ocurrirá escorrentía y por tanto si se le 
    sustrae esta cantidad a la precipitación total es posible obtener la 
    escorrentía potencial.
  - >
    La capacidad de infiltración que tiene el suelo va disminuyendo a 
    medida que pasa el tiempo, debido a esto al momento de separar la parte 
    de la precipitación de excesos en el hietograma de precipitación total, 
    se sugiere seguir una curva descendente que refleja la disminución 
    natural de la capacidad de infiltración.
  - >
    Dicho método, parte de un número de curva de escorrentía (CN), a partir 
    del cual se calculan las pérdidas en la cuenca de una tormenta, donde 
    se incluyen la intercepción, la detención superficial y la 
    infiltración. El número de curva varía en un rango de 1 a 100 y depende 
    de la caracterización de cuatro propiedades productoras de escorrentía 
    de una cuenca hidrográfica.
  - >
    Primero se debe clasificar hidrológicamente el suelo y determinar su 
    potencial de escurrimiento. Según la tasa de infiltración, la 
    distribución de finos y gruesos y condiciones de drenaje se puede 
    establecer que el suelo tenga un potencial bajo, moderadamente bajo, 
    moderadamente alto y alto.
  - >
    Igualmente, el método incluye una clasificación del suelo según su uso 
    y tratamiento. El uso del suelo pertenece a la cobertura de la cuenca 
    (tipo de vegetación, tierras en descanso, usos no agrícolas, cuerpos de 
    agua y superficies impermeables). Por otro lado, el tratamiento del 
    suelo aplica principalmente a los usos agrícolas y las prácticas 
    mecánicas y de manejo que se utilicen.
  - >
    La tercera propiedad productora de escorrentía es la condición 
    hidrológica del suelo, es decir, al porcentaje del área cubierta con 
    pasto natural y la intensidad de pastoreo. Dicha condición debe ser 
    establecida visualmente y debe ser catalogada como pobre (&lt;50% de 
    área cubierta y alta intensidad de pastoreo), aceptable (50% – 75% de 
    área cubierta y media intensidad de pastoreo) y buena (&gt;75% de área 
    cubierta y baja intensidad de pastoreo).
  - >
    Por último, se debe contar con la condición de humedad antecedente 
    según las condiciones de la precipitación total en los 5 días previos a 
    la tormenta de análisis. Esto puede ser seca (AMC I) con una 
    precipitación acumulada de 0 a 3.6 cm y menor potencial de escorrentía, 
    promedio (AMC II) con una precipitación acumulada entre 3.6 y 5.3 cm y 
    húmeda (AMC III) con más de 5.3 cm.
  - >
    Una vez establecidas estas propiedades es posible determinar el número 
    CN siguiendo los cuadros guía de esta metodología.
  - >
    El número CN permitirá, entonces establecer la escorrentía directa a 
    partir de las siguientes expresiones:
  - >
    Dónde:P:Profundidad de Precipitación en cm.
  - >
    Pe: Profundidad de exceso de precipitación en cm.
  - >
    Debido a las distintas condiciones del suelo y coberturas, se puede 
    ponderar el valor de CN respecto al área:
  - >
    Las pérdidas iniciales de la lluvia se estiman a partir de la ecuación 
    de hipótesis que define el método del SCS:
  - >
    Donde Ia se refiere a las pérdidas iniciales antes del encharcamiento, 
    que a su vez se definen como:
  - >
    El hidrograma unitario de una cuenca es el hidrograma de escurrimiento 
    directo, producido por 1 unidad (mm, cm, etc.) de lluvia en exceso, que 
    cae con una intensidad uniforme sobre toda la cuenca durante un tiempo 
    determinado, es un hidrograma típico de la cuenca, que se relaciona con 
    las características de la cuenca (área, forma, pendiente, etc.) que son 
    relativamente constantes.
  - >
    El hidrograma unitario está basado en el supuesto de precipitaciones de 
    características similares (duración, intensidad, distribución, etc.) 
    generan hidrogramas unitarios parecidos. Por lo tanto, las ordenadas 
    del hidrograma son proporcionales al volumen de escurrimiento directo.
  - >
    Si no se cuenta con registros simultáneos de lluvia y escurrimientos, 
    el hidrograma unitario se realiza a partir de alguna de las 
    características fisiográficas de la cuenca. Para esta situación se 
    utilizan los denominados hidrogramas unitarios sintéticos, como el 
    hidrograma Unitario Adimensional del Servicio de Conservación de Suelos 
    (SCS).
  - >
    El SCS de los Estados Unidos propone usar el hidrograma unitario 
    adimensional de la figura mostrada a continuación, basado en la 
    combinación de hidrogramas unitarios en diferentes cuencas en Estados 
    Unidos para diferentes condiciones climatológicas y como sus áreas de 
    drenaje. Para definir el hidrograma unitario adimensional se calcula el 
    caudal pico (qp) y el tiempo al pico (tp) con las expresiones:
  - >
    tc =es el tiempo de concentración, en horas.
  - >
    La forma del hidrograma unitario queda definida al multiplicar los 
    valores de las ordenadas y las abscisas, que aparecen en la siguiente 
    tabla, por q_p y t_p. Para la elaboración del hidrograma se escoge un 
    valor de t/tp y con la tabla anterior se obtiene q/qp. Una vez obtenido 
    este valor y conociendo qp se halla el valor de q, de la relación t/tp, 
    conocido tp se despeja el valor de t.

tiempo_de_concentracion_y_rezago:
  - >
    El tiempo de concentración de la cuenca en estudio se puede definir 
    como el momento en que se encuentra aportando escorrentía desde el 
    punto más alejado de ésta hasta el sitio de descarga de interés. 
    Utilizando las fórmulas definidas por los autores mencionados en el 
    numeral 4.15, en la Tabla 616 a la Tabla 618 se presenta el cálculo 
    para las microcuencas de estudio en el área de influencia. 
    Adicionalmente se calcula el tiempo de rezago que de acuerdo con los 
    autores y desarrolladores del software HEC-HMS; el cual se mencionará a 
    detalle más adelante, el tiempo de rezago para la creciente se ha 
    estimado según los comportamientos típicos de los hidrogramas del SCS 
    como el 60% del tiempo de concentración de la duración de la lluvia de 
    diseño. En el Anexo 5 del informe se encuentran las memorias de cálculo 
    de estos parámetros.

factor_de_reduccion_de_precipitacion:
  - >
    Considerando que la precipitación ocurrida en una tormenta se 
    distribuye sobre toda el área de la cuenca, se han desarrollado curvas 
    de profundidad contra área que promedian la distribución de la lluvia a 
    partir de la localización hipotética de las estaciones de registro.
  - >
    Asumiendo que la duración de la lluvia será 3 horas, para el tamaño de 
    las cuencas en estudio según la Ilustración 65 no sería necesario 
    aplicar algún factor de ajuste por esta condición.

transito_de_crecientes:
  - >
    El hidrograma de una creciente de diseño representa la variación de los 
    caudales en una sección determinada lo cual refleja los efectos de la 
    cuenca aguas arriba de la sección considerada esto con el fin de 
    conocer el comportamiento de la onda producida al pasar a través de la 
    estructura o aguas debajo de la sección estudiada.
  - >
    Conociendo el hidrograma de entrada de dicha sección se busca entonces 
    conocer el hidrograma de salida a través de la ecuación de continuidad, 
    es decir lo que entra debe ser igual a lo que sale como se describe en 
    la Ilustración 66.
  - >
    Existen varios métodos para propagación de crecientes en ríos y 
    canales, pero el utilizado aquí es el método desarrollado por McCarthy 
    en conexión con estudios de propagación del río Muskingum, en Ohio, 
    Estados Unidos, este método hace uso de las ecuaciones de conservación 
    de la masa.
  - >
    El parámetro k puede tomarse como el tiempo que le toma a la onda 
    recorrer el total de la longitud de la sección en estudio. X es una 
    constante que está entre 0 y 0.5, tomando como valor típico 0.2 para 
    quebradas en zona relativamente planas como el caso de estudio.
  - >
    Al no contar con datos de hidrogramas registrados en el volumen de 
    control, el método simplificado para cálculo de la constante K del 
    método de Muskingum se puede estimar de la siguiente manera:
  - >
    Donde: K = Tiempo de recorrido de la onda (seg).
  - >
    C = Celeridad o velocidad media del tránsito (m/s).
  - >
    En la Tabla 619 y Tabla 620 se presentan los datos utilizados para el 
    cálculo de esta condición en las microcuencas Maizaro y Danubio 
    respectivamente del área de influencia, para el Caño Calatrava por su 
    tamaño de cuenca se toma como una creciente instantánea.

  - >
    Los dos parámetros del método se declaran por clase de pendiente del
    tramo y no se derivan de la hidráulica de la sección. La razón es que la
    sección transversal no está levantada: su ancho de fondo procede de una
    regionalización de geometría hidráulica y el coeficiente de Manning es un
    valor adoptado, de modo que el calado normal que resulta al caudal
    ordinario es de apenas 0,18 m y toda la celeridad colgaría de ese
    supuesto. La linealización de Cunge sobre esa misma geometría devuelve
    además un valor de X de 0,497 como mediana de los 62 tramos, es decir
    traslación pura sin atenuación alguna, con dos tramos que exigen recorte
    por resultar negativos.
  - >
    Se adoptan por tanto los valores de la Tabla adjunta, que el consultor
    declara y que el informe sustenta: 0,7 m/s y X de 0,15 en los tramos de
    valle con pendiente menor al 0,5 %; 1,2 m/s y 0,20 entre el 0,5 y el 2 %;
    2,0 m/s y 0,30 entre el 2 y el 5 %; y 3,0 m/s y 0,40 por encima del 5 %.
    El recorrido resultante por el cauce principal es de 7,89 horas sobre
    35,3 km, coherente con el tiempo de concentración de la cuenca.
  - >
    Once tramos resultan con una constante K inferior a la que el intervalo
    de cálculo de cinco minutos puede representar, por ser tramos cuya onda
    los cruza dentro de un solo paso. En ellos K se eleva al mínimo admisible
    y su tránsito queda sobrestimado en menos de un intervalo. Reducir el
    intervalo los resolvería, pero alteraría el tiempo de rezago de todas las
    subcuencas, que por el criterio adoptado depende de él.


verificacion_de_crecientes:
  - >
    Los caudales del modelo se contrastan contra los registros de caudal de
    las estaciones que la Corporación Autónoma Regional opera dentro de la
    cuenca. El contraste se realiza sobre el ajuste de frecuencia de los
    máximos anuales de cada estación y se limita a los periodos de retorno
    que la longitud de su registro sostiene, para no comparar dos
    extrapolaciones entre sí.
  - >
    LA PRUEBA ES DE UN SOLO LADO Y ASÍ DEBE LEERSE. Los registros que la
    Corporación entrega son máximos absolutos de caudales medios diarios, y
    el pico instantáneo de una creciente supera siempre a la media del día
    en que ocurre, en un factor que estos datos no permiten conocer. En
    consecuencia, un caudal modelado por debajo del valor observado
    demuestra que el modelo se queda corto, mientras que un caudal por
    encima no demuestra nada: el pico real puede estar tanto o más arriba.
    Se comprobó que las estaciones limnigráficas no presentan máximos más
    agudos que las limnimétricas, lo que indica que la entidad reporta el
    mismo estadístico para ambas clases.
  - >
    De las tres estaciones emparejadas con nodos del modelo, Puente Francis
    no dispone de serie de máximos de caudal. Puente La Calera cuenta con
    dieciocho años de registro, pero se encuentra cuatro kilómetros aguas
    abajo del embalse de San Rafael y su serie no es homogénea: el caudal
    medio mensual desciende de 2,2 m³/s en el periodo 1991-2002 a 0,02 m³/s
    en 2013 y 2014, y los máximos anuales siguen el mismo quiebre. Lo que
    esa estación mide es la operación del embalse y no la respuesta de su
    área aferente, de modo que se presenta como contexto y no se emplea como
    criterio de calibración.
  - >
    Simaya es la única estación del estudio situada sobre una rama no
    regulada, con 64,35 km² aferentes. Su registro es de nueve años
    utilizables, por debajo de los quince que el estudio exige para
    verificar, de manera que se contrasta como INDICATIVA: aporta cobertura
    sobre una parte de la cuenca que de otro modo quedaría sin contraste
    alguno, pero no sostiene por sí sola ninguna decisión de parámetros,
    porque con tan pocos años el ajuste lo decide un solo año extremo.
  - >
    Frente a Simaya el modelo supera la cota inferior en todos los periodos
    contrastados, de manera que nada en el registro lo contradice. La
    diferencia entre el pico modelado y el máximo diario observado no puede
    interpretarse como error, por la razón expuesta: son dos magnitudes
    distintas y su cociente es desconocido.
  - >
    Se examinó igualmente la estación El Vergel, situada aguas abajo del
    sitio de proyecto y con mayor área aferente, como referencia por
    transposición. Su serie presenta un comportamiento que impide usarla como
    criterio: los caudales crecen 2,23 veces entre los periodos de retorno de
    2,33 y 100 años, mientras que la precipitación de diseño crece 2,28 veces
    en ese mismo intervalo. Una distribución de crecientes que no crece más
    rápido que su propia lluvia no corresponde a una cuenca en régimen
    natural, puesto que el coeficiente de escorrentía aumenta con la
    magnitud del evento y las crecientes deben crecer más que la
    precipitación que las produce. El comportamiento observado se explica por
    la regulación del embalse situado aguas arriba, por saturación de la
    curva de gasto o por truncamiento de la cola superior del registro.
    Ajustar el modelo hasta reproducir esa serie equivaldría a obligarlo a
    imitar un régimen regulado.
  - >
    En consecuencia, la verificación disponible acota el resultado por
    debajo y no permite fijar un factor de corrección. El caudal de diseño
    adoptado descansa sobre los criterios declarados en los apartados
    anteriores, cada uno sustentado, y satisface la cota inferior que los
    registros imponen. La comprobación definitiva de su magnitud corresponde
    a la modelación hidráulica del tramo de interés, donde se verificará que
    la sección admita el caudal estimado.
  - >
    Se recomienda solicitar a la Corporación los registros sub-diarios de la
    estación limnigráfica El Vergel para los años de los máximos anuales.
    Conocida la relación entre el pico instantáneo y la media diaria en este
    río, el contraste dejaría de ser una cota y pasaría a ser una
    verificación directa.

construccion_del_modelo:
  - >
    El modelo incorpora el embalse de San Rafael como elemento de
    almacenamiento en el nodo que reúne los 76,21 km² que drenan a él, es
    decir el 35 % del área de la cuenca. La cartografía de cobertura empleada
    lo clasifica como laguna natural y no como embalse, de modo que su
    condición de cuerpo regulado no procede de los insumos sino del
    conocimiento del sitio.
  - >
    No se dispone de la curva de embalse, de la geometría del vertedero ni
    del registro de operación. Se adopta en consecuencia la hipótesis
    desfavorable aguas abajo: el embalse se encuentra lleno a la cota de la
    cresta, no queda almacenamiento útil y lo único que ocurre durante la
    creciente es su tránsito sobre el vertedero. Un embalse con volumen
    disponible amortiguaría más, de manera que el supuesto no puede quedarse
    corto. La relación almacenamiento-descarga se construye con el espejo de
    agua medido sobre la cobertura, de 2,30 km², y una cresta de 8 m
    declarada por el consultor.
  - >
    Con esa parametrización el embalse reduce el caudal de 50,02 a
    5,52 m³/s para el periodo de retorno de 100 años y desplaza su punta muy
    por detrás del pico de la cuenca, de modo que su aporte deja de
    coincidir con la creciente. El caudal en el sitio de proyecto resulta
    insensible a la longitud de cresta adoptada, porque el efecto del
    embalse consiste en retirar esos 76 km² de la formación del pico y no en
    aportar un caudal determinado.
  - >
    Debe advertirse una incoherencia que los datos disponibles no resuelven.
    Con la cresta declarada el embalse no puede descargar más de 5,5 m³/s en
    la creciente de cien años, mientras que la estación Puente La Calera,
    situada cuatro kilómetros aguas abajo, registró 51,5 m³/s en 2012. Para
    evacuar ese caudal por la cresta harían falta 2,2 m de lámina sobre el
    vertedero, que la lluvia local no puede producir. La explicación
    plausible es la descarga de fondo o el trasvase desde otra cuenca, y en
    cualquiera de los dos casos confirma que esa estación registra operación
    del embalse y no respuesta natural de su área aferente.
  - >
    Para la ejecución de este modelo lluvia-escorrentía, se utiliza el 
    programa Hydrologic Modelling System (HEC-HMS), el cual mediante una 
    serie de pasos ordenados construye el modelo de acuerdo con la 
    información de la cuenca y de precipitación.
  - >
    El HEC-HMS es un programa de simulación hidrológica desarrollado para 
    estimar los hidrogramas de salida en una cuenca a partir de condiciones 
    extremas de lluvias, aplicando para ello métodos de cálculo de 
    hietogramas de precipitación efectiva, pérdidas por infiltración, 
    comportamiento del flujo base y conversión en escorrentía directa. El 
    programa se compone de una interfaz gráfica para el usuario que le 
    permite introducir la información necesaria para la simulación, manejar 
    los parámetros de análisis hidrológico a través de módulos integrados y 
    obtener gráficas o tablas con los resultados. El programa trabaja con 
    tres módulos básicos que se describen a continuación:
  - >
    Módulo de la cuenca: Permite la construcción del sistema de drenaje de 
    la cuenca con elementos de conexión y generación de caudales, así como 
    la inclusión de las características morfométricas para cada uno de los 
    elementos del sistema.
  - >
    Módulo de precipitación: Se encarga de seleccionar los patrones de 
    precipitación del evento de tormenta que se desea estudiar, incluyendo 
    la introducción manual de los datos de la lluvia de diseño.
  - >
    Módulo de control: En este módulo se configuran las fechas de inicio y 
    culminación de los datos de lluvia y caudal para la simulación y los 
    intervalos de tiempo para realizar los cálculos, también permite la 
    creación de escenarios de simulación según los casos que se quiera 
    evaluar.
  - >
    De las opciones que proporciona el programa para el cálculo del 
    hidrograma se escogió para el Método de Pérdidas de lluvia el SCS Curve 
    Number (en este elemento del software se realiza el cálculo de la 
    abstracción inicial automáticamente) y para el Método de Transformación 
    de lluvia neta a escorrentía directa el SCS Unit Hydrograph.
  - >
    Con el fin de representar adecuadamente los hidrogramas generados 
    incluyendo el tránsito en las microcuencas, se realizó una división a 
    nivel de subcuencas cuyo único objetivo es mejorar la aproximación de 
    la modelación, en la Ilustración 67 a la Ilustración 69se presenta el 
    modelo construido para la microcuenca del área de influencia. Las 
    características de cada cuenca fueron tomadas de los resultados de 
    análisis del capítulo 4 de este informe.

conclusiones:
  - >
    Se delimitó y caracterizó la cuenca para el Caño Maizaro (13.55 km2), 
    Caño Calatrava (0.26 km2) y Caño Danubio (1.10 km2) considerándose como 
    una microcuenca.
  - >
    Al no tener registros de caudales o niveles sobre la corriente de 
    estudio se realizó el balance hidrológico por la metodología de largo 
    plazo de Budyko obteniendo un caudal medio multianual de 724.14 l/s 
    para el Caño Maizaro, 58.40 l/s para el Caño Danubio y 13.81 l/s para 
    el Caño Calatrava.
  - >
    El caudal ambiental se estimó en 37.49 l/s para el Caño Maizaro, 18.76 
    l/s para el Caño Danubio y 5.32 l/s para el Caño Calatrava.
  - >
    Se realizó el análisis de crecientes para las corrientes de Agua que se 
    encuentra en el área de influencia del proyecto, con caudales de 
    crecientes entre 2.33 y 100 años de periodo de retorno en el rango de 
    82.56 m3/s a 149.90 m3/s para el Caño Maizaro, 9.68 m3/s a 16.73 m3/s 
    para el Caño Danubio y 2.47 m3/s a 4.45 m3/s para el Caño Calatrava.

