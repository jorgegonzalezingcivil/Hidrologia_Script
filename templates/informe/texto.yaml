    evaporarse desde el suelo completamente cubierto por vegetación 
    desarrollado en óptimas condiciones y sin limitaciones en la 
    disponibilidad de agua, este proceso es la combinación de dos tipos de 
    superficie: la evaporación del agua en la vegetación, suelo o cuerpos 
    de agua, y la transpiración de las plantas.
  - >
