modelo_lluvia_escorrentia:
  - >
    Debido a que no se cuenta con estaciones de medición de caudales o 
    niveles en la corriente de estudio con la que se pudiera calibrar un 
    modelo hidrológico tipo SMA o GR4J, la Consultoría adoptó la 
    metodología de balance hídrico a largo plazo de Budyko (1977) quien 
    derivó una ecuación para la evapotranspiración en términos de funciones 
    hiperbólicas.
  - >
    Los argumentos relacionan la energía total disponible con la energía 
    requerida para evaporar toda la precipitación anual. La ecuación fue 
    probada con una amplia variedad de ríos en Europa, con valores 
    observados de evaporación y de escorrentía al realizar el balance 
    hídrico.
  - >
    Esta metodología fue utilizada para la estimación de la oferta hídrica 
    en Colombia desde el estudio Nacional del Agua del año 2010 (ENA). Las 
    principales hipótesis del modelo son:
  - >
    En el largo plazo los cambios en el almacenamiento de la cuenca son 
    despreciables en comparación con los valores medios de precipitación, 
    evapotranspiración y escorrentía.
  - >
    Del agua que cae en un determinado sitio (P) parte de este volumen 
    vuelve a la atmosfera ya sea por evaporación directa o 
    evapotranspiración (ETR).
  - >
    Otra parte del volumen de la precipitación escurre por la superficie de 
    la cuenca (E), el cual fluye hasta alcanzar cauces principales.
  - >
    Una parte de la escorrentía se infiltra (I)en el terreno y se incorpora 
    al sistema de aguas subterráneas de la zona.
  - >
    Donde: P = Precipitación total mensual (mm).
  - >
    ETR = Evapotranspiración real mensual (mm).
  - >
    Además, la evapotranspiración real nunca sobrepasa la 
    evapotranspiración potencial. Si no hay precipitación, entonces E y ETP 
    deben ser iguales a cero. Similarmente, a medida que P alcance valores 
    altos, la evapotranspiración real se aproxima en forma asintótica a la 
    evapotranspiración potencial.
  - >
    Teniendo en cuenta de los resultados obtenidos en cuanto a los 
    parámetros de evapotranspiración, infiltración y precipitación, para el 
    cálculo de los caudales medios para la cuenca, se realiza la aplicación 
    de la siguiente ecuación:
  - >
    Debido a las limitaciones que se tienen en las mediciones hidrológicas 
    directas, es necesario implementar modelos lluvia – escorrentía, los 
    cuales proporcionan una predicción o extrapolación cuantitativa que 
    puede ser útil en la toma de decisiones, especialmente en cuencas que 
    no han sido calibradas. Para el cálculo de los hidrogramas se utilizó 
    el modelo del Soil Conservatión Service (S.C.S.) de los Estados Unidos 
    de América.
  - >
    Debido a que no se cuenta con estaciones de medición de caudales o 
    niveles en la corriente de estudio con la que se pudiera calibrar un 
    modelo hidrológico tipo SMA o GR4J, la Consultoría adoptó la 
