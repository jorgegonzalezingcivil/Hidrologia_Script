infiltracion:
  - >
    El análisis de infiltración se realizará mediante la metodología 
    propuesta por Gunther Schosinsky &amp; Marcelino Losilla en su estudio 
    “MODELO ANALÍTICO PARA DETERMINAR LA INFILTRACIÓN CON BASE EN LA LLUVIA 
    MENSUAL” del año 1999, el cual presenta un método simplificado del 
    cálculo de este parámetro teniendo como base la precipitación mensual 
    registrada y la infiltración básica, con variables como el tipo de 
    cobertura y la intercepción del follaje.
  - >
    La modelación matemática de este método es la siguiente:
  - >
    Donde: I = Infiltración mensual (mm/mes).
  - >
    Donde:Kfc = Fracción que se infiltra por efecto de la textura del 
    suelo.
  - >
    Kp = Fracción que se infiltra por efecto de la pendiente.
  - >
    Kv = Fracción que se infiltra por efecto de la cobertura vegetal.
  - >
    Donde: fc = Infiltración básica del suelo (mm/día).
  - >
    Los coeficientes Kp y Kv que dependen de la cobertura y condiciones de 
    terreno se toman también de dicho estudio y se presentan en la Tabla 
    64.
  - >
    Se requiere de los valores de infiltración básica o capacidad de 
    infiltración en el suelo, que al ser un parámetro especifico generado a 
    partir de ensayos de laboratorio en diferentes puntos de la cuenca a 
    través de estudios especializados es difícil de obtener, por lo cual se 
    tomaron valores de referencia en la literatura y estudios en la región 
    para suelos hidrológicos Tipo C.
  - >
    Teniendo en cuenta la ausencia de datos puntuales se asume como valor 
    de infiltración básica el valor límite máximo de 38 mm/hr como 
    condición crítica para los cálculos.
  - >
    En la Tabla 66 se presenta los parámetros seleccionados a utilizar para 
    el cálculo de la infiltración, es de anotar que dichos valores ya 
    fueron utilizados como mecanismo de validación de los resultados del 
    caudal medio como se explicará más adelante. De igual manera, se 
    observa que como componente del balance hídrico la infiltración tiene 
    un gran impacto ya que la cuenca se satura rápidamente en los eventos 
    de lluvia por lo que genera caudales importantes respecto al tamaño de 
    las cuencas.
  - >
    A continuación, se presentan los resultados para las microcuencas en 
    estudio en la zona de influencia.
