version: 2

introduccion:
  - >
    Constructora AMARILO SAS mediante orden de servicio AOC71597 solicitó a 
    INCOHISA SAS el desarrollo de los estudios hidrológicos y modelación 
    hidráulica del cauce del proyecto Plan Parcial Juanambú dentro del cual 
    se encuentran cuatro cuerpos de agua: Caño Maizaro, Caño Calatrava, 
    Caño Danubio y el léntico que se denominará para este estudio Lago 
    Juananmbú.
  - >
    El proyecto se encuentra en el sector suroccidental de la ciudad de 
    Villavicencio, específicamente en las coordenadas Este 1053521.88 y 
    Norte 948935.64.
  - >
    En primera medida este informe corresponde a la actualización parcial 
    del estudio hidrológico desarrollado previamente para la totalidad del 
    proyecto y se enmarca como punto de partida los cambios en el lecho de 
    los cauces y la ampliación de las series históricas de precipitación; 
    con la información topo batimétrica actualizada en el sitio de proyecto 
    de realiza la modelación hidráulica de cada cauce para definir los 
    niveles de lámina de agua para las crecientes estimadas en la 
    actualización del estudio hidrológico y en la definición de la 
    extensión de la mancha de inundación.
  - >
    Por último, se presenta las recomendaciones técnicas pertinentes para 
    el diseño de detalle de las estructuras de cruce de quebradas y control 
    de las inundaciones para no afectar las manzanas de vivienda.
  - >
    En los anexos del informe se encuentra toda la información base 
    utilizada, mapas temáticos, modelos construidos y memorias generadas 
    para el objeto de la Consultoría.

descripcion_del_sistema_hidrico_en_el_sitio_de_proyecto:
  - >
    El sistema hídrico en el área de proyecto del Plan Parcial Juanambú se 
    compone de cinco elementos que se describen a continuación:
  - >
    Caño Maizaro: Es el cuerpo de agua de mayor magnitud dentro del área de 
    estudio, se encuentra ubicado en el sector norte y fluye en dirección 
    occidente – oriente. La longitud del cauce dentro del proyecto es de 
    1370 m. En el límite de intervención del proyecto recibe las aguas que 
    descargan por el Descole 1 y 2 del Lago Juanambú; en este sentido se 
    convierte en el punto de control de estas corrientes. Actualmente 
    cuenta con un pontón que permite el cruce por el cauce en las 
    coordenadas E 1053598.11 N 949334.42.
  - >
    Caño Danubio: Es el cuerpo de agua que en magnitud le sigue al Caño 
    Maizaro dentro del área de estudio, se encuentra ubicado en el sector 
    sur y fluye en dirección occidente – oriente. La longitud del cauce 
    dentro del proyecto es de 743 m. Descarga su caudal en el Lago 
    Juanambú; en este sentido está controlado por el nivel del agua de este 
    cuerpo de agua léntico. Actualmente cuenta con un box culvert de 
    dimensiones 2.50x2.56x14.30m que permite el cruce por el cauce en las 
    coordenadas E 1053433.38 N 948795.101.
  - >
    Caño Calatrava: Es el cuerpo de menor magnitud dentro del área de 
    estudio, se encuentra ubicado geográficamente entre el Caño Danubio y 
    el Caño Maizaro y fluye en dirección occidente – oriente. La longitud 
    del cauce dentro del proyecto es de 818 m. Descarga su caudal en el 
    Lago Juanambú; en este sentido está controlado por el nivel del agua de 
    este cuerpo de agua léntico. Actualmente cuenta con un box culvert de 
    dimensiones 2.56x2.50x15.00m que permite el cruce por el cauce en las 
    coordenadas E 1053275.62 N 949129.35.
  - >
    Lago Juanambú: Dentro del predio del sitio de proyecto se encuentra un 
    cuerpo léntico que se denominará Lago Juanambú, el cual se compone de 
    dos vasos interconectados que reciben las aguas del Caño Calatrava y el 
    Caño Danubio, luego del tránsito dentro de este se rebosan las aguas 
    por medio de cuatro vertederos de diferentes longitudes, tres de ellos 
    descargan a dos cauces que se determinan como el Descole 1 y Descole 2, 
    que posteriormente se unen para entregar el flujo al Caño Maizaro en el 
    límite de intervención del proyecto.
  - >
    Descole Lago 1: Esta corriente corresponde a la que recibe las aguas 
    del vertedero del sector secundario del Lago Juanambú y tiene una 
    longitud de 130 m aproximadamente, fluye en sentido occidente – oriente 
    y está controlado por una estructura que se compone por 4 alcantarillas 
    de 36’’ de diámetro.
  - >
    Descole Lago 2: Esta corriente corresponde a la que recibe las aguas 
    del vertedero del sector principal del Lago Juanambú y tiene una 
    longitud de 210 m aproximadamente, fluye en sentido occidente – oriente 
    y está controlado por una estructura que se compone por 7 alcantarillas 
    de 36’’ de diámetro.
  - >
    Confluencia Descole: Las corrientes de Descole 1 y 2 del Lago Juanambú 
    confluyen en el sitio de coordenadas E 1053843.38 N 949045.14 donde 
    fluye a través de 125 m aproximadamente hasta entregar las aguas en el 
    Caño Maizaro.
  - >
    De acuerdo con lo anterior, la estimación de caudales se realizará para 
    el Caño Maizaro, Caño Danubio y Caño Calatrava que son los asociados a 
    cuencas aportantes.
  - >
    La modelación hidráulica se trabajará de manera conjunta con todos los 
    cuerpos de agua teniendo en cuenta la conectividad hídrica que existe 
    entre ellos.

informacion_base:
  - >
    Se realizó la consulta de información secundaria perteneciente a 
    distintas entidades como los son el IGAC, IDEAM y CORMACARENA, con el 
    fin de obtener los insumos primarios para los análisis del estudio 
    hidrológico.

informacion_hidroclimatologica:
  - >
    En la información recolectada se identificaron las estaciones hidro 
    climatológicas existentes a nivel regional, que rodearan 
    geográficamente el área objeto del presente estudio. Las estaciones 
    consultadas corresponden al registro de la red meteorológica existente 
    del IDEAM.
  - >
    Se realizó la consulta en la plataforma digital de la autoridad 
    ambiental competente CORMACARENA, sin embargo, a la fecha de desarrollo 
    de este estudio en el geoportal no se cuenta con información disponible 
    a utilizar.
  - >
    Se realizó la consulta en la red meteorológica del IDEAM la cual cuenta 
    con varias estaciones cercanas al sitio de proyecto de tipo climáticas 
    y de medición de lluvia, en la Ilustración 31 se presenta su 
    identificación en la plataforma digital de la entidad
  - >
    Con el fin de hacer un análisis regional para la zona de proyecto, se 
    seleccionaron preliminarmente las estaciones del IDEAM que 
    geográficamente se encuentran de manera aferente al área de influencia 
    delimitada las cuales fueron utilizadas posteriormente según su calidad 
    y cantidad de registros.
  - >
    En la Ilustración 32 se presenta la localización de las estaciones 
    identificadas dentro de la zona de estudio; en el Anexo 1 Información 
    Hidroclimatológica se presenta los datos crudos de estas.
  - >
    En la Tabla 31 se presentan las características de las estaciones 
    identificadas en el área de influencia definida. En el Gráfico 31 se 
    presenta la longitud teórica de las series de acuerdo con las fechas de 
    instalación y suspensión reportadas en la base de datos del IDEAM.
  - >
    En la Tabla 32 se observa el cálculo de la cantidad teórica de la 
    longitud de las series de las estaciones identificadas en el área de 
    influencia, definiendo también la cantidad de años en una ventana de 
    tiempo definida desde el año 1980 hasta la fecha suponiendo que es 
    donde se tiene un periodo uniforme de registros, así como el inicio de 
    la ocurrencia de fenómenos climatológicos que afectan el régimen de 
    precipitación y temperaturas.
  - >
    Con lo anterior se realiza un primer filtro teniendo con el criterio 
    que la longitud teórica de series sea mayor a 15 años desde la ventana 
    de tiempo de 1980 a diciembre de 2023; en la Ilustración 33 se presenta 
    la localización de las estaciones seleccionadas para continuar con el 
    análisis.
  - >
    Para el caso específico del parámetro de precipitación se tiene que 
    para las estaciones que la registran (tipo AM, CO, CP, PG, PM, SP o SS) 
    se tienen 13 estaciones, como se observa en la Ilustración 34.
  - >
    En el caso específico del parámetro de temperatura se tiene que para 
    las estaciones que la registran (tipo AM, CO, CP, SP o SS) se tienen 4 
    estaciones, como se observa en la Ilustración 35.
  - >
    En el caso específico del parámetro de temperatura se tiene que para 
    las estaciones que la registran (tipo AM, CO o CP) se tienen 2 
    estaciones, como se observa en la Ilustración 36.
  - >
    Con estas estaciones se procederá a realizar los respectivos análisis y 
    procesamiento de calidad de las series descritos en numerales 
    posteriores.
  - >
    En el Anexo 1.1 se presenta la información de crudos descargado desde 
    la plataforma del IDEAM y en el Anexo 1.3 la información organizada en 
    forma de resumen de los datos registrados.

informacion_cartografica:
  - >
    La información cartográfica para el desarrollo del presente estudio fue 
    tomada de la base de datos del IGAC a escala 1:10000, donde se consultó 
    principalmente para los estudios de hidrología la información de curvas 
    de nivel y drenajes delimitados por la entidad para realizar un 
    análisis regional de precipitación. También se utilizó la información 
    de planchas a escala 1:25000 para poder identificar de mejor manera los 
    drenajes de la zona de estudio.
  - >
    Como complemento se utilizó la información de imágenes satelitales del 
    satélite ALOS PALSAR de la NASA que provee modelos digitales de terreno 
    a una resolución de 12.5x12.5m. En la Ilustración 37 se observa la 
    extensión de área de las imágenes descargadas.
  - >
    En el Anexo 2 Información Cartográfica se incluyen las planchas y 
    archivos descargados.

informacion_topografica_y_batimetrica:
  - >
    Se recibió por parte de Constructora Amarilo la información de los 
    planos topográficos donde se incluyen la superficie de terreno y 
    batimetría del caño Maizaro, caño Calatrava, Caño Danubio y el Lago 
    Juanambú correspondiente al levantamiento realizado en el mes de 
    febrero de 2024. Se asume que entre ese momento y el desarrollo de este 
    estudio no se tiene cambios en las características del terreno. En el 
    Anexo 8 del informe se presenta la base utilizada.

informacion_estudio_de_suelos:
  - >
    Para los análisis de socavación se utiliza los resultados del estudio 
    de suelos realizado en el proyecto de fecha 2015 y que se adjuntan en 
    el Anexo 13 de este informe.

caracterizacion_morfometrica_de_la_cuenca:
  - >
    En este numeral se realiza la descripción de las características de la 
    cuenca hidrográfica en estudio.

delimitacion_de_la_cuenca:
  - >
    Como se menciona anteriormente, en el sitio de proyecto se cuenta con 
    tres cuerpos de agua loticos: Caño Maizaro, Caño Calatrava y Caño 
    Danubio que estos dos últimos descargan en uno lentico que corresponde 
    a un lago.
  - >
    Para las tres corrientes se realizó la delimitación de la cuenca 
    utilizando como insumo topográfico la base cartográfica del numeral 3.2 
    para identificar los drenajes existentes, donde se tomaron las curvas 
    de nivel del modelo digital de terreno regional ALOS PALSAR.
  - >
    Mediante la ayuda de un software especializado de geoprocesamiento que 
    puede realizar el procedimiento a través de análisis espaciales de 
    divisoria de agua y direcciones de flujo se realizó la delimitación de 
    las cuencas con el punto de descarga definido donde confluyen los 
    drenajes que se encuentran dentro del área de influencia del proyecto.
  - >
    En primera instancia se realiza una adecuación del DEM utilizando los 
    drenajes conocidos de la cartografía IGAC 1:25.000, esto para forzar 
    que en el geoprocesamiento de definición de acumulación del flujo se 
    generen los drenajes de forma correcta. En la Ilustración 41 se 
    ejemplifica el ejercicio realizado donde se evidencia que se ha marcado 
    de manera especial los drenajes de la zona de estudio.
  - >
    En la Ilustración 42 se presenta los resultados del ejercicio de 
    delimitación de la cuenca hasta el sitio de proyecto.
  - >
    A partir de esto y con el fin de tener en cuenta el tránsito de la 
    creciente a pesar del pequeño tamaño de la cuenca, por medio de 
    herramientas SIG se delimitaron subcuencas para la construcción del 
    modelo hidrológico, como se observa en la Ilustración 43.

zonificacion_hidrografica:
  - >
    Se realizó la consulta para los cuerpos de agua en la zonificación 
    hidrográfica del IDEAM para identificar más subniveles que definan la 
    codificación de las subcuencas mencionadas en el numeral anterior. Se 
    determina que la zonificación hidrográfica se tiene hasta un subnivel 
    III. De acuerdo con la Ilustración 44 se tiene que las cuencas se 
    encuentran en el área hidrográfica del Orinoco, zona Meta y subzona 
    hidrográfica río Guaitiquía.

area_de_drenaje_de_la_cuenca:
  - >
    Se considera como el área plana incluida dentro de las divisorias 
    topográficas de la cuenca. El área estimada de drenaje para las cuencas 
    según las divisorias de aguas morfológicas y los puntos principales de 
    interés para el proyecto, de acuerdo con la delimitación del numeral 
    previo. En la Tabla 41 se presentan los valores calculados de área de 
    cuenca.
  - >
    De acuerdo con el Centro Interamericano de Desarrollo Integral de Aguas 
    y Suelos las áreas de drenaje se clasifican en: Sistema hidrográfico (+ 
    de 300.000 ha), Cuencas (60.000 - 300.000 ha), Subcuencas (10.000 - 
    60.000 ha) y Microcuenca (&lt; 10.000 ha); según lo anterior, para las 
    delimitaciones realizadas en la zona de proyecto corresponde a 
    microcuencas.

perimetro_de_la_cuenca:
  - >
    El perímetro de la cuenca corresponde a la longitud perimetral de 
    acuerdo con la divisoria de aguas. Para las microcuencas delimitadas en 
    la Tabla 42 se presentan los valores calculados de perímetro de cuenca.

longitud_del_cauce_principal:
  - >
    Se denomina a la distancia planimétrica del cauce principal desde su 
    punto de inicio hasta la descarga de la cuenca. Para las microcuencas 
    delimitadas en la Tabla 43 se presentan los valores calculados según 
    los drenajes delimitados.

longitud_axial_de_la_cuenca:
  - >
    La longitud axial de la cuenca es la distancia planimétrica desde el 
    punto más alejado y la descarga de la cuenca en el punto analizado. 
    Para las microcuencas delimitadas en la Tabla 44 se presentan los 
    valores calculados.

coeficiente_de_forma:
  - >
    Se define como la relación entre el ancho medio y la longitud axial de 
    la cuenca cuya magnitud es la que se mide desde el curso de agua más 
    largo desde la desembocadura hasta el punto más distante de la cuenca 
    (Monsalve Sáenz, 1999).
  - >
    Se tiene la clasificación de la valoración de este parámetro de acuerdo 
    con Horton como se muestra en la Tabla 45.
  - >
    Para las microcuencas delimitadas en la Tabla 46 se presentan los 
    valores calculados de área de cuenca.
  - >
    Se tienen clasificaciones similares para las microcuencas predominando 
    una tendencia a generar crecientes con hidrogramas cuyo pico es 
    distribuido durante el evento de lluvia (Tipo A Ilustración 45).

coeficiente_de_compacidad:
  - >
    También conocido como el Índice de Gravelius, es un parámetro que 
    presenta la relación entre el perímetro de la cuenca y la longitud de 
    la circunferencia de un círculo que tiene un área igual a ésta 
    (Monsalve Sáenz, 1999). El coeficiente mínimo es uno para una cuenca 
    circular, por lo que entre mayor sea el valor de KC, la superficie será 
    más irregular y según la literatura tendrá menos posibilidad de 
    generación de crecientes.
  - >
    Para las microcuencas delimitadas anteriormente en la Tabla 48 se 
    presentan los valores calculados.

indice_de_sinuosidad:
  - >
    Se define como la relación entre la longitud real del río principal de 
    la cuenca y la longitud de este en medido de forma curva o recta. 
    Valores iguales o menores a 1.25 indican que el cauce de la cuenca 
    tiene una baja sinuosidad.
  - >
    Dónde:L = Longitud real del cauce principal (km).
  - >
    Lt = Longitud del cauce principal en línea recta o curva (km).
  - >
    Para las microcuencas delimitadas en la Tabla 4 30 se presentan los 
    valores calculados.

desnivel_altitudinal:
  - >
    Este valor se define como la diferencia entre la cota superior e 
    inferior del cauce principal en estudio que sirve como insumo para el 
    cálculo de la pendiente media de la corriente. Para las microcuencas 
    delimitadas en la Tabla 411 se presentan los valores calculados.

pendiente_media_del_cauce_principal:
  - >
    La velocidad de la escorrentía de las corrientes de agua en una cuenca 
    hidrográfica depende de la pendiente de los cursos fluviales, en cuanto 
    mayor valor de pendiente se tenga mayor será la magnitud de la 
    velocidad de flujo, siendo este elemento factor característico del 
    tiempo de respuesta de la cuenca ante determinada precipitación. Para 
    el cálculo de la pendiente de la cuenca se realizó mediante la 
    obtención de valores de desnivel entre el inicio y fin del cauce y 
    posteriormente dividiéndola entre su longitud.
  - >
    Para las microcuencas delimitadas en la Tabla 413 se presentan los 
    valores calculados.
  - >
    Para las microcuencas delimitadas la pendiente del cauce principal se 
    asocia en su eje a terrenos relativamente planos.

pendiente_media_de_la_cuenca:
  - >
    Para el cálculo de la pendiente de la cuenca se realizó mediante a 
    obtención de valores representativos de las pendientes de los terrenos 
    de la cuenca asociadas a un vector, distribuyendo porcentualmente los 
    valores de pendiente mediante un procesamiento estadístico y 
    posteriormente dividiéndola sumatoria de esto entre el número de 
    ocurrencias de las pendientes.
  - >
    Las herramientas SIG disponibles en el mercado permiten realizar el 
    cálculo de este parámetro de una manera ágil y precisa mediante 
    estadísticas zonales de un archivo tipo ráster. En la Ilustración 46 se 
    presenta la valoración de las pendientes de las microcuencas en estudio 
    y en la Tabla 415 se presentan los valores calculados para las 
    microcuencas.
  - >
    Los anteriores resultados indican que la escorrentía directa durante 
    los eventos de lluvias intensas tendrá una tendencia a fluir de manera 
    más rápida dentro de la cuenca en estudio.

tipo_de_suelo_hidrologico:
  - >
    El Soil Conservatión Service (S.C.S.) de los Estados Unidos de América 
    realizó la clasificación hidrológica de más de 4000 suelos basándose en 
    características como su potencial de escorrentía, denominados y 
    definidos como se describe a continuación.
  - >
    Suelo Tipo A: Potencial de escurrimiento bajo. Suelos con altas 
    capacidades de infiltración cuando están completamente húmedos, 
    principalmente arenas y gravas muy bien ordenadas. Suelos con alta 
    transmisión de agua.
  - >
    Suelos Tipo B: Suelos con capacidades de infiltración moderadas cuando 
    están completamente húmedos, principalmente suelos medianamente 
    profundos y drenados, con textura de sus agregados variando entre 
    moderada y muy fina. Tiene velocidades medias de transmisión de agua.
  - >
    Suelos Tipo C: Suelos con capacidades de infiltración baja cuando están 
    completamente húmedos, principalmente suelos que contiene una capa que 
    impide el movimiento hacia abajo o suelos con textura fina o 
    moderadamente fina. Estos suelos tienen baja transmisión de agua.
  - >
    Suelos Tipo D: Suelos con capacidades de infiltración muy bajas cuando 
    están completamente húmedos. Suelos que se expanden significativamente 
    cuando se mojan, arcillas altamente plásticas y ciertos suelos salinos. 
    Suelos con transmisión del agua muy baja.
  - >
    La definición del tipo de suelo hidrológico requiere de pruebas de 
    campo y estudios especializados, se tomará entonces para este caso un 
    Tipo de Suelo Hidrológico C asumiendo una baja transmisión de agua 
    hacia el subsuelo en la cuenca.

numero_de_curva:
  - >
    El número de curva (CN) es un parámetro empírico que se calcula con el 
    método desarrollado por el Soil Convervation Service (SCS), el cual 
    utiliza las condiciones de humedad antecedente (AMC) del suelo (seco, 
    normal o transición y húmedo) determinada a partir de la precipitación 
    total en los cinco días previos, para conocer la reacción a fenómenos 
    de precipitación según las características particulares de una cuenca. 
    Se representa mediante un número adimensional, en curvas 
    estandarizadas, que varían entre 0 y 100; donde un área con CN = 0 no 
    tiene escurrimiento y otra con CN = 100 es impermeable y toda la 
    precipitación genera escorrentía. En la Tabla 416 se presentan los 
    valores asociados al tipo de cobertura.
  - >
    Se realizó un ejercicio de fotointerpretación con imágenes satelitales 
    disponibles en plataformas SIG con el fin de identificar los tipos de 
    cobertura predominantes en la zona de proyecto, para los cuales se 
    identificaron: pastos, bosques y tejido urbano como se observa en la 
    Ilustración 47. Con la información de tipo de cobertura se le asigna el 
    número de curva para un suelo de tipo hidrológico C y se construye así 
    un mapa ráster para la zona de proyecto, como se observa en la 
    Ilustración 48. Para el caso específico de la cuenca de estudio, se 
    tiene que el número de curva fluctúa entre 73 y 91; por medio de una 
    estadística zonal se calcula el número de curva de diseño de la 
    microcuenca que se presenta en la Tabla 417 se presentan los valores 
    calculados para las microcuencas.

tiempos_de_concentracion:
  - >
    El tiempo de concentración se define como el tiempo mínimo en el cual 
    la totalidad de la cuenca está aportando flujo de escorrentía al punto 
    de descarga, determinado por el tiempo transcurrido desde que el agua 
    que se encuentra en el punto más alejado llega hasta el punto de 
    control.
