precipitacion:
  - >
    Para el desarrollo de los cálculos en este apartado del documento se 
    utilizaron los resultados de series de precipitación mensuales 
    complementadas del numeral 5.1.3, se construyeron los archivos tipo 
    ráster de la variable mediante la interpolación con el método IDW y a 
    partir de una estadística zonal con herramientas de geoprocesamiento se 
    calculó el valor medio para la zona de estudio, esto con el fin de 
    construir una serie de precipitación a nivel mensual específica para el 
    proyecto. Esta información sintética se presenta en el Anexo 3.6 del 
    informe. A continuación, se presentan los resultados de este ejercicio 
    para cada corriente.
  - >
