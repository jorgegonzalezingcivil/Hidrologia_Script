    estaciones no cuentan con información completa ni su localización 
    permite un análisis espacial adecuado, por lo que se tomarán los datos 
    de la estación AEROPUERTO VANGUARDIA para los análisis posteriores. A 
    esta serie se le dio el mismo tratamiento de outlier y complemento de 
    datos como se describe en los numerales de análisis de precipitación.
  - >
    Teniendo en cuenta que los datos corresponden al valor máximo y mínimo 
    del día, se calcularon los promedios con esta información para generar 
    la serie de temperatura media y posteriormente fue agregada a nivel 
    mensual. En la Tabla 610 se presenta el resultado del ejercicio.

evapotranspiracion:
  - >
    La evapotranspiración es la máxima cantidad de agua que puede 
    evaporarse desde el suelo completamente cubierto por vegetación 
    desarrollado en óptimas condiciones y sin limitaciones en la 
    disponibilidad de agua, este proceso es la combinación de dos tipos de 
    superficie: la evaporación del agua en la vegetación, suelo o cuerpos 
    de agua, y la transpiración de las plantas.
  - >
    Este parámetro se utiliza en las metodologías y modelos para el cálculo 
    del balance hídrico de una cuenca y se subdivide en dos: 
    evapotranspiración potencial y evapotranspiración real.
  - >
