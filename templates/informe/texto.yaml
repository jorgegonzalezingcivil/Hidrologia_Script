evapotranspiracion_real:
  - >
    La evapotranspiración real es la cantidad de agua que se pierde en el 
    sistema planta-suelo en las condiciones existentes de la cuenca desde 
    el aspecto meteorológico, biológico y características del suelo.
  - >
    Se calculó de Evapotranspiración Real por método balance hídrico a 
    largo plazo de Budyko (1977), para la zona de proyecto.
  - >
    Donde: E = Evapotranspiración real (mm/mes).
  - >
    P = Precipitación total mensual, tomada de la estación (mm/mes).
  - >
    Ep = Evaporación potencial mensual (mm/mes).
  - >
    En el Anexo 4 del informe se presenta los cálculos a nivel mensual de 
    este parámetro en los años registrados con datos de precipitación y 
    temperatura completados, y la evapotranspiración potencial según lo 
    descrito en el numeral anterior.
