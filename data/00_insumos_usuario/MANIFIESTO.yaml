  - tema: "descarte de estaciones por consistencia (M05)"
    valor: >-
      Se eliminan las estaciones que no alcanzan correlación 0,70 contra el
      patrón de sus vecinas (consistencia.descartar_bajo_umbral). Quedan 32 de 42.
    justificacion: >-
      Decisión del consultor: una estación cuyo análisis de consistencia no da
      buena correlación se elimina.
      SOBRE QUÉ SE MIDE. El R2 de la recta de doble masa NO sirve para
      discriminar: medido en este estudio va de 0,9925 a 0,9999 y ninguna
      estación baja de 0,99. La causa es estructural: ambos ejes son sumas
      acumuladas, y una acumulada contra otra siempre produce una recta. Con ese
      criterio no se eliminaría ninguna estación jamás.
      El discriminante es la correlación contra el patrón de vecinas sobre la
      serie SIN acumular, que va de 0,707 a 0,912. Es el mismo umbral ya
      adoptado, 0,70, y las que no lo alcanzan son las diez que no tienen
      ninguna vecina admisible.
      CONSECUENCIA QUE DEBE ATENDERSE. Las eliminadas tienen altitudes de 3, 490,
      567, 765, 2640, 2680, 2750, 2845, 3100 y 3100 m, y las conservadas quedan
      entre 1850 y 3378 m. El descarte eliminó TODA la franja por debajo de 1850
      m. No es casualidad: el criterio de correlación descarta precisamente las
      estaciones de régimen distinto, que son las del valle del Magdalena, y esas
      son las que informarían a la interpolación sobre esa parte del área.
      El M06 (isoyetas) y el M11 (zonificación pluviométrica con gradiente
      altitudinal) deben advertir que por debajo de 1850 m no hay dato y que
      cualquier valor allí es extrapolación, no interpolación.
      Atenúa el riesgo que ninguna de las diez estaba dentro de la cuenca
      delimitada: dentro siguen 31 antes y después del descarte. La pérdida
      afecta al área de influencia ampliada, no a la cuenca del estudio.
      La estación de altitud 3 m es 21201180 (GUANQUICA), cuyo valor es un error
      del catálogo ya registrado aparte: su altitud real ronda los 3000 m.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "clasificación ENSO mensual y agregación por fase (M05b)"
    valor: >-
      Clasificación MENSUAL por el mes central de cada temporada del ONI, con la
      definición oficial de episodio (umbral 0,5 C sostenido cinco temporadas
      consecutivas). El total anual de cada fase se obtiene sumando las doce
      medias mensuales.
    justificacion: >-
      La rutina heredada ENSOONI.py asignaba una etiqueta por año calendario. Con
      ese criterio el Niño de 1997-98, que va de mayo de 1997 a abril de 1998,
      queda partido en dos y los meses de cada año reciben una etiqueta
      promediada que no corresponde a ninguno. El índice publica temporadas de
      tres meses y el mes central de cada una permite etiquetar mes a mes, que es
      lo que la agregación por fase necesita.
      Se exige además que el umbral se sostenga cinco temporadas consecutivas,
      que es la definición de la NOAA. Medido sobre las 918 temporadas del
      índice, exigirlo cambia la fase de 34 frente a aplicar el umbral suelto:
      sin ese control cualquier oscilación breve entraría como episodio.
      EL TOTAL POR FASE se obtiene sumando las doce medias mensuales y no
      promediando totales anuales. Muy pocos años caen ENTEROS dentro de una
      fase, porque los episodios empiezan y terminan a mitad de año, de modo que
      promediar totales anuales descartaría casi toda la muestra.
      RESULTADO medido sobre las 32 estaciones: bajo Niño la precipitación anual
      baja en las 32, con mediana de -16,9% y rango de -2,4% a -23,4%; bajo Niña
      sube en 28 de 32, con mediana de +14,6%. Es la teleconexión conocida de los
      Andes colombianos y las magnitudes son coherentes con la literatura.
      Cuatro estaciones bajan también bajo Niña, lo que merece revisión al
      interpretar sus isoyetas.
      El ENSO NO elimina estaciones ni registros (CLAUDE.md, sección 6). El
      esquema lo verifica con un invariante que eleva a BLOQUEANTE activar
      enso.elimina_registros.
    fecha: "2026-08-08"
    responsable: ""              # pendiente de diligenciar

  - tema: "malla de interpolación de isoyetas y método (M06, M08)"
    valor: >-
      100 m, malla propia separada de la del DEM (isoyetas.resolucion_m). IDW con
      potencia 2; el kriging detiene el módulo mientras no se declare proveedor.
    justificacion: >-
      Decisión del consultor. El área de influencia mide 146 por 115 km: a los
      12,5 m del DEM serían 107 millones de celdas y 429 MB por raster, 1,3 GB
      solo para las tres fases del M06 y unos 3,4 GB más para los ocho periodos
      de retorno del M08.
      El argumento de fondo no es el peso sino el soporte del dato: se
      interpolan 32 estaciones separadas unos 15 km, y una malla 1200 veces más
      fina que ese espaciamiento aparenta una precisión que la información no
      tiene. Las curvas se entregan además en vectorial, que se dibuja bien a
      cualquier escala del pliego, de modo que la malla fina no hacía falta ni
      siquiera para la cartografía a 1:10.000.
      IDW es el predeterminado que fija CLAUDE.md, sección 6, citando a Vargas
      et al. El kriging no viene en el núcleo de QGIS: el módulo se detiene con
      mensaje explícito si se declara, en lugar de sustituir el método en
      silencio.
    fecha: "2026-08-08"
    responsable: ""              # pendiente de diligenciar

  - tema: "ALERTA: la altitud no explica la precipitación en la red conservada"
    valor: >-
      Medido sobre las 32 estaciones: r2 de 0,011 en fase neutral, 0,001 en
      Niña y 0,032 en Niño.
    justificacion: >-
      CLAUDE.md, sección 6, define la zonificación pluviométrica del M11 como
      "diferencial porcentual + gradiente altitudinal + ponderación por área".
      Ese gradiente NO existe en la red disponible, y el M06 lo mide antes de que
      el M11 lo aplique: prescribir un método no garantiza que el dato lo
      sustente, y aplicarlo aquí apoyaría la zonificación en una relación
      inexistente.
      Causa probable: el descarte por consistencia del M05 eliminó las
      estaciones de cota baja y dejó la red entre 1850 y 3378 m, todas en la
      sabana. El rango que mostraría el gradiente quedó truncado.
      SEGUNDO HALLAZGO, del mismo origen. La validación dejando uno fuera del
      campo IDW da Nash-Sutcliffe de 0,16 a 0,22 y RMSE relativo del 18 al 22%.
      El campo apenas mejora usar la media: la precipitación varía a escalas más
      cortas que el espaciamiento de la red, que es lo habitual en terreno
      andino. El mapa de isoyetas es entregable, pero su incertidumbre debe
      declararse en el informe y no presentarse como un campo preciso.
      El M11 debe decidir de forma explícita si conserva el gradiente
      altitudinal, si lo sustituye por otro criterio, o si se reincorporan
      estaciones de cota baja aceptando su menor correlación.
    fecha: "2026-08-08"
    responsable: ""              # pendiente de diligenciar

  - tema: "alcance y completitud de la serie de Pmáx 24 h (M07)"
    valor: >-
      Solo las 32 estaciones que conservó el M05. Un año aporta su máximo si
      ningún mes baja de 25 días (frecuencia.min_dias_mes).
    justificacion: >-
      ALCANCE. Decisión del consultor: criterio único en todo el estudio, de modo
      que una estación descartada lo esté para todo. Se midió la alternativa: 7
      estaciones más tienen 33 a 44 años de serie diaria y el M05 las descartó
      por correlación MENSUAL, cuyo fin era poder verificar y complementar; la
      serie diaria no se complementa nunca. Tres de ellas están a 490, 567 y 765
      m y habrían restaurado el rango altitudinal.
      CONSECUENCIA a atender en el M08: la red de máximos hereda el rango
      1850-3378 m, de modo que las isoyetas de Pmáx por periodo de retorno
      extrapolan por debajo de esa cota igual que las del M06.
      COMPLETITUD estacional y no anual. Un año con 340 días puede tener abril
      entero vacío, y abril es temporada húmeda en la sabana: su máximo sería el
      de un año seco y entraría indistinguible de los demás. Exigir un mínimo
      por mes lo impide.
      EXCLUSIONES por Calificador, no por estadística: 155 registros ACUMULADO y
      569 DATO RECHAZADO. ACUMULADO es el crítico que señala CLAUDE.md, sección
      7: agrupa varios días y se leería como un máximo de 24 horas que nunca
      ocurrió.
      NO se aplica IQR, que la sección 7 prohíbe de forma expresa. Sí se corre
      Grubbs-Beck del Bulletin 17C, que busca atípicos BAJOS, y solo se reporta.
      RESULTADO: 32 estaciones, 986 años-estación, longitud mediana 32 años.
      Distribuciones seleccionadas por AIC: Gumbel 16, LogNormal2 10, Pearson III
      3, Normal 2, Log-Pearson III 1. Cuantiles medianos: 39,7 mm en T2.33 y
      75,2 mm en T100.
      ADVERTENCIA que debe declararse en el informe: se piden cuantiles hasta 500
      años sobre series de 32 años de mediana. Extrapolar más allá del doble de
      la muestra produce un cuantil cuya incertidumbre supera lo que sugiere su
      cifra.
    fecha: "2026-08-08"
    responsable: ""              # pendiente de diligenciar

  - tema: "repertorio de distribuciones y guarda de plausibilidad (M07)"
    valor: >-
      Trece distribuciones. Se añaden EV2-Max (Fréchet), GEV con forma fija y
      Pareto generalizada. La Pareto se calcula pero NO puede adoptarse por
      selección automática.
    justificacion: >-
      CLAUDE.md, sección 4, declara Hydrognomon reemplazado por el análisis en
      Python, y el reemplazo debe ser al menos tan completo como lo reemplazado.
      Comparado su repertorio para máximos, faltaban tres: EV2-Max (valor
      extremo tipo II, cola pesada), GEV con la forma fijada regionalmente en
      lugar de ajustada, y Pareto generalizada.
      Las de MÍNIMOS de Hydrognomon (EV1-Min, GEV-Min) no se incluyen: no
      describen una serie de máximos. Corresponden al M19, caudales de estiaje.
      SIGNO DE LA FORMA DE LA GEV. Se adopta la convención de Hosking, que es la
      de scipy: k negativo es cola pesada y k positivo cola acotada.
      Hydrognomon y buena parte de la literatura griega usan el signo CONTRARIO.
      Fijar el signo equivocado cambia por completo el cuantil de periodo alto:
      medido sobre una serie de prueba, T100 pasa de 37 a más de 200 mm. Se
      adopta -0,15, cola pesada, por ser lo habitual en precipitación; el valor
      debe proceder de un análisis regional y el consultor debe justificarlo.
      GUARDA DE PLAUSIBILIDAD, añadida por un fallo real. La Pareto generalizada,
      ajustada con el umbral en el mínimo de la muestra, alcanza una
      verosimilitud enorme con una densidad degenerada, un pico sobre el borde, y
      GANÓ POR AIC en dos estaciones. Ese ajuste habría entrado al diseño como
      válido. Un criterio de información compara verosimilitudes; no comprueba
      que el resultado tenga sentido físico.
      Se exige ahora que los cuantiles crezcan con el periodo de retorno y que el
      cuantil de periodo alto supere el máximo observado, porque una crecida
      centenaria no puede ser menor que la mayor de treinta años.
      SELECCIÓN RESULTANTE sobre las 32 estaciones: Gumbel 14, LogNormal2 10,
      Pearson III 3, Normal 2, Log-Pearson III 2, GEV 1.
    fecha: "2026-08-08"
    responsable: ""              # pendiente de diligenciar

  - tema: "figuras individuales, agrupadas por tema"
    valor: >-
      Además de las rejillas de resumen, una figura por estación en
      data/05_resultados/graficos/estaciones, agrupada por tema
      (graficos.por_estacion).
    justificacion: >-
      Decisión del consultor. Una rejilla de treinta y dos paneles sirve para
      revisar de un vistazo, pero no se puede insertar en el informe: cada panel
      queda del tamaño de una estampilla y no se lee ni el eje. Las rutinas
      heredadas (EDA.py, Impute.py) escribían una figura por estación en un
      subdirectorio Graph, y se recupera ese criterio.
      Se agrupan por TEMA y no por módulo porque así es como se redacta: quien
      escribe el capítulo de consistencia busca todas las curvas de doble masa
      juntas, no las del M05 mezcladas por tipo.
      Nueve temas. Seis por estación con 32 figuras cada uno (doble_masa,
      serie_mensual y ciclo_anual del M05; pmax_serie, papel_probabilidad e
      histograma_pdf del M07), y tres de isoyetas que no son por estación:
      isoyetas_fase con las tres fases ENSO del M06, contraste_fases con las dos
      comparaciones, e isoyetas_pmax con los ocho periodos de retorno del M08.
      Son 205 figuras en PNG y otras tantas en SVG.
      El directorio se llama 'individuales' y no 'estaciones' porque no todas lo
      son: una isoyeta de T500 no es una estación.
      Las isoyetas individuales conservan la ESCALA COMÚN de su panel pese a ser
      figuras separadas. Si cada una se autoescalara, la de Niño y la de Niña
      saldrían igual de intensas y el lector concluiría que llueve lo mismo.
      Las rejillas se CONSERVAN como resumen de revisión: sirven para detectar
      de un vistazo una estación anómala entre treinta y dos, que es
      precisamente como se descubrió el ajuste degenerado de la Pareto.
      SÍ se versionan, por decisión del consultor: el entregable debe ser
      autocontenido, de modo que quien reciba el repositorio tenga el informe
      completo sin volver a ejecutar nada.
      Al aplicarlo se descubrió que NINGUNA figura estaba versionada, tampoco
      las agregadas: la regla data/05_resultados/** las excluía todas y solo
      sobrevivían los .gitkeep. Se corrigió para todo el árbol de gráficos, con
      las dos líneas de directorio que git necesita para descender a un
      directorio excluido antes de que un patrón de archivo pueda alcanzarlo.
      COSTO medido: 27,5 MB por corrida (18,8 en PNG y 8,8 en SVG), sobre un
      repositorio que antes pesaba 31 MB. Los PNG no se comprimen, de modo que
      cada regeneración añade blobs nuevos y el historial crece en esa cantidad
      cada vez. Si el repositorio llegara a hacerse pesado, la vía es purgar el
      historial de figuras y no dejar de versionarlas.
    fecha: "2026-08-08"
    responsable: ""              # pendiente de diligenciar

  - tema: "ALERTA: el error de la isoyeta crece con el periodo de retorno (M08)"
    valor: >-
      RMSE relativo de la validación dejando uno fuera: 9,7% en T2.33 y 18,5% en
      T500.
    justificacion: >-
      Medido sobre las 32 estaciones, el error de interpolación crece de forma
      monótona con el periodo de retorno: 9,7% en T2.33, 10,0% en T10, 11,6% en
      T25, 14,7% en T100 y 18,5% en T500.
      Es lo esperable y a la vez lo que debe declararse: el mapa de T500 no
      merece la misma confianza que el de T2.33, y ambos se presentan con el
      mismo aspecto. A esa incertidumbre de interpolación se suma la que el M07
      ya advirtió, porque T500 se estima sobre series de 32 años de mediana.
      Se conserva además la advertencia de rango: la red hereda del descarte del
      M05 la franja 1850 a 3378 m, de modo que por debajo de esa cota el campo
      extrapola.
      Y una tercera, propia de este módulo: cada estación aporta el cuantil de la
      distribución que el M07 adoptó PARA ELLA, de modo que un mismo campo puede
      mezclar una Gumbel con una LogNormal vecina. Es lo correcto, porque cada
      serie se ajusta a su propio dato, pero introduce discontinuidades que el
      informe debe declarar.
    fecha: "2026-08-08"
    responsable: ""              # pendiente de diligenciar

  - tema: "alcance del M09 y reacondicionamiento del DEM"
    valor: >-
      Un módulo con dos modos (--preparar y --importar). El DEM se entrega SIN
      reacondicionar; el reacondicionamiento se hará dentro de HEC-HMS. La
      cuenca preliminar sirve de cota superior, no de objetivo de igualdad.
    justificacion: >-
      Decisión del consultor tras revisar el alcance. El M09 está a caballo del
      único paso manual del estudio (CLAUDE.md, sección 4), y por eso tiene dos
      modos explícitos en lugar de detección automática: la misma orden
      produciría resultados distintos según el estado del disco, y eso no se
      puede auditar.
      INSUMOS que se entregan: DEM recortado, cuenca preliminar, punto de
      descarga y los dos drenajes del IGAC recortados con la holgura ya
      definida, más un instructivo que hace reproducible el paso manual.
      REACONDICIONAMIENTO en HEC-HMS, no aquí. Queda declarado el riesgo: con el
      DEM de radar crudo, el análisis de terreno del M02 llegó a delimitar 6,59
      km² sobre una subzona de 5.926, porque en la sabana el relieve cae
      centímetros por kilómetro mientras el DEM tiene incertidumbre vertical de
      varios metros. Por eso los drenajes viajan entre los insumos y el
      instructivo indica el remedio si la delimitación sale desviada.
      VERIFICACIÓN por cota y no por igualdad. Para el escenario 1 la cuenca
      preliminar es la subzona entera, que es una unidad cerrada y contiene la
      cuenca aportante por definición: sobredimensiona el área varias veces, de
      modo que exigir coincidencia rechazaría cualquier delimitación correcta.
      Se comprueba que la delimitada no exceda la preliminar y que no baje del
      5% de ella, que es el control que atrapa el fallo del DEM.
      DOS VACÍOS CORREGIDOS al revisar el alcance. El M02 no escribía los
      drenajes recortados que la configuración declara, de modo que eran
      productos fantasma; ya los produce. Y quedaba en disco un
      cuenca_preliminar.shp huérfano de 6,59 km², residuo del análisis de
      terreno anterior al rediseño del M02, que la verificación del M09 estaba
      tomando como referencia: se eliminó.
      LO QUE EL M09 NO VERIFICA: la topología. Comprobar que cada tramo conecte
      con su subcuenca y que la red drene al punto exige leer geometría vértice
      a vértice y pertenece al entorno SIG. Se declara como no verificado en
      lugar de darlo por bueno.
    fecha: "2026-08-08"
    responsable: ""              # pendiente de diligenciar

