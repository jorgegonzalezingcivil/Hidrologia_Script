# =============================================================================
# MANIFIESTO DE INSUMOS DEL USUARIO
# -----------------------------------------------------------------------------
# Declaración de los insumos aportados para el estudio. El módulo M00c valida
# este archivo antes de cualquier procesamiento y su contenido se transcribe al
# capítulo de Información Base del informe y al anexo correspondiente.
#
# Estados posibles del reporte de M00c:
#   BLOQUEANTE   falta un insumo obligatorio según los módulos habilitados
#   ADVERTENCIA  el insumo existe pero su cobertura, escala o CRS es cuestionable
#   INFORMATIVO  registro para trazabilidad
# =============================================================================

suelos:
  aportado: false
  archivo: ""                    # ruta relativa a data/00_insumos_usuario/suelos/
  tipo: ""                       # shapefile | raster
  perfil: ""                     # A | B | C | D  (ver CLAUDE.md)
                                 # A: trae grupo hidrológico asignado (A,B,C,D)
                                 # B: IGAC con textura, profundidad y drenaje
                                 # C: codificación propia (UCS, símbolo, leyenda)
                                 # D: ráster con valores a reclasificar
  campo_clave: ""                # campo con el atributo a homologar
  fuente: ""                     # IGAC, estudio de suelos del proyecto, otro
  fecha: ""
  escala: ""                     # 1:25000, 1:100000, etc.
  crs_declarado: ""
  observaciones: ""

cobertura:
  aportado: false
  archivo: ""
  tipo: ""                       # shapefile | raster
  campo_clave: ""
  fuente: ""                     # cobertura del proyecto | Corine Land Cover | otro
  fecha: ""
  escala: ""
  crs_declarado: ""
  observaciones: ""
  # Si no se aporta, el sistema recorta Corine Land Cover al área de influencia.
  # Si tampoco está disponible, el CN se asigna por criterio del consultor con
  # registro explícito.

caudales:
  aportado: false
  origen: ""                     # ideam | cliente
  archivos: []
  estaciones:
    # Una entrada por estación. La ubicación y el tipo de dato son obligatorios:
    # un caudal sin sección asociada no sirve para calibrar.
    - codigo: ""
      nombre: ""
      latitud: null
      longitud: null
      tipo_dato: ""              # nivel | caudal | aforo_puntual
      periodo_inicio: ""
      periodo_fin: ""
      seccion_aforo: ""          # descripción o coordenada de la sección
      fuente: ""
  observaciones: ""

homologacion:
  # Tablas generadas por el sistema y diligenciadas por el consultor.
  # El M00c se detiene si aparecen valores sin homologar.
  suelos:
    archivo: "homologacion/suelos.csv"
    diligenciada: false
    fecha: ""
    responsable: ""
  cobertura:
    archivo: "homologacion/cobertura.csv"
    diligenciada: false
    fecha: ""
    responsable: ""

# -----------------------------------------------------------------------------
# REGISTRO DE DECISIONES DEL CONSULTOR
# Cada decisión con margen técnico debe quedar aquí con su justificación.
# -----------------------------------------------------------------------------
decisiones:
  - tema: "versión de QGIS del entorno SIG"
    valor: "QGIS 4.2.0 (no LTR)"
    justificacion: >-
      CLAUDE.md, sección 3, adopta el esquema LTR. Se declara la versión 4.2.0
      instalada en la máquina de trabajo, que no es LTR. Consecuencia asumida:
      los módulos SIG (M01, M02, M06, M08, M11, M16) quedan expuestos a cambios
      de API en actualizaciones menores de la serie 4.x, que se ejecuta sobre
      Qt6 y rompe compatibilidad con la serie 3.x. Mitigación: no actualizar
      QGIS durante la ejecución del estudio y dejar registrada aquí la versión
      con la que se produjo cada entrega.
    fecha: "2026-08-05"
    responsable: ""              # pendiente de diligenciar

  - tema: "tratamiento del NivelAprobacion del IDEAM"
    valor: "1200 Definitivo, 1100 En revisión, 900 Preliminar. Sin filtrado."
    justificacion: >-
      Los archivos de descarga traen códigos numéricos y no los textos que cita
      CLAUDE.md. Confirmada la correspondencia por el consultor. Todos los datos
      entran al procesamiento con independencia de su nivel, conforme a la
      decisión cerrada de la sección 6, que lo declara marca informativa y no
      criterio de descarte. La precedencia se usa solo para resolver qué
      registro se conserva cuando la deduplicación encuentra la misma terna
      repetida, que afecta al 4,1% de los registros verificados.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "términos de uso y política de descarga del IDEAM"
    valor: "Aceptados. Descarga automatizada del servicio DHIME autorizada."
    justificacion: >-
      La aplicación web del IDEAM presenta un diálogo de términos de uso que se
      acepta en cada descarga manual. El M04 invoca el servicio de descarga de
      forma directa y no muestra ese diálogo. El consultor declara que acepta
      esos términos de forma habitual al descargar y autoriza la automatización
      bajo las mismas condiciones. Queda constancia aquí porque la aceptación
      deja de ser un acto explícito por descarga.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "formato de descarga del IDEAM vigente en 2026"
    valor: "21 columnas, con IdParametro renombrada a Variable"
    justificacion: >-
      CLAUDE.md sección 7 documenta un cambio de 21 a 8 columnas con pérdida de
      coordenadas, fechas y del campo Calificador. Verificado por descarga real
      el 2026-08-07: el servicio entrega 21 columnas y conserva todos esos
      campos. El único cambio respecto de 2022 es el nombre de una columna. Se
      declaran ambos perfiles para poder leer archivos de las dos épocas.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "tratamiento de los datos estimados por el IDEAM"
    valor: "Marcar y conservar. No se descartan."
    justificacion: >-
      Los archivos traen 30.144 registros con calificador de estimación (EST.
      OTROS METODOS 17.497, EST. REGRESION 12.329, EST. INTERPOLACION 318 y
      ESTIMADO 826 sobre el histórico verificado). No son observaciones directas
      sino valores calculados por la entidad. Decisión del consultor: se
      conservan y se marcan, porque descartarlos reduciría la longitud de serie
      disponible y esa decisión corresponde al análisis de sensibilidad del
      M04b. La marca es indispensable para el M05: rellenar sobre un dato ya
      estimado encadena dos estimaciones, y sin distinguirlos el porcentaje de
      dato sintético del estudio quedaría subestimado.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "series de precipitación a descargar"
    valor: "Se añaden PTPM_CON (diaria) y PTPM_MX_TT_M (máximo mensual)."
    justificacion: >-
      Los archivos aportados del estudio de 2022 solo traen PTPM_TT_M, la serie
      mensual, porque aquel trabajo era de balance hídrico. La estructura actual
      incluye análisis de máximos, y el M07 necesita la serie diaria íntegra
      para la Pmáx 24 h: CLAUDE.md, sección 6, prohíbe construir una serie
      diaria sintética interpolada. Además, la marca ACUMULADO del Calificador,
      que detecta falsos máximos en 24 horas, solo tiene sentido sobre la serie
      diaria. Se añade también PTPM_MX_TT_M como contraste de la Pmáx calculada.
      Ambas verificadas por descarga sobre la estación 21201200.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "viabilidad de la calibración del modelo (M14b)"
    valor: >-
      No viable. Hay una estación aguas arriba, pero solo mide nivel y desde
      2018.
    justificacion: >-
      RECTIFICA un registro anterior que afirmaba que no había ninguna estación
      aguas arriba. Esa conclusión se apoyaba en la cota, y era errónea.
      La estación 2120700146 (Universidad de La Sabana, limnigráfica) está 6,26
      km AGUAS ARRIBA del punto sobre el mismo eje del Río Bogotá, verificado
      por recorrido sobre el cauce: su distancia a la desembocadura es 221,86 km
      frente a 215,60 km del punto. El criterio de cota la había descartado por
      estar 15 m más baja, pero en la sabana el desnivel del río es de
      centímetros por kilómetro y el DEM de radar tiene ruido de varios metros:
      esos 15 m eran ruido, no desnivel.
      Aun así la calibración no es viable, por dos razones distintas: la
      estación solo publica NV_MEDIA_D y NV_MEDIA_M, no caudal, y su registro
      empieza en octubre de 2018, siete años. Convertir nivel en caudal exigiría
      una curva de gasto, que es insumo del consultor y hoy no existe; y siete
      años no sostienen un análisis de crecientes para periodos de retorno de 25
      años o más.
      Las otras cinco estaciones de caudal o nivel del área están aguas abajo
      del Salto del Tequendama, con cotas de 257 a 614 m frente a los 2568 m del
      punto, y miden cuencas que contienen a la del estudio y la superan.
      CLAUDE.md, sección 6, declara la calibración condicional a que existan
      series utilizables. Si el consultor aporta curva de gasto para 2120700146,
      esta decisión debe revisarse.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "banda de incertidumbre vertical para juzgar posición relativa (M03)"
    valor: "30 m (estaciones.banda_cota_m)"
    justificacion: >-
      Una estación cuya cota es menor que la del punto de descarga NO se
      descarta si la diferencia cae dentro de esta banda: se remite a la red de
      drenaje.
      El valor no es teórico. La estación 2120700146 aparecía 15 m por debajo
      del punto y estaba 6,26 km aguas arriba sobre el mismo cauce. En la sabana
      el Río Bogotá cae centímetros por kilómetro, mientras que el DEM ALOS
      PALSAR RTC tiene incertidumbre vertical de varios metros: el signo de la
      diferencia era ruido, no desnivel. Se adopta el doble de la discrepancia
      medida, que cubre el caso conocido con holgura sin volver inútil el
      criterio: las estaciones bajo el Salto del Tequendama quedan a 1954 m o
      más por debajo y se siguen descartando.
      La banda solo relaja el descarte; nunca declara apta una estación. La
      confirmación sigue exigiendo el trazado de la red.
      Debe reducirse si el estudio se hace en terreno de relieve marcado, donde
      el desnivel real supera el ruido, o si se emplea un DEM de mejor calidad
      vertical.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "umbral de completitud anual para contar un año como útil (M04b)"
    valor: "0.80 (sensibilidad_series.completitud_anual_minima)"
    justificacion: >-
      Un año cuenta como útil solo si tiene registro en al menos el 80% de sus
      días o meses. Sin este control, un año con tres días de dato sumaría igual
      que uno completo y la longitud de serie quedaría inflada.
      Medido sobre la serie consolidada del estudio: la completitud anual tiene
      mediana 0,97 en las series diarias y 1,00 en las mensuales, con una cola de
      años parciales (percentil 10 en 0,37). El umbral conserva el 73,6% de los
      años diarios y el 91,8% de los mensuales, y deja fuera esa cola.
      ADVERTENCIA que debe atenderse en el M07: 0,80 en una serie diaria admite
      hasta 73 días ausentes. Para medir LONGITUD es razonable, pero no basta
      para la serie de máximos: un año al que le falte parte de la temporada de
      lluvias puede no contener su propio máximo anual. El M07 debe imponer un
      criterio estacional propio y no heredar este.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "dónde se generan las gráficas del estudio"
    valor: >-
      Cada módulo de análisis emite las suyas mediante src/graficos.py, punto
      único de estilo. El M15 las selecciona, numera y coloca.
    justificacion: >-
      CLAUDE.md no asignaba la generación de gráficas a ningún módulo. El bloque
      'informe' de config.yaml define cómo el M15 las numera y rotula, y
      'cartografia' corresponde al M16, que son mapas. La generación quedaba sin
      dueño y las rutinas heredadas la hacían por su cuenta.
      Se distinguen dos cosas que se confunden: las gráficas de DIAGNÓSTICO,
      que el consultor necesita para decidir, y las del ENTREGABLE, que el
      informe numera. Suelen ser la misma imagen, pero no el mismo momento. La
      curva de sensibilidad del M04b existe para fijar el umbral: si solo se
      produjera en el M15, llegaría después de la decisión que debía sustentar.
      La alternativa, generar todo en el M15, lo obligaría a releer y rederivar
      cada producto intermedio, acoplándolo a las interioridades de veinte
      módulos.
      El estilo (paleta, rampa ordinal, tamaños, tipografía, formatos, dpi) vive
      en el bloque 'graficos' de config.yaml y ningún módulo fija ninguno por su
      cuenta. Sin ese punto único, las figuras del informe saldrían con aspectos
      distintos, cosa que se nota ante interventoría.
      Se instala matplotlib en el venv. NO puede importarla src/comun, que lo
      comparte el Python de QGIS; la separación la comprueba
      tests/test_graficos.py.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "sistema de coordenadas de las figuras geográficas"
    valor: >-
      El mismo en que se ingresó el punto de descarga (graficos.crs_figuras en
      nulo lo resuelve a punto_descarga.crs, hoy EPSG:3116).
    justificacion: >-
      Las figuras geográficas se rotulan en coordenadas planas, no en latitud y
      longitud. El informe de referencia presenta sus mapas y su tabla de
      estaciones en coordenadas MAGNA Ciudad Bogotá, y una figura en grados no
      sería comparable con el resto del estudio ni legible para quien revisa.
      Además, las figuras se dibujan a escala equivalente y en grados eso
      deforma las distancias con la latitud, lo que induciría a error al juzgar
      huecos de cobertura.
      El nulo significa "según se hayan ingresado", de modo que el sistema sigue
      al del punto sin poder desincronizarse. Puede declararse otro, y debe ser
      un sistema PROYECTADO.
      Obliga a reproyectar dentro del venv, que no tiene QGIS. Se adopta pyproj,
      que es la misma PROJ que QGIS usa por debajo; programar la proyección a
      mano para la ocasión no sería defendible ante interventoría. La
      reproyección sigue siendo explícita (CLAUDE.md, sección 5): quien dibuja
      declara origen y destino, y el sistema queda escrito al pie de la figura.
      Se registra además que el Catálogo Nacional de Estaciones publica su
      ubicación en MAGNA-SIRGAS geográfico (EPSG:4686), no en WGS84. La
      diferencia en Colombia ronda el metro, irrelevante para seleccionar pero
      visible en una coordenada plana, de modo que se declara y no se asume.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "longitud de serie adoptada: umbral, ventana y criterio (M04b, M05)"
    valor: >-
      30 años en la ventana 1980-2026, medidos sobre años útiles totales.
      Excepciones: temperatura 20 años, evaporación 15 años.
    justificacion: >-
      Decisión del consultor tras revisar la matriz de sensibilidad del M04b.
      CLAUDE.md, sección 6, la deja explícitamente en sus manos.
      VENTANA 1980-2026 (47 años). Conserva más estaciones en todos los umbrales
      que las ventanas de 1990 y 2000, y cubre varios ciclos ENSO completos, que
      el M05b necesita para clasificar por fase. Con periodos de retorno de hasta
      500 años la serie más larga es siempre preferible.
      UMBRAL GENERAL 30 años. Deja 42 estaciones de precipitación, 41 dentro de
      la cuenca. Cuesta solo tres frente a 25 años, de modo que la exigencia es
      casi gratuita en conteo, y coincide con el periodo climatológico normal de
      la OMM, lo que lo hace sustentable sin argumento adicional.
      CRITERIO años útiles totales, no racha consecutiva. El M05 existe para
      complementar los huecos: exigir continuidad antes de intentar el relleno
      descartaría estaciones que el complemento podría reparar. Medido: con
      racha, el umbral de 20 años dejaría 24 estaciones donde años útiles deja
      48. La continuidad se sigue reportando, y con 30 años solo 14 de las 42
      estaciones de precipitación tienen la serie seguida: el M05 debe tratar
      esos huecos de forma explícita y el M07 debe advertir si la muestra que
      recibe no es homogénea en el tiempo.
      EXCEPCIONES POR VARIABLE. Un umbral único no sirve: aplicar 30 años a
      todas dejaría la evaporación en CERO estaciones y desactivaría en silencio
      el balance de Budyko del M18 y la evapotranspiración del M18a.
      Evaporación 15 años, que es el límite superior posible (con 20 quedan
      cero) y deja 4 estaciones. Temperatura 20 años, que deja 18 frente a las
      11 que dejarían 30, por considerarse escasas para sostener el gradiente
      altitudinal del M18a.
      CAUDAL. Conserva el umbral general, pero es indiferente: hay una sola
      estación en cualquier umbral. La restricción no es la longitud sino la
      disponibilidad, y el módulo lo advierte. Coherente con la no viabilidad de
      la calibración ya registrada.
      Este módulo no descarta nada: el descarte efectivo lo aplica el M05.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "correlación mínima entre estaciones vecinas (M05)"
    valor: "0.70 (consistencia.correlacion_minima)"
    justificacion: >-
      Decisión del consultor tras revisar la distribución medida. El valor
      inicial de 0,80 dejaba 24 de las 42 estaciones sin ninguna vecina, el 57%
      de la red, y el módulo se detenía antes que descartarlas en silencio.
      Medido sobre las 42 estaciones admitidas: la correlación entre parejas
      tiene mediana 0,555, y solo el 1,6% alcanza 0,80. No es falta de muestra,
      porque la mediana de meses comunes es 424. La causa es el área: abarca la
      subzona entera, de 250 a más de 3000 m y cruzando la cordillera, con
      regímenes que no tienen por qué correlacionarse entre sí.
      Con 0,70 quedan 8 estaciones aisladas (19%) y con 0,60 solo 1. Se adopta
      0,70 por ser el mayor valor que conserva la red utilizable.
      El umbral gobierna DOS cosas: qué vecinas sirven para verificar
      consistencia por doble masa, y de cuáles se puede complementar. Una
      estación sin ninguna vecina que lo alcance NO se descarta: su observación
      sigue siendo válida, simplemente no puede complementarse por vecinas y sus
      huecos quedan abiertos.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "método de complemento de series mensuales (M05)"
    valor: "regresion_vecinas (complemento.metodo_adoptado)"
    justificacion: >-
      Decisión del consultor sobre la validación cruzada, que enmascara dato
      observado, lo reconstruye y mide el error. La rutina heredada Impute.py no
      la hacía, y sin ella ningún método puede compararse con otro: rellenar
      siempre produce un número.
      Resultados medidos, con umbral de correlación 0,70:
      regresion_vecinas RMSE 31,6 y NSE 0,688; idw RMSE 33,9 y NSE 0,641; knn
      RMSE 35,4; mice RMSE 35,8; razon_normal RMSE 39,3.
      El RMSE por sí solo NO basta para decidir. Los métodos de regresión tiran
      hacia la media, de modo que aciertan el promedio y aplanan los extremos:
      eso mejora el error cuadrático y empeora la serie para el análisis de
      frecuencia del M07 y para la clasificación por fase ENSO del M05b, que
      dependen de la variabilidad. Por eso la validación reporta también la
      razón entre la desviación de lo estimado y la de lo observado.
      regresion_vecinas conserva el 82,6% de la desviación, segundo tras idw
      (86,5%) y por delante de razon_normal (76,5%). Gana en error y queda muy
      cerca del primero en variabilidad, de modo que la elección se sostiene por
      ambos criterios.
      ADVERTENCIA que debe atenderse en el M07 y el M05b: TODOS los métodos
      pierden entre el 14% y el 24% de la desviación. El 11,6% de la serie
      resultante es sintética, y esa fracción es más plana que la observada. El
      M07 debe reportar qué proporción de cada serie de máximos proviene de
      relleno.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "criterio de vecindad para consistencia y complemento (M05)"
    valor: >-
      Correlación >= 0.70 Y distancia <= 30 km Y desnivel <= 1000 m
      (consistencia.distancia_maxima_km, consistencia.desnivel_maximo_m).
    justificacion: >-
      La correlación por sí sola no define una vecina. Medido sobre las parejas
      que superaban 0,70: la distancia mediana era 15 km, pero el percentil 90
      llegaba a 58 km y el máximo a 105 km, con desniveles de hasta 3157 m. El
      27% estaba a más de 30 km. A esa separación la correlación no significa
      régimen compartido: a ambas estaciones las gobierna el mismo ciclo
      estacional regional, y eso no sustenta una curva de doble masa.
      La doble masa clásica compara contra un patrón de estaciones PRÓXIMAS y
      del mismo régimen. Los dos límites lo hacen exigible.
      La proximidad sola tampoco basta: en terreno montañoso dos estaciones a
      diez kilómetros pueden estar en vertientes opuestas, y por eso se conserva
      además el criterio de correlación y se limita el desnivel.
      EFECTO MEDIDO. Las estaciones con quiebre de doble masa pasaron de 5 a 15
      de 42. Los patrones lejanos suavizaban la curva y ocultaban
      inhomogeneidades reales, que es exactamente el fallo silencioso que este
      criterio evita.
      El mismo límite gobierna el complemento: si una estación no sirve para
      verificar, tampoco para rellenar. Aplicarlo mejoró el método adoptado de
      RMSE 31,6 a 31,3 y de NSE 0,688 a 0,698, y bajó la fracción sintética del
      11,6% al 10,6%.
    fecha: "2026-08-07"
    responsable: ""              # pendiente de diligenciar

  - tema: "qué se elimina, qué se corrige y qué se completa (M05)"
    valor: >-
      Eliminar solo por Calificador DATO RECHAZADO. Corregir por razón de
      pendientes las series con quiebre de doble masa. Completar con
      climatología propia lo que las vecinas no alcanzan.
    justificacion: >-
      Decisión del consultor. Tres criterios encadenados que dejan la serie
      continua sin destruir la información que la sustenta.
      NO SE ELIMINA POR IQR. Medido sobre los 560 valores señalados: su exceso
      mediano sobre el límite es 1,14 veces y su magnitud mediana 178 mm/mes,
      con el 62% por debajo de 200 mm. Son meses húmedos reales, no errores: el
      rango intercuartílico marca la cola superior por construcción, porque la
      precipitación mensual es asimétrica a la derecha. Eliminarlos y
      rellenarlos sustituiría extremos reales por estimaciones suavizadas y
      sesgaría la serie a la baja, justo donde el M07 necesita fidelidad. Se
      marcan y se conservan.
      SÍ SE ELIMINA POR CALIFICADOR. perfiles_ideam.yaml declara que DATO
      RECHAZADO se excluye del análisis, y el módulo lo incumplía: ignoraba el
      Calificador por completo. Son 1.184 registros en la ventana. Es el juicio
      del IDEAM sobre su propio dato, y por eso es mejor criterio que una regla
      estadística aplicada a una distribución asimétrica.
      SE CORRIGE, NO SE DESCARTA. Trece estaciones con quiebre de doble masa se
      homogeneizaron multiplicando su tramo ANTERIOR al quiebre por la razón de
      pendientes; se corrige el antiguo porque el reciente refleja las
      condiciones actuales de la estación. Descartarlas habría dejado 27 de 42 y
