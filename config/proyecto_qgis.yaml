      - id: numero_curva
        nombre: "Número de curva"
        tipo: raster
        ruta: "data/03_SIG/raster/numero_curva.tif"
        modulo: "M10"
        visible: false
        estilo: "numero_curva.qml"

      - id: grupo_hidrologico
        nombre: "Grupo hidrológico de suelo"
        tipo: raster
        ruta: "data/03_SIG/raster/grupo_hidrologico.tif"
