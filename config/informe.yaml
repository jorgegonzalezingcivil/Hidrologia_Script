# =============================================================================
# REPARTO DE HALLAZGOS
# =============================================================================
# LOS HALLAZGOS SON EL ANALISIS, y ya estan escritos: cada modulo los emitio en
# el momento en que midio cada cosa, con su severidad y su porque. Aqui solo se
# declara a que apartado pertenece cada familia.
#
# La asignacion va por PREFIJO DE CLAVE y no por modulo: un mismo modulo emite
# hallazgos de capitulos distintos, y la clave dice de que trata mejor que el
# modulo que la produjo.
#
# Un prefijo sin apartado deja su hallazgo fuera del informe, de modo que
# anadir un modulo obliga a decidir donde va lo que dice.
# -----------------------------------------------------------------------------

hallazgos:
  informacion_hidroclimatologica: [estaciones, ingesta, catalogo, dhime, series]
  analisis_de_sensibilidad_de_longitud_de_series: [sensibilidad, longitud]
  informacion_cartografica: [punto, subzona, cartografia]
  informacion_topografica_y_batimetrica: [dem, terreno]
