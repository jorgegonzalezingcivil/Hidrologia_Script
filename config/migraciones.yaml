# =============================================================================
# MIGRACIONES DE LA CONFIGURACIÓN DE UN ESTUDIO  (insumo de migrar_estudio.py)
# -----------------------------------------------------------------------------
# Un estudio guarda su propio config.yaml y NO se fusiona con el de la
# herramienta: es doctrina congelada del proyecto, y así dos estudios de la
# misma versión parten de lo mismo. El precio es que, cuando la herramienta
# añade o mueve una clave, los estudios anteriores se quedan atrás.
#
# Aquí se declara qué cambió en cada paso de versión y qué hay que hacer para
# ponerse al día. NO SE DEDUCE DEL DIFF, y esa es la decisión de fondo: añadir
# claves ausentes sí es automatizable, pero una clave que CAMBIA DE SIGNIFICADO
# exige además tocar los datos del estudio, y eso ningún diff lo adivina.
#
# Cada migración admite tres clases de cambio:
#
#   claves_nuevas       se copian del config.yaml de la herramienta CON SUS
#                       COMENTARIOS, que en ese archivo son medio manual de
#                       uso. 'despues_de' declara dónde insertarlas: se declara
#                       y no se busca un hueco, para que el resultado no
#                       dependa de cómo esté ordenado el archivo del estudio.
#
#   claves_revaloradas  el valor cambia. Se exige 'valor_anterior' y solo se
#                       sustituye si coincide: si el consultor lo había
#                       ajustado a mano, la migración se detiene y lo reporta
#                       en lugar de pisarle una decisión suya.
#
#   archivos_renombrados  el producto en disco cambia de nombre. Sin esto la
#                       configuración quedaría apuntando a un archivo que
#                       existe con el nombre viejo, y el módulo fallaría por
#                       'no se encuentra' sin explicar por qué.
# =============================================================================

version: 1

migraciones:

  - desde: 1
    hasta: 2
    titulo: "Área de influencia definitiva y ampliación por cobertura"
    motivo: >-
      El paso manual de HEC-HMS se adelantó delante del análisis de
      precipitación, de modo que hay dos áreas de influencia y no una: la
      PRELIMINAR del M02, que solo acota descargas y recortes, y la DEFINITIVA
      del M09b, derivada de las subcuencas ya delimitadas. Además, el buffer de
      selección de estaciones dejó de ser un valor fijo y pasa a ampliarse
      hasta que las estaciones rodeen la cuenca.

    claves_nuevas:
      - clave: "estaciones.ampliacion"
        despues_de: "estaciones.buffer_adicional_km"
      - clave: "hec_hms.intercambio.salida_area_influencia"
        despues_de: "hec_hms.intercambio.salida"
      - clave: "hec_hms.intercambio.buffer_area_km"
        despues_de: "hec_hms.intercambio.salida_area_influencia"

    claves_revaloradas:
      - clave: "dem.delimitacion.salida_area_influencia"
        valor_anterior: "data/03_SIG/vector/area_influencia.shp"
        valor_nuevo: "data/03_SIG/vector/area_influencia_preliminar.shp"
        motivo: >-
          Pasa a ser la PRELIMINAR. El nombre sin sufijo queda para la
          definitiva que escribe el M09b, y las dos no pueden compartir
          archivo: el M09b verifica que la delimitación no exceda la
          preliminar, y escribiendo encima se compararía consigo misma.

    archivos_renombrados:
      - de: "data/03_SIG/vector/area_influencia"
        a: "data/03_SIG/vector/area_influencia_preliminar"
        motivo: >-
          Lo que el estudio tiene en disco con ese nombre es la preliminar del
          M02. Se renombra para que la clave revalorada la encuentre, y para
          dejar libre el nombre que ocupará la definitiva.
        # Un shapefile son varios archivos y hay que mover todos: dejar el .prj
        # atrás produce una capa que se abre sin sistema de referencia.
        extensiones: [".shp", ".shx", ".dbf", ".prj", ".cpg", ".qmd",
                      ".shp.xml", "_campos.csv"]

  - desde: 2
    hasta: 3
    titulo: "Serie consolidada de dos redes: IDEAM y CAR"
    motivo: >-
      La serie consolidada deja de ser solo del IDEAM y reune tambien las
      estaciones de la CAR. El archivo se llamaba 'series_ideam.csv' y el
      nombre pasaba a mentir, que es lo que la seccion 2 de CLAUDE.md prohibe.
      Cada registro lleva ahora un campo 'fuente' que dice de que red salio.

    claves_nuevas:
      - clave: "series"
        despues_de: "estaciones"

    archivos_renombrados:
      - de: "data/02_procesado/series/series_ideam"
        a: "data/02_procesado/series/series"
        motivo: >-
          Se conserva el producto ya calculado bajo el nombre nuevo. Sin esto
          habria que volver a ejecutar el M04, y eso significa volver a
          descargar del IDEAM, que no es idempotente: un registro hoy
          Preliminar puede ser Definitivo manana y la serie cambiaria.
        extensiones: [".csv"]

  - desde: 3
    hasta: 4
    titulo: "Ventana de simulacion declarada, para la verificacion de crecientes"
    motivo: >-
      La ventana de simulacion estaba embebida en el M13 como
      'duracion_h * 4', es decir 12 horas con la tormenta de 3. Bastan para
      que el hidrograma se agote, pero la verificacion de crecientes contrasta
      contra el maximo de los caudales MEDIOS DIARIOS observados y para eso
      hay que promediar el hidrograma simulado a 24 h, que en una ventana de
      12 no existe. Pasa a declararse y se adoptan 36 horas.

    claves_nuevas:
      - clave: "tormenta.ventana_simulacion_h"
        despues_de: "tormenta.duracion_h"

  - desde: 4
    hasta: 5
    titulo: "Verificacion de crecientes contra caudal observado"
    motivo: >-
      Entra el M14c, que contrasta el modelo contra las crecientes observadas.
      Necesita sus propios parametros y el CRS del lienzo del .basin, que NO es
      el de calculo: en este estudio el canvas viene en EPSG:3116 mientras la
      cadena calcula en EPSG:9377, y entre los dos hay unos 4.000 km.

    claves_nuevas:
      - clave: "verificacion"
        despues_de: "estaciones"
      - clave: "hec_hms.proyecto.crs_lienzo"
        despues_de: "hec_hms.proyecto.modelo_cuenca"

  - desde: 5
    hasta: 6
    titulo: "Muskingum clasico como metodo de transito elegible"
    motivo: >-
      La configuracion declaraba hec_hms.transito.metodo_adoptado como si fuera
      elegible y el M13 escribia Muskingum-Cunge siempre, sin leer esa clave.
      Ahora la honra, y el Muskingum clasico necesita declarar su X, que no se
      deriva de la hidraulica sino que se adopta.

      Entra tambien caudal_referencia_tr, que el M14 ya leia con un valor por
      omision embebido. Un estudio no puede quedar dependiendo de un valor que
      no aparece en su configuracion: pasa a estar escrito.

    claves_nuevas:
      - clave: "hec_hms.transito.muskingum.caudal_referencia_tr"
        despues_de: "hec_hms.transito.muskingum.celeridad_ms"
      - clave: "hec_hms.transito.muskingum.x"
        despues_de: "hec_hms.transito.muskingum.caudal_referencia_tr"

  - desde: 6
    hasta: 7
    titulo: "Flujo base dentro del modelo"
    motivo: >-
      El modelo se escribia con 'Baseflow: None' y el hidrograma arrancaba en
      cero y volvia a cero. Para poder contrastarlo contra una creciente medida
      habia que descontarle al DATO OBSERVADO un caudal base estimado, es decir,
      meter una hipotesis en el lado de la evidencia. Con el flujo base dentro
      del modelo la comparacion es directa y la resta desaparece.

      El caudal antecedente se toma de la serie de MINIMOS mensuales y no de la
      de medios: el caudal medio mensual incluye la escorrentia de las tormentas
      del mes, y usarlo como flujo base la contaria dos veces. En PUENTE LA
      CALERA la diferencia entre uno y otro es de tres veces.

    claves_nuevas:
      - clave: "hec_hms.flujo_base"
        despues_de: "hec_hms.baseflow"

  - desde: 7
    hasta: 8
    titulo: "Contraste indicativo con series cortas"
    motivo: >-
      Descartar en seco una serie de caudal corta deja sin contraste partes
      enteras de la cuenca. En este estudio SIMAYA drena una rama distinta de la
      de PUENTE LA CALERA, y admitirla como INDICATIVA lleva la superficie
      contrastada del 37 % al 66 %. Lo que una serie corta no sostiene son los
      periodos altos, y de eso ya se encargaba factor_extrapolacion.

      Entra tambien la temporada humeda declarada. Exigir los doce meses para
      dar por bueno un maximo anual descarta anos a los que solo les falta un
      mes SECO, y en un mes seco no ocurre la creciente anual: en SIMAYA la
      regla de doce meses dejaba 5 anos y la de temporada humeda deja 9.

    claves_nuevas:
      - clave: "verificacion.minimo_anios_indicativo"
        despues_de: "verificacion.minimo_anios"
      - clave: "verificacion.meses_temporada_humeda"
        despues_de: "verificacion.minimo_anios_indicativo"

  - desde: 8
    hasta: 9
    titulo: "Celeridad y X de Muskingum por clase de pendiente"
    motivo: >-
      La celeridad se linealizaba en un caudal tomado de la salida del propio
      modelo, de modo que K y caudal se perseguian: medido, la iteracion
      recorria 185,6 / 125,3 / 79,1 / 112,1 / 120,9 antes de asentarse, y el
      resultado dependia de cuantas veces se iterara. Y la X que devolvia la
      linealizacion de Cunge sobre la geometria disponible era 0,497 de mediana
      en los 62 tramos, es decir traslacion pura, con dos tramos negativos que
      habia que recortar.

      Las dos pasan a declararse por clase de pendiente. No dependen ya ni de
      una seccion que no se levanto ni de la salida del modelo, a cambio de ser
      un criterio del consultor que el informe debe sustentar.

    claves_nuevas:
      - clave: "hec_hms.transito.muskingum.clases_pendiente"
        despues_de: "hec_hms.transito.muskingum.x"

  - desde: 9
    hasta: 10
    titulo: "Abstraccion inicial revisada, Ia = 0,05*S"
    motivo: >-
      Con lambda = 0,2 el modelo asignaba un coeficiente de escorrentia del
      1,4 % a una tormenta de 21,9 mm en una cuenca de paramo y pastos que
      mantiene caudal base todo el anio, y el volumen de escorrentia crecia
      30,6 veces entre Tr 2,33 y Tr 100 mientras la lluvia crecia 2,28 y la
      unica estacion no regulada del estudio crecia 4,75.

      Se adopta 0,05, con la conversion de S de Hawkins y otros (2009), que NO
      es opcional: las tablas de CN estan calibradas con 0,2 y bajar la
      abstraccion sin convertir S seria quedarse con el beneficio sin el costo.
      Al modelo va el CN equivalente; el de suelos y coberturas no cambia y el
      informe presenta los dos.

    claves_nuevas:
      - clave: "numero_curva.abstraccion_inicial_lambda"
        despues_de: "numero_curva.condicion_humedad"

  - desde: 10
    hasta: 11
    titulo: "Consistencia interna sin estaciones de caudal"
    motivo: >-
      El contraste externo solo es posible donde hay limnimetria utilizable, y
      en la mayoria de los estudios no la hay o esta comprometida. Entran cuatro
      comprobaciones que salen de lo que la cadena ya calculo y no necesitan
      ningun dato de caudal. En este estudio las cuatro detectaron un error real
      antes de que ninguna estacion dijera nada: el crecimiento de la creciente
      frente al de su lluvia delato el umbral de perdidas, y esa misma medida
      identifico a EL VERGEL como registro regulado.

    claves_nuevas:
      - clave: "verificacion.consistencia"
        despues_de: "verificacion.repeticiones"

  - desde: 11
    hasta: 12
    titulo: "Exponente de area y tiempo al pico en la consistencia interna"
    motivo: >-
      Entran las dos comprobaciones que faltaban de la bateria, y las dos
      detectaron un error real en este estudio antes de que ninguna estacion
      dijera nada. El exponente de area entre puntos anidados derivaba de 0,586
      a 0,858 entre la creciente frecuente y la de diseno, que era el desajuste
      de las perdidas expresado en geometria. Y el modelo picaba a 1 h contra un
      tiempo de concentracion de 10,67 h, que era la senal de que el transito no
      transportaba la onda.

    claves_nuevas:
      - clave: "verificacion.consistencia.exponente_area"
        despues_de: "verificacion.consistencia.coef_escorrentia_diseno"
      - clave: "verificacion.consistencia.deriva_exponente"
        despues_de: "verificacion.consistencia.exponente_area"
      - clave: "verificacion.consistencia.fraccion_area_minima"
        despues_de: "verificacion.consistencia.deriva_exponente"
      - clave: "verificacion.consistencia.tp_sobre_tc"
        despues_de: "verificacion.consistencia.fraccion_area_minima"

  - desde: 12
    hasta: 13
    titulo: "Embalses declarados en la configuracion"
    motivo: >-
      El embalse de San Rafael se habia insertado a mano en el .basin, en el
      .pdata y en el DSS, de modo que el estudio no podia reproducir su propio
      caudal de diseno a partir de sus insumos declarados: la cadena lo habria
      calculado en 185 m3/s en lugar de 82,5, sin ninguna senal de que faltaba
      la regulacion.

      Pasan a declararse. El M13 escribe el elemento, reconecta la topologia,
      guarda la curva en el DSS y la anota en el .pdata. La delimitacion
      asistida no los crea porque el DEM solo ve una superficie plana, y la
      cobertura tampoco basta: Corine clasifica San Rafael como laguna natural.

    claves_nuevas:
      - clave: "hec_hms.embalses"
        despues_de: "hec_hms.proyecto"

  - desde: 13
    hasta: 14
    titulo: "Factor de calibracion sobre el numero de curva"
    motivo: >-
      El consultor decide ajustar el numero de curva como ultima variable de
      calibracion. Se declara como factor y no editando la tabla de
      homologacion, que es doctrina compartida por todos los estudios: asi la
      decision viaja en la configuracion de ESTE estudio y el M13 deja las dos
      columnas para que el informe muestre el CN de suelos al lado del que
      recibe el modelo.

      Con 1.00 nada cambia, que es el valor por omision.

    claves_nuevas:
      - clave: "numero_curva.factor_calibracion"
        despues_de: "numero_curva.abstraccion_inicial_lambda"

  - desde: 14
    hasta: 15
    titulo: "Los dos escenarios de cambio climatico en una sola corrida"
    motivo: >-
      El factor de cambio climatico se declaraba y se aplicaba, pero el informe
      no podia mostrar cuanto del caudal procedia de la proyeccion y cuanto del
      dato: habia que correr la cadena dos veces cambiando la clave a mano y
      archivar los productos por separado.

      Ahora el M13 escribe los dos juegos de pluviometros, meteorologias y
      corridas, HEC-HMS los resuelve en la misma sesion y el M14 entrega la
      tabla comparativa. El de diseno es el que lleva el factor; el de
      referencia representa la lluvia registrada y no es una alternativa de
      diseno.

    claves_nuevas:
      - clave: "cambio_climatico.comparar_escenarios"
        despues_de: "cambio_climatico.aplicar"
