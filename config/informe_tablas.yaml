# =============================================================================
# FUENTES DE LAS TABLAS DEL INFORME  (insumo del M15)
# -----------------------------------------------------------------------------
# Que CSV alimenta cada tabla que la plantilla marca con "Completar la Tabla".
#
# ES UNA DECLARACION Y NO UNA REGLA. Adivinar la fuente por el texto de la
# leyenda funcionaria hasta el primer informe que llame a las cosas de otro
# modo. El numero es el que la propia instruccion de la plantilla usa.
#
# El separador del numero da igual: '2-1', '2‑1' y '21' se leen como el mismo,
# porque Word compone la leyenda con campos y al extraer su texto el guion se
# pierde.
#
# 'encabezados' son las filas de titulo que NO se tocan. La Tabla 2-1 lleva dos
# porque su cabecera esta partida en dos niveles para las coordenadas.
#
# 'columnas' es el orden en que las columnas del CSV van a las de la tabla. Una
# columna declarada que el CSV no tenga deja la celda VACIA y se reporta: un
# dato del estudio anterior en una tabla de este es peor que un hueco.
# =============================================================================

version: 1

tablas:

  - numero: "2-1"
    leyenda: "Identificacion Estaciones IDEAM"
    fuente: "data/02_procesado/estaciones/inventario_estaciones.csv"
    encabezados: 2
    columnas:
      - "Código de la estación"
      - "Nombre de la estación"
      - "Entidad operadora"
      - "Categoría"
      - "Altitud"
      - "Fecha de instalación"
      - "Este"
      - "Norte"

  - numero: "3-1"
    leyenda: "Area de drenaje microcuencas"
    fuente: "data/02_procesado/morfometria/subcuencas.csv"
    encabezados: 1
    columnas: [subcuenca, area_km2]

  - numero: "3-10"
    leyenda: "Indice de Sinuosidad microcuencas"
    fuente: "data/02_procesado/morfometria/subcuencas.csv"
    encabezados: 1
    columnas: [subcuenca, long_cauce_principal_km, distancia_recta_cauce_km,
               indice_sinuosidad]

  - numero: "3-11"
    leyenda: "Desnivel altitudinal microcuencas"
    fuente: "data/02_procesado/morfometria/subcuencas.csv"
    encabezados: 1
    columnas: [subcuenca, cota_max, cota_min, relieve_m]

  - numero: "3-13"
    leyenda: "Pendiente media cauce principal microcuencas"
    fuente: "data/02_procesado/morfometria/subcuencas.csv"
    encabezados: 1
    columnas: [subcuenca, long_flujo_km, desnivel_flujo_m, pendiente_flujo]

  - numero: "3-15"
    leyenda: "Pendiente media microcuencas"
    fuente: "data/02_procesado/morfometria/subcuencas.csv"
    encabezados: 1
    columnas: [subcuenca, area_km2, pendiente_cuenca]

  - numero: "3-17"
    leyenda: "Numero de Curva microcuencas"
    fuente: "data/02_procesado/morfometria/subcuencas.csv"
    encabezados: 1
    columnas: [subcuenca, area_km2, cobertura_dominante, cn]

  - numero: "3-18"
    leyenda: "Calculo Tiempo de Concentracion"
    fuente: "data/02_procesado/morfometria/tiempo_concentracion.csv"
    encabezados: 1
    columnas: [nombre, aplicable, tc_horas, tc_minutos, motivo]

  - numero: "5-10"
    leyenda: "Tiempo de Rezago modelo SCS"
    fuente: "data/02_procesado/morfometria/subcuencas.csv"
    encabezados: 1
    columnas: [subcuenca, tc_minutos, tlag_minutos]

  - numero: "5-12"
    leyenda: "Qmax Vs. Periodo de Retorno"
    fuente: "data/02_procesado/hidrologia/qmax_por_periodo.csv"
    encabezados: 1
    columnas: [periodo_retorno, caudal_m3s]
