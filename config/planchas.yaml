    subtitulo: "Seleccionadas y Descartadas del Catálogo del IDEAM"
    enmarca: "estaciones_seleccionadas"
    holgura: 0.12

  - layout: "Figura 9. Número de curva"
    titulo: "NÚMERO DE CURVA"
    subtitulo: "Método SCS por Subcuenca"
    enmarca: "subcuencas"

  - layout: "Figura 10. Tiempo de rezago"
