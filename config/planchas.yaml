# =============================================================================
# CATALOGO DE PLANCHAS  (insumo del M16)
# -----------------------------------------------------------------------------
# QUE ES VARIABLE Y QUE ES FIJO. Es la unica pregunta que este archivo responde,
# y la respuesta esta en tres niveles:
#
#   FIJO EN LA PLANTILLA, nunca se toca desde aqui ni desde el codigo:
#     la geometria del rotulo, sus posiciones y tamanos
#     los rotulos "PROYECTO:" y "CONTENIDO:"
#     la simbologia de cada capa
#     el tamano y la orientacion de cada pagina
#     la rosa nautica
#   Cambiar cualquiera de estas cosas se hace abriendo templates/planchas.qgz
#   en QGIS y guardando. El M16 las respeta.
#
#   VARIABLE POR ESTUDIO, sale de config.yaml y es igual en las 29 planchas:
#     rot_proyecto      <- proyecto.nombre y la fecha de ejecucion
#     rot_contratante   <- proyecto.contratante
#     rot_consultor     <- proyecto.consultor
#     logo_contratante  <- planchas.logos.contratante
#     logo_consultor    <- planchas.logos.consultor
#     el CRS de presentacion <- el del punto de descarga del M01
#
#   VARIABLE POR PLANCHA, se declara aqui o se calcula:
#     titulo y subtitulo  -> se declaran abajo, van a rot_contenido
#     encuadre            -> se calcula de la capa que enmarca
#     escala              -> se CALCULA del marco y se normaliza
#     escala_numerica y rot_referencia -> se derivan de la escala
#
# LA ESCALA NO SE ESCRIBE NUNCA A MANO, y no es una preferencia. Medido sobre
# las 31 planchas que el consultor entrego, CUATRO llevaban mal la escala:
#   Figura 4  decia 1:200.000 y el marco estaba en 1:234.656
#   Figura 6  decia 1:200.000 y estaba en 1:165.000
#   Figura 13 decia 1:200.000 en un texto y 1:600.000 en el otro
#   Figura 23 decia 1:16.500, con un cero de menos
# Un revisor que mida sobre el papel encuentra eso, y desacredita el estudio
# entero. Derivarla del marco hace imposible la discrepancia.
#
# 'enmarca' es la capa cuya extension define el encuadre. 'holgura' es la
# fraccion que se anade alrededor antes de normalizar la escala.
# =============================================================================

version: 1

# Serie de escalas a la que se redondea HACIA ARRIBA. Es doctrina cartografica:
# una plancha en 1:234.656 no es una plancha, es un descuido.
escalas_normalizadas: [1000, 2000, 2500, 5000, 10000, 15000, 20000, 25000,
                       50000, 75000, 100000, 125000, 150000, 165000, 200000,
                       250000, 300000, 400000, 500000, 600000, 750000, 1000000]

holgura_por_defecto: 0.08

# Formato del bloque de referencia. Las llaves se sustituyen; el resto es fijo.
formato_referencia: |-
  Sistema de coordenadas: {crs}
  Unidades: {unidades}
  Escala: 1:{escala}

formato_escala: "Escala 1:{escala}"

# -----------------------------------------------------------------------------
# LAS 29 PLANCHAS
#
# 'layout' es el nombre EXACTO del layout en templates/planchas.qgz y es la
# clave que las une: si no coincide, el modulo lo reporta y no adivina.
#
# SE RETIRARON DOS del juego original, el modelo digital de elevacion y la
# cobertura por clase, y las demas quedaron renumeradas. La decision esta en
# los PDF que el consultor entrego: un juego limpio de 1 a 29 sin huecos.
# -----------------------------------------------------------------------------
planchas:

  - layout: "Figura 1. Localización general"
    titulo: "LOCALIZACIÓN GENERAL"
    subtitulo: "Cuenca de Estudio en su Subzona Hidrográfica"
    # ENMARCA LA SUBZONA QUE CONTIENE LA CUENCA, no el contexto entero. La capa
    # de contexto se dibuja debajo para situarla, pero encuadrar sobre sus diez
    # subzonas llevaba la plancha al tope de la serie de escalas y la cuenca
    # quedaba en un punto.
    enmarca: "subzona_intersectada"
    holgura: 0.10

  - layout: "Figura 2. Zonificacion Hidrografica"
    titulo: "ZONIFICACIÓN HIDROGRÁFICA"
    subtitulo: "Subzona Hidrográfica del IDEAM y Cuenca de Estudio"
    enmarca: "subzona_intersectada"
    holgura: 0.12

  - layout: "Figura 3. Área de influencia"
    titulo: "ÁREA DE INFLUENCIA"
    subtitulo: "Delimitación Adoptada y Envolvente de la Cuenca"
    enmarca: "area_influencia"

  - layout: "Figura 4. Pendiente del terreno"
    titulo: "PENDIENTE DEL TERRENO"
    subtitulo: "Derivada del Modelo Digital de Elevación"
    enmarca: "cuenca_completa"

  - layout: "Figura 5. Red de drenaje"
    titulo: "RED DE DRENAJE"
    subtitulo: "Cauces Sencillos, Dobles y Cuerpos de Agua"
    enmarca: "cuenca_completa"

  - layout: "Figura 6. Subcuencas del modelo hidrológico"
    titulo: "SUBCUENCAS DEL MODELO HIDROLÓGICO"
    subtitulo: "Delimitación Asistida en HEC-HMS"
    enmarca: "subcuencas"

  - layout: "Figura 7. Cobertura de la tierra"
    titulo: "COBERTURA DE LA TIERRA"
    subtitulo: "Corine Land Cover Recortado al Área de Influencia"
    enmarca: "cobertura_clc_area"

  - layout: "Figura 8. Estaciones hidrometeorológicas"
