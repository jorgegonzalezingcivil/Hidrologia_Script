# =============================================================================
# CONFIGURACIÓN DEL ESTUDIO HIDROLÓGICO
# -----------------------------------------------------------------------------
# Único punto de edición de parámetros. Ningún módulo debe contener valores
# embebidos. Toda decisión con margen técnico queda registrada aquí.
# =============================================================================

proyecto:
  nombre: "Estudio Hidrológico - PLANTILLA"
  contratante: ""
  consultor: ""
  anio_estudio: 2026            # controla el filtro de estaciones suspendidas
  responsable: ""

# -----------------------------------------------------------------------------
# ENTORNOS DE EJECUCIÓN
# Se adopta el esquema de doble entorno (ver CLAUDE.md, sección 3).
# -----------------------------------------------------------------------------
entornos:
  qgis:
    # DESVIACIÓN documentada respecto de CLAUDE.md, sección 3, que adopta el
    # esquema LTR. Se declara la versión 4.2.0 instalada en la máquina, que no
    # es LTR. Consecuencia asumida: los módulos SIG quedan expuestos a cambios
    # de API en actualizaciones menores de la serie 4.x. La decisión y su
    # justificación están registradas en MANIFIESTO.yaml.
    version: "4.2.0"
    es_ltr: false
    python: "C:/Program Files/QGIS 4.2.0/bin/python-qgis.bat"
    prefix_path: "C:/Program Files/QGIS 4.2.0/apps/qgis"
  venv:
    python: ".venv/Scripts/python.exe"

software:
  hec_hms:
    ruta: "C:/Program Files/HEC/HEC-HMS/4.13"
    version: "4.13"

# -----------------------------------------------------------------------------
# SISTEMA DE REFERENCIA
# -----------------------------------------------------------------------------
crs:
  calculo: "EPSG:9377"           # MAGNA-SIRGAS / Origen Nacional CTM12
  geografico: "EPSG:4326"        # solo consulta a servicios externos
  reproyeccion_explicita: true   # nunca reproyectar de forma implícita

# -----------------------------------------------------------------------------
# M00c - VERIFICACIÓN DE INSUMOS DEL USUARIO
# Las rutas internas del manifiesto se resuelven contra el directorio del propio
# manifiesto, no contra la raíz del repositorio.
# -----------------------------------------------------------------------------
insumos_usuario:
  manifiesto: "data/00_insumos_usuario/MANIFIESTO.yaml"
  generar_homologacion: true     # crea la tabla con los valores únicos del insumo
  delimitador_csv: ";"           # separador de las tablas de homologación
  tabla_escala_area: "data/referencia/escala_area_suelos.csv"
  cuenca_referencia: "data/03_SIG/vector/cuenca_preliminar.shp"
  max_valores_homologacion: 500  # por encima, la tabla deja de ser diligenciable

# -----------------------------------------------------------------------------
# M00b - PROYECTO QGIS
# El árbol de grupos y capas se declara aparte, en el archivo indicado en
# 'declaracion'. El .qgz se regenera por completo en cada ejecución; la
# simbología no vive dentro del proyecto sino en los .qml del directorio
# 'estilos', de modo que los ajustes del consultor sobreviven a la regeneración.
# -----------------------------------------------------------------------------
proyecto_qgis:
  declaracion: "config/proyecto_qgis.yaml"
  archivo: "data/03_SIG/proyecto/estudio_hidrologico.qgz"
  estilos: "data/03_SIG/proyecto/estilos"
  titulo: "Estudio hidrológico"
  escribir_estilo_inicial: true  # crea el .qml por defecto si aún no existe
  detener_si_falta_capa: false   # true: una capa declarada ausente detiene el módulo

# -----------------------------------------------------------------------------
# M01 - PUNTO DE DESCARGA Y SUBZONA HIDROGRÁFICA
# -----------------------------------------------------------------------------
# El punto se declara en el sistema de referencia en que el consultor lo tenga,
# no en uno fijo. 'crs' indica en qué sistema están expresados 'x' e 'y', y el
# M01 reproyecta de forma explícita al CRS de cálculo (CLAUDE.md, sección 5).
#
#   CRS proyectado (EPSG:3116, 9377, 21818...):  x = Este,     y = Norte
#   CRS geográfico (EPSG:4326, 4686):            x = longitud, y = latitud
#
# El orden x, y es siempre el mismo. En un CRS geográfico eso significa que la
# longitud va primero, que es el error de transcripción más común: el M01
# verifica que el punto caiga dentro de Colombia y se detiene si no.
punto_descarga:
  nombre: "Descarga"
  crs: "EPSG:3116"               # MAGNA-SIRGAS / Colombia Bogota zone
  x: 1003512.4                   # Este
  y: 1025917.54                  # Norte

# -----------------------------------------------------------------------------
# CAPAS NACIONALES DE REFERENCIA
# -----------------------------------------------------------------------------
# El drenaje 1:100.000 del IGAC ocupa 645 MB entre sus dos capas. Versionarlo
# haría inmanejable el repositorio y convertiría el entregable en algo que no se
# puede enviar. Vive fuera del árbol del proyecto, en una sola copia por máquina
# compartida por todos los estudios, y el repositorio versiona únicamente el
# recorte al área de influencia que produce el M02.
#
# 'directorio' debe ser una ruta absoluta fuera del repositorio. El esquema lo
# verifica y detiene la carga si apunta dentro.
referencia_nacional:
  directorio: "C:/SIG_Referencia_Nacional"
  drenaje_sencillo: "Drenaje_Sencillo.shp"
  drenaje_doble: "Drenaje_Doble.shp"
  escala: "1:100000"
  fuente: "IGAC"
  fecha: "2021-07-29"
  # Adaptador de nombres de campo. Ambas capas comparten el del nombre.
  campos:
    nombre: "NOMBRE_GEO"
  # Tolerancia de conexión entre un afluente y el cauce receptor. Medido sobre
  # la zona del estudio, el 93% de las desembocaduras que alcanzan el drenaje
  # doble lo tocan exactamente; unos pocos metros cubren el resto.
  tolerancia_conexion_m: 5.0
  # Proporción máxima de nodos que pueden incumplir la convención de sentido de
  # digitalización antes de que el módulo se detenga. Medido: 3,17% en la
  # ventana de 25 km alrededor del punto.
  max_incumplimiento_sentido_pct: 10.0
  # Productos del recorte. Van al espacio del ESTUDIO y no a data/referencia:
  # son producto del M02 para un area concreta, no doctrina. Dejarlos entre la
  # doctrina hacia que un estudio nuevo recogiera en silencio el recorte de
  # otro proyecto, porque las rutas de doctrina descienden a la herramienta.
  # --- Suelos y cobertura de base -------------------------------------------
  # DECISION DEL CONSULTOR, 2026-08-09. Registrada en MANIFIESTO.yaml.
  #
  # Estas dos capas son la BASE SIEMPRE, con independencia del tamano de la
  # cuenca. Si el consultor aporta informacion propia en
  # data/00_insumos_usuario, ESA tiene precedencia; si no la aporta, se usan
  # estas y el modulo lo declara en su reporte.
  #
  # Viven fuera del repositorio por la misma razon que el drenaje del IGAC:
  # entre las dos ocupan 3 GB y versionarlas haria inmanejable el entregable.
  # El repositorio versiona solo el recorte al area de influencia.
  #
  # HYSOGs250m trae el grupo hidrologico YA ASIGNADO, de modo que corresponde al
  # perfil D del adaptador: raster con valores a reclasificar. Su codificacion
  # es 1=A, 2=B, 3=C, 4=D para grupos simples, y 11=A/D, 12=B/D, 13=C/D, 14=D/D
  # para los DUALES, que significan drenado/sin drenar.
  suelos_hsg: "suelos/HYSOGs250m.tif"
  suelos_hsg_crs: "EPSG:4326"
  suelos_hsg_escala: "1:250000"
  suelos_hsg_fuente: "Ross et al. (2018), Global Hydrologic Soil Groups, ORNL DAAC"
  cobertura_clc: "cobertura/cobertura_tierra_clc_2018.shp"
  cobertura_clc_crs: "EPSG:4686"
  cobertura_clc_campo: "codigo"
  cobertura_clc_fuente: "IDEAM, Corine Land Cover Colombia 2018"
  salida_recorte_suelos: "data/03_SIG/raster/suelos_hsg_area.tif"
  salida_recorte_cobertura: "data/03_SIG/vector/cobertura_clc_area.shp"
  salida_recorte_sencillo: "data/03_SIG/vector/drenaje_sencillo_area.shp"
  salida_recorte_doble: "data/03_SIG/vector/drenaje_doble_area.shp"
  salida_grafo: "data/02_procesado/red_drenaje_grafo.json"

subzonas_hidrograficas:
  archivo: "data/referencia/sig/Zonificacion_hidrografica_2013.shp"
  tolerancia_m: 500.0            # distancia máxima admitida si el punto cae fuera
  # Adaptador de nombres de campo. La capa la publica el IDEAM y sus nombres
  # pueden cambiar entre versiones; se declaran aquí y no en el código.
  campos:
    codigo_szh: "COD_SZH"
    nombre_szh: "NOM_SZH"
    codigo_zh: "COD_ZH"
    nombre_zh: "NOM_ZH"
    codigo_ah: "COD_AH"
    nombre_ah: "NOM_AH"
  salida_punto: "data/03_SIG/vector/punto_descarga.shp"
  salida_subzona: "data/03_SIG/vector/subzona_intersectada.shp"

# -----------------------------------------------------------------------------
# M02 - MODELO DIGITAL DE TERRENO
# -----------------------------------------------------------------------------
dem:
  fuente: "ALOS_PALSAR_RTC"
  resolucion_m: 12.5
  earthdata:
    netrc: true                  # credenciales en un archivo netrc, nunca aquí
    # Ubicación del archivo de credenciales. null usa ~/.netrc, que es lo
    # estándar y lo que leen también curl, wget y GDAL.
    #
    # Se admite declarar otra ruta para compartir un solo archivo entre varios
    # estudios o entre varios equipos, pero DEBE quedar fuera del repositorio:
    # la carpeta del proyecto se comprime y se entrega como anexo, y ni el
    # .gitignore ni ninguna protección de git alcanzan a un .zip o a una copia.
    # El M02 se detiene si la ruta declarada cae dentro del repositorio.
    ruta_netrc: null
  area_influencia:
    metodo: "envolvente"         # envolvente del polígono delimitado
    buffer_km: 1.0

  # --- Búsqueda y descarga de escenas ---------------------------------------
  # ALOS PALSAR acumula muchas adquisiciones sobre la misma huella espacial. El
  # modelo de elevación que acompaña a cada producto RTC no cambia entre
  # pasadas, de modo que se deduplica por huella y luego se elige el
  # subconjunto mínimo que cubre el área. Sin esa reducción, la subzona del Río
  # Bogotá exigiría descargar 217 escenas y 62 GB en lugar de una fracción.
  asf:
    nivel: "RTC_HI_RES"          # ALOS_PALSAR_RTC_HIGH_RES; trae el DEM a 12,5 m
    plataforma: "ALOS"
    # Ventana de adquisición de las trayectorias. null en ambas usa todo el
    # catálogo. Restringirla reduce la descarga, pero puede dejar el área sin
    # cubrir: el módulo reporta la cobertura alcanzada y advierte si baja de
    # cobertura_minima_pct.
    fecha_inicio: "2011-02-10"
    fecha_fin: "2011-03-22"
    buffer_busqueda_km: 2.0      # holgura sobre la subzona del M01
    max_escenas: 40              # tope de seguridad; por encima se detiene
    max_volumen_gb: 15.0         # tope de descarga; por encima se detiene
    verificar_md5: true
    reintentos: 3
    patron_dem_en_zip: ".dem.tif"
    cobertura_minima_pct: 99.0   # por debajo se advierte de huecos sin cubrir

  # --- Delimitación preliminar ----------------------------------------------
  # El método NO es fijo: se elige según dónde caiga el punto de descarga.
  # Los dos enfoques tienen dominios complementarios y medidos en este proyecto.
  #
  #   Escenario 1, punto sobre drenaje doble. Ríos anchos, en valles amplios y
  #     planos. El DEM de radar falla ahí: sobre el Río Bogotá, con 3 m de
  #     desnivel real en 20 km, encaminó el flujo por el ruido y produjo una
  #     cuenca de 6,59 km2 en lugar de la real. Método: cartográfico.
  #
  #   Escenario 2, punto sobre drenaje sencillo o su aferencia. Recorrido
  #     directo sobre la red de polilíneas, sin eje ni empalme. Método:
  #     cartográfico.
  #
  #   Escenario 3, punto sin intersección con ninguna capa. Si el cauce no está
  #     cartografiado a 1:100.000 es pequeño, y una cuenca pequeña suele estar
  #     en ladera con pendiente marcada. Ahí el DEM sí es fiable, porque el
  #     modo de fallo anterior exige terreno plano. Método: terreno.
  delimitacion:
    metodo: "automatico"         # automatico | cartografico | terreno
    umbral_drenaje_doble_m: 50.0   # distancia máxima para declarar escenario 1
    umbral_drenaje_sencillo_m: 150.0  # ídem para escenario 2
    tolerancia_empalme_eje_m: 200.0   # unión del eje con el drenaje sencillo
    # Origen del área de influencia por escenario.
    #   subzona    la subzona hidrográfica del M01, tal cual
    #   red        envolvente de la red trazada más buffer
    #   cuenca     la cuenca delimitada sobre el terreno
    #
    # Para el escenario 1 se adopta la subzona. Es una unidad hidrológica
    # cerrada, de modo que CONTIENE la cuenca por definición de la zonificación:
    # elimina de raíz el riesgo de truncamiento, que es el que ha resultado
    # crítico. Su coste es sobredimensionar el área unas cuatro veces, y ese
    # coste hoy es solo disco: la descarga del DEM ya está acotada por la propia
    # subzona y el escenario 1 no ejecuta análisis de terreno, que era lo caro.
    #
    # Un área de influencia amplia no perjudica al M03: más estaciones dan mejor
    # soporte a la interpolación, y el filtro por categoría sigue aplicando.
    origen_area:
      escenario_1: "subzona"
      escenario_2: "red"
      escenario_3: "cuenca"
    # Buffer sobre la red trazada, por escenario. Es la holgura que absorbe la
    # conectividad imperfecta de la cartografía: medido sobre la subzona, el
    # 85,1% de los tramos toca a su receptor y el 15% restante está a cientos
    # de metros, no a unos pocos. No hay tolerancia que lo arregle, de modo que
    # se compensa con buffer. Un exceso solo cuesta disco; un defecto trunca la
    # cuenca y contamina todo lo que viene después.
    buffer_red_km:
      escenario_1: 8.0           # el que más holgura necesita
      escenario_2: 5.0
    # Solo aplican al escenario 3, que sí analiza terreno.
    umbral_celdas_cauce: 1000    # celdas acumuladas para definir cauce
    radio_ajuste_m: 250.0        # búsqueda del cauce alrededor del punto
    detener_si_toca_borde: true  # una cuenca truncada no es utilizable
    salida_dem: "data/03_SIG/raster/dem_recortado.tif"
    salida_cuenca: "data/03_SIG/vector/cuenca_preliminar.shp"
    salida_envolvente: "data/03_SIG/vector/envolvente.shp"
    salida_area_influencia: "data/03_SIG/vector/area_influencia.shp"

# -----------------------------------------------------------------------------
# M03 - SELECCIÓN DE ESTACIONES
# -----------------------------------------------------------------------------
estaciones:
  buffer_adicional_km: 1.0       # holgura sobre el área de influencia del M02
  catalogo: "data/referencia/sig/CNE_IDEAM_Final.shp"
  fecha_catalogo: "2024-01-01"   # descarga del CNE, para trazabilidad
  # Adaptador de nombres de campo del Catálogo Nacional de Estaciones. Los
  # campos d_* traen la descripción legible de los códigos.
  campos:
    codigo: "CODIGO"
    nombre: "nombre"
    categoria: "CATEGORIA"
    categoria_desc: "d_CATEGORI"
    estado: "d_ESTADO"
    entidad: "ENTIDAD"
    altitud: "altitud"
    latitud: "latitud"
    longitud: "longitud"
    corriente: "d_CORRIENT"
    departamento: "d_DEPARTAM"
    municipio: "d_MUNICIPI"
    subzona: "d_SUBZONA_"
    fecha_instalacion: "FECHA_INST"
    fecha_suspension: "FECHA_SUSP"
  # Banda de incertidumbre vertical para juzgar si una estación está aguas
  # arriba del punto de descarga. Dentro de ella la cota NO decide y el caso se
  # remite a la red de drenaje.
  #
  # Medido en este proyecto: la estación 2120700146 aparecía 15 m por debajo del
  # punto y estaba 6,26 km AGUAS ARRIBA sobre el mismo cauce. En la sabana el
  # Río Bogotá cae centímetros por kilómetro, y el DEM de radar tiene
  # incertidumbre vertical de varios metros: la diferencia era ruido. Descartar
  # por cota dentro de esa banda elimina estaciones válidas en silencio.
  banda_cota_m: 30.0
  salida_seleccionadas: "data/03_SIG/vector/estaciones_seleccionadas.shp"
  salida_descartadas: "data/03_SIG/vector/estaciones_descartadas.shp"
  inventario_csv: "data/02_procesado/estaciones/inventario_estaciones.csv"
  categorias_por_variable:
    precipitacion: [AM, CO, CP, PG, PM, SP, SS]
    temperatura:   [AM, CO, CP, SP, SS]
    evaporacion:   [AM, CO, CP]
    caudal:        [LG, LM, RM]

# -----------------------------------------------------------------------------
# M04 - INGESTA IDEAM
# -----------------------------------------------------------------------------
ideam:
  fuente_primaria: "socrata"     # socrata | dhime_zip
  socrata:
    dominio: "www.datos.gov.co"
    token: ""                    # token de aplicación (gratuito). Vacío = sin token
    limite_pagina: 50000
    dataset_catalogo: "hp9r-jxuu"
  # --- Descarga automática desde el servicio DHIME --------------------------
  # El servicio es una tarea de geoprocesamiento pública de ArcGIS Server y
  # devuelve el .zip embebido en base64 dentro de la respuesta, de modo que el
  # tamaño de cada petición tiene un límite práctico: se trocea por estación y
  # por ventana temporal.
  #
  # El límite de 30 años por descarga que documenta CLAUDE.md, sección 7, es la
  # razón de 'ventana_anios' y, con ella, de que haya varios archivos por
  # estación y de que la deduplicación sea imprescindible.
  descarga:
    activar: false               # true habilita la descarga en el M04
    fecha_inicio: "1970-01-01"
    fecha_fin: "2025-12-31"
    ventana_anios: 30
    max_series_por_trabajo: 4    # series por petición al servicio
    espera_entre_trabajos_s: 2.0
    reintentos: 3
    # Series a solicitar por variable. Las etiquetas están verificadas contra
    # los archivos reales y contra el catálogo del servicio.
    series_por_variable:
      precipitacion:
        # El sufijo _CON marca observación convencional directa, y es el que
        # distingue la serie DIARIA: PTPM_CON es pluviómetro diario, igual que
        # TMX_CON y TMN_CON son temperatura diaria. Verificadas por descarga el
        # 2026-08-07 sobre la estación 21201200.
        #
        # PTPM_CON es IMPRESCINDIBLE para el análisis de máximos. Sin ella el
        # M07 no tiene serie de Pmáx 24 h, y la detección de registros
        # ACUMULADO del Calificador pierde sentido, porque solo existe sobre la
        # serie diaria. Los archivos de 2022 no la traen: aquel estudio era de
        # balance hídrico y la serie mensual bastaba.
        - {parametro: "PRECIPITACION", etiqueta: "PTPM_CON", tipo_serie: "Estandar", calculo: ""}
        - {parametro: "PRECIPITACION", etiqueta: "PTPM_TT_M", tipo_serie: "Estandar", calculo: ""}
        # Máximo mensual de totales diarios que publica el IDEAM. No sustituye
        # al cálculo del M07 sobre la serie diaria: sirve de contraste, para
        # verificar que la Pmáx calculada coincide con la publicada.
        - {parametro: "PRECIPITACION", etiqueta: "PTPM_MX_TT_M", tipo_serie: "Estandar", calculo: ""}
        # Pluviógrafo, por simetría con el pluviómetro. Etiquetas válidas,
        # verificadas: una estación sin pluviógrafo responde "Estación no
        # configurada en la serie seleccionada", que es distinto de que la
        # etiqueta no exista.
        - {parametro: "PRECIPITACION", etiqueta: "PTPG_TT_D", tipo_serie: "Estandar", calculo: ""}
        - {parametro: "PRECIPITACION", etiqueta: "PTPG_TT_M", tipo_serie: "Estandar", calculo: ""}
        - {parametro: "PRECIPITACION", etiqueta: "PTPG_MX_D", tipo_serie: "Estandar", calculo: ""}
      temperatura:
        - {parametro: "TEMPERATURA", etiqueta: "TMX_CON", tipo_serie: "Estandar", calculo: ""}
        - {parametro: "TEMPERATURA", etiqueta: "TMN_CON", tipo_serie: "Estandar", calculo: ""}
      evaporacion:
        - {parametro: "EVAPORACION", etiqueta: "EV_TT_D", tipo_serie: "Estandar", calculo: ""}
      caudal:
        # ATENCIÓN: el catálogo del servicio (ObtenerListaSeriesTiempoCalculo)
        # NO lista CAUDAL como parámetro, y sin embargo estas series existen.
        # El catálogo está incompleto y no es autoritativo: lo único que
        # determina si una etiqueta existe es descargarla. Verificadas el
        # 2026-08-07 sobre la estación 21197080.
        - {parametro: "CAUDAL", etiqueta: "Q_MEDIA_D", tipo_serie: "Estandar", calculo: ""}
        - {parametro: "CAUDAL", etiqueta: "Q_MEDIA_M", tipo_serie: "Estandar", calculo: ""}
        - {parametro: "CAUDAL", etiqueta: "Q_MX_D", tipo_serie: "Estandar", calculo: ""}
        - {parametro: "CAUDAL", etiqueta: "Q_MX_M", tipo_serie: "Estandar", calculo: ""}
        - {parametro: "CAUDAL", etiqueta: "Q_MN_M", tipo_serie: "Estandar", calculo: ""}
        - {parametro: "NIVEL", etiqueta: "NV_MEDIA_D", tipo_serie: "Estandar", calculo: ""}

  dhime_zip:
    patron_archivo: "*.csv"      # se descubre por patrón, nunca por nombre fijo
    perfiles: "config/perfiles_ideam.yaml"
  deduplicacion:
    clave: [CodigoEstacion, Parametro, Fecha]
    precedencia_aprobacion: [Definitivo, Preliminar]
    reportar_conflictos: true
  nivel_aprobacion:
    usar_como_filtro: false      # marca informativa, no criterio de descarte
  escala_temporal:
    deteccion: "cruzada"         # mapeo de Parametro + espaciamiento modal
    detener_si_discrepa: true
  agregacion_diaria_a_mensual:
    max_dias_faltantes: 3        # por encima de este valor el mes se marca nulo
  precipitacion_mensual:
    fuente_primaria: "mensual_ideam"
    completar_con_agregacion_diaria: true
    reporte_discrepancias: true

# -----------------------------------------------------------------------------
# M04b - SENSIBILIDAD DE LONGITUD DE SERIES
# -----------------------------------------------------------------------------
sensibilidad_series:
  umbrales_anios: [10, 15, 20, 25, 30]
  ventanas: [[1980, null], [1990, null], [2000, null]]   # null = año del estudio
  # Proporción del año que debe tener registro para que ese año cuente como
  # útil. Sin este control, un año con tres días de dato sumaría igual que uno
  # completo y la longitud de serie quedaría inflada.
  #
  # Medido sobre la serie consolidada de este estudio: la completitud anual
  # tiene mediana 0,97 en las series diarias y 1,00 en las mensuales, con una
  # cola de años parciales (percentil 10 en 0,37). El umbral 0,80 conserva el
  # 73,6% de los años diarios y el 91,8% de los mensuales, y deja fuera esa
  # cola.
  #
  # ADVERTENCIA: 0,80 en una serie diaria admite hasta 73 días ausentes. Para
  # medir LONGITUD es razonable, pero NO basta para la serie de máximos del M07:
  # un año al que le falte parte de la temporada de lluvias puede no contener su
  # propio máximo anual. El M07 debe imponer su criterio, estacional, y no
  # heredar este.
  completitud_anual_minima: 0.80
  anios_max_suspension: 5
  # --- DECISIÓN DEL CONSULTOR, adoptada el 2026-08-07 tras revisar la matriz ---
  # Registrada en MANIFIESTO.yaml con su justificación completa.
  #
  # Umbral general. 30 años en la ventana 1980-2026 conserva 42 estaciones de
  # precipitación, 41 de ellas dentro de la cuenca. Cuesta solo tres frente a 25
  # años, de modo que la exigencia es casi gratuita en conteo, y coincide con el
  # periodo climatológico normal de la OMM, lo que lo hace sustentable ante
  # interventoría sin argumento adicional.
  umbral_adoptado_anios: 30

  # Ventana. 47 años. Conserva más estaciones en todos los umbrales que las
  # ventanas de 1990 y 2000, y cubre varios ciclos ENSO completos, que el M05b
  # necesita para clasificar por fase. Con periodos de retorno de hasta 500 años
  # la serie más larga es siempre preferible. El nulo final es el año del estudio.
  ventana_adoptada: [1980, null]

  # Sobre qué se mide el umbral:
  #   utiles  todos los años que alcanzan la completitud, aunque haya huecos
  #   racha   solo los años útiles consecutivos
  #
  # Se adopta 'utiles' porque el M05 existe para complementar precisamente esos
  # huecos: exigir continuidad ANTES de intentar el relleno descarta estaciones
  # que el complemento podría reparar. La continuidad se sigue reportando en
  # columna aparte, y con 'racha' el umbral de 20 años dejaría 24 estaciones en
  # lugar de 48.
  criterio_umbral: "utiles"

  # Excepciones por variable. El umbral general no sirve para todas: la
  # disponibilidad de cada una es distinta y aplicar 30 años a todas dejaría sin
  # dato a las más escasas. Una variable no listada usa el umbral general.
  umbrales_por_variable:
    # Con 30 años quedan 11 estaciones, escasas para sostener el gradiente
    # altitudinal con que el M18a calcula la evapotranspiración. Con 20 quedan 18.
    temperatura: 20
    # Con 20 años quedan CERO. Es el límite superior posible: por encima se
    # desactivarían el balance de Budyko del M18 y la evapotranspiración del
    # M18a. Con 15 quedan 4 estaciones, que es lo que hay.
    evaporacion: 15

# -----------------------------------------------------------------------------
# M05 - PROCESAMIENTO DE PRECIPITACIÓN MENSUAL
# Orden fijo: anómalos -> consistencia -> complemento
# -----------------------------------------------------------------------------
anomalos:
  metodo: "IQR"                  # IQR | ER | ZSCORE
  q1: 0.25                       # valores normativos, no calibrados manualmente
  q3: 0.75
  k_sigma: 3.0
  zscore_umbral: 3.0
  tratamiento: "marcar"          # marcar | drop | cap | imputar
  # DECISION DEL CONSULTOR, 2026-08-07. Registrada en MANIFIESTO.yaml.
  #
  # Los valores que senala el IQR NO se eliminan. Medido sobre los 560 marcados:
  # su exceso mediano sobre el limite es 1,14 veces y su magnitud mediana 178
  # mm/mes, con el 62% por debajo de 200 mm. Son meses humedos reales, no
  # errores: el IQR marca la cola superior por construccion, porque la
  # precipitacion mensual es asimetrica a la derecha. Eliminarlos y rellenarlos
  # sustituiria extremos reales por estimaciones suavizadas y sesgaria la serie
  # a la baja, justo donde el M07 necesita fidelidad.
  #
  # La eliminacion se hace por el Calificador del IDEAM, que es su juicio sobre
  # su propio dato. Los efectos estan declarados en perfiles_ideam.yaml y este
  # parametro dice cuales se honran excluyendo el registro.
  calificadores_excluidos: ["DATO RECHAZADO"]
  aplicar_a_serie_maximos: false # NUNCA true: truncaría el dato de diseño

consistencia:
  metodos: [doble_masa, correlacion, pettitt, snht, mann_kendall, rachas]
  # DECISIÓN DEL CONSULTOR, 2026-08-07. Registrada en MANIFIESTO.yaml.
  # Medido sobre las 42 estaciones admitidas: la correlación entre parejas tiene
  # mediana 0,555 y solo el 1,6% alcanza 0,80. No es falta de muestra (la mediana
  # de meses comunes es 424), sino que el área abarca la subzona entera, de 250 a
  # más de 3000 m y cruzando la cordillera, con regímenes que no tienen por qué
  # correlacionarse. Con 0,80 quedaban 24 estaciones aisladas de 42; con 0,70
  # quedan 8 y con 0,60 solo 1.
  correlacion_minima: 0.70
  # Una vecina tiene que serlo tambien en el terreno, no solo en la estadistica.
  # Medido sobre las parejas que superaban la correlacion 0,70: la distancia
  # mediana era 15 km, pero el percentil 90 llegaba a 58 km y el maximo a 105 km,
  # con desniveles de hasta 3157 m. A esa distancia y ese desnivel la correlacion
  # no significa regimen compartido: ambas responden al mismo ciclo estacional
  # regional, y eso no sustenta una curva de doble masa ni un relleno.
  #
  # La doble masa clasica compara contra un patron de estaciones PROXIMAS y del
  # mismo regimen. Estos dos limites lo hacen exigible.
  distancia_maxima_km: 30.0
  desnivel_maximo_m: 1000.0
  n_estaciones_vecinas: 5
  descartar_bajo_umbral: true
  # DECISION DEL CONSULTOR, 2026-08-07. Registrada en MANIFIESTO.yaml.
  #
  # Las estaciones con quiebre de doble masa se CORRIGEN, no se descartan. El
  # tramo anterior al quiebre se multiplica por la razon entre pendientes para
  # homogeneizarlo con el reciente, que es el metodo clasico. Descartarlas
  # dejaria 27 estaciones de 42 y adelgazaria la cobertura justo donde la red ya
  # es escasa, perdiendo ademas la longitud de serie que costo el umbral de 30
  # anios.
  corregir_doble_masa: true
  # Razon de pendientes por encima de la cual la correccion se reporta como
  # sospechosa en lugar de aplicarse en silencio. Un factor de 1,5 significa que
  # la estacion habria cambiado su registro en un 50%: eso ya no es deriva de
  # instrumento sino, probablemente, otra estacion.
  razon_maxima_correccion: 1.5

complemento:
  metodos_evaluados: [regresion_vecinas, razon_normal, idw, knn, mice]
  # DECISIÓN DEL CONSULTOR, 2026-08-07. Registrada en MANIFIESTO.yaml.
  metodo_adoptado: "regresion_vecinas"
  validacion_cruzada: true       # enmascarar datos conocidos y medir RMSE
  k_vecinos: 5
  valor_minimo: 0                # 0 para lluvia; null para temperatura
  max_porcentaje_sintetico: 25   # advertir si se supera
  # Huecos que una estacion puede conservar DESPUES del complemento sin que se
  # advierta. Existe porque una estacion sin vecina admisible no se rellena y
  # sigue al M05b y al M06 en un estado muy distinto al de las demas: medido en
  # este estudio, las que tienen vecina quedan con 1,5% de huecos y las diez que
  # no la tienen con 11,8%, y una de ellas con el 31%.
  #
  # Una media mensual multianual calculada sobre el 69% de los meses no es
  # comparable con otra calculada sobre el 99%, y la isoyeta del M06 las trata
  # igual salvo que alguien lo advierta.
  max_huecos_residual_pct: 10.0
  # DECISION DEL CONSULTOR, 2026-08-07. Registrada en MANIFIESTO.yaml.
  #
  # Los huecos que ningun metodo por vecinas puede rellenar (estaciones sin
  # vecina admisible) se completan con la media del mismo mes calendario de la
  # PROPIA estacion. No introduce informacion de otra estacion ni supone un
  # regimen que no se ha verificado, y deja la serie continua.
  #
  # ADVERTENCIA: aplana la variabilidad mas que cualquier metodo por vecinas,
  # porque sustituye el hueco por el valor central de su mes. El origen queda
  # marcado aparte para que el M07 y el M05b puedan medir cuanto de la serie
  # llega por esta via.
  rellenar_residual_con_climatologia: true

# -----------------------------------------------------------------------------
# M05b - ENSO
# -----------------------------------------------------------------------------
enso:
  url_oni: "https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt"
  umbral_anomalia_c: 0.5
  temporadas_consecutivas: 5
  criterio: "consecutivo"        # consecutivo | no_consecutivo
  base_anual: "calendario"       # calendario | hidrologico
  elimina_registros: false       # invariante: ENSO nunca descarta datos

# -----------------------------------------------------------------------------
# M06 / M08 / M11 - INTERPOLACIÓN
# -----------------------------------------------------------------------------
interpolacion:
  metodo: "IDW"                  # IDW | KRIGING | TIN | SPLINE
  idw:
    potencia: 2
    radio_busqueda: null         # null = todos los puntos
  # Resolución del RASTER DE TERRENO, heredada del DEM ALOS PALSAR. No es la de
  # las isoyetas: ver el bloque 'isoyetas'.
  resolucion_raster_m: 12.5
  validacion_cruzada: true

# -----------------------------------------------------------------------------
# M06 / M08 - ISOYETAS
# -----------------------------------------------------------------------------
# DECISIÓN DEL CONSULTOR, 2026-08-08. Registrada en MANIFIESTO.yaml.
#
# Malla propia, separada de la del DEM. El área de influencia mide 146 x 115 km:
# a 12,5 m serían 107 millones de celdas y 429 MB por raster, 1,3 GB solo para
# las tres fases ENSO del M06 y unos 3,4 GB más para los ocho periodos de
# retorno del M08.
#
# El argumento de fondo no es el peso sino el soporte del dato: se interpolan 32
# estaciones separadas unos 15 km, y una malla 1200 veces más fina que ese
# espaciamiento aparenta una precisión que la información no tiene.
#
# La escala cartográfica pediría celdas finas (media milímetro a 1:10.000 son 5
# m), pero las isoyetas se entregan además como curvas VECTORIALES, que se
# dibujan bien a cualquier escala del pliego.
isoyetas:
  resolucion_m: 100.0
  # Intervalo entre curvas, en milímetros de precipitación anual. Con totales
  # entre 600 y 1400 mm, 100 mm produce del orden de ocho curvas legibles.
  intervalo_mm: 100.0
  # Solo se interpolan los totales que cubren los doce meses del año. El M05b
  # marca los incompletos: mezclarlos daría un campo con saltos que son del
  # muestreo y no del clima.
  solo_totales_completos: true
  # Mínimo de estaciones para interpolar una fase. Por debajo no hay superficie
  # que estimar, solo extrapolación entre unos pocos puntos.
  minimo_estaciones: 5
  salida_raster: "data/03_SIG/raster/isoyetas"
  salida_curvas: "data/03_SIG/vector/isoyetas"

# -----------------------------------------------------------------------------
# M07 - ANÁLISIS DE FRECUENCIA
# -----------------------------------------------------------------------------
frecuencia:
  periodos_retorno: [2.33, 5, 10, 15, 25, 50, 100, 500]
  distribuciones:
    - normal
    - lognormal2
    - lognormal3
    - gumbel_max
    - gev
    - pearson3
    - logpearson3
    - exponencial
    - weibull
    - gamma
    # Anadidas para cubrir el repertorio de Hydrognomon, que CLAUDE.md, seccion
    # 4, declara reemplazado por este analisis: el reemplazo debe ser al menos
    # tan completo como lo reemplazado.
    - ev2_max        # valor extremo tipo II (Frechet), cola pesada
    - gev_k_fijo     # GEV con la forma fijada, no ajustada
    - pareto         # Pareto generalizada, para contraste
  # Las de MINIMOS de Hydrognomon (EV1-Min, GEV-Min) no se incluyen: no
  # describen una serie de maximos. Corresponden al M19, caudales de estiaje.

  # Distribuciones que se CALCULAN para contraste pero NO pueden adoptarse por
  # seleccion automatica. La Pareto generalizada es el caso: su uso propio son
  # las series sobre umbral, no los maximos anuales, y ajustada con el umbral en
  # el minimo de la muestra su verosimilitud se dispara sin limite. Medido: gano
  # por AIC en dos estaciones con una densidad degenerada, un pico sobre el
  # borde, que habria entrado al diseno como si fuera un ajuste valido.
  excluidas_de_seleccion:
    - pareto

  # Forma de la GEV cuando se fija en lugar de ajustarse, en la convencion de
  # Hosking, que es la misma de scipy:
  #
  #     k < 0   cola PESADA hacia arriba (tipo Frechet, EV2)
  #     k = 0   Gumbel
  #     k > 0   cola ACOTADA por arriba (tipo Weibull, EV3)
  #
  # ATENCION: Hydrognomon y buena parte de la literatura griega usan el signo
  # CONTRARIO, de modo que su "k = 0,15" corresponde aqui a -0,15 y significa
  # cola pesada. Fijar el signo equivocado cambia por completo el cuantil de
  # periodo alto: medido sobre una serie de prueba, T100 pasa de 37 a mas de 200
  # mm segun el signo.
  #
  # El valor no es universal: debe proceder de un analisis regional y el
  # consultor debe justificarlo. Se adopta -0,15, cola pesada, por ser lo
  # habitual en precipitacion.
  forma_gev_fija: -0.15
  ajuste: [momentos, momentos_l, maxima_verosimilitud]
  pruebas: [ks, anderson_darling, chi2]
  criterios_seleccion: [aic, bic]
  distribucion_adoptada: null    # null = automática por criterio; o forzar una
  outliers_altos_bajos: "bulletin17c"
  # DECISION DEL CONSULTOR, 2026-08-08. Registrada en MANIFIESTO.yaml.
  #
  # Un anio aporta su maximo solo si NINGUN mes baja de este numero de dias. Es
  # un criterio estacional, y no un total anual, a proposito: un anio con 340
  # dias puede tener abril entero vacio, y abril es temporada humeda en la
  # sabana. Su maximo anual seria en realidad el maximo de un anio seco, y
  # entraria al analisis de frecuencia indistinguible de los demas.
  min_dias_mes: 25
  # Posicion grafica para el papel de probabilidad. Weibull es la insesgada de
  # la frecuencia y la habitual en hidrologia colombiana.
  posicion_grafica: "weibull"
  # Alcance: las estaciones que conservo el M05. Criterio unico en todo el
  # estudio. CONSECUENCIA a atender en el M08: la red de maximos hereda el rango
  # 1850-3378 m, de modo que las isoyetas de Pmax por periodo de retorno
  # extrapolan por debajo de esa cota igual que las del M06.
  usar_estaciones_del_m05: true

# -----------------------------------------------------------------------------
# M11 - ZONIFICACIÓN PLUVIOMÉTRICA
# -----------------------------------------------------------------------------
zonificacion_pluviometrica:
  diferencia_maxima_pct: 5.0
  considerar_gradiente_altitudinal: true
  ponderar_por_area: true

# -----------------------------------------------------------------------------
# M11c - FACTOR DE REDUCCIÓN POR ÁREA
# -----------------------------------------------------------------------------
arf:
  aplicar: "evaluar"             # evaluar | forzar_si | forzar_no
  tabla: "data/referencia/arf_invias.csv"
  verificacion_analitica: true

# -----------------------------------------------------------------------------
# M12a - CURVAS IDF
# -----------------------------------------------------------------------------
idf:
  metodologias: [invias, silva]
  coeficientes_invias: "data/referencia/idf_coef_invias.csv"
  consultar_idf_ideam: true
  antiguedad_maxima_anios: 15    # advertir si la IDF publicada es más antigua
  duraciones_min: [5, 10, 15, 20, 30, 45, 60, 90, 120, 180, 360, 720, 1440]

cambio_climatico:
  aplicar: true
  fuente: "data/referencia/cc_comunicaciones.csv"
  comunicacion: "cuarta"         # tercera | cuarta
  escenarios: [rcp45, rcp85]
  horizontes: ["2011-2040", "2041-2070", "2071-2100"]
  # Regla condicional: si el factor proyecta disminución, NO se afecta el
  # hietograma y se documenta la decisión como margen de seguridad.
  solo_si_incremento: true

# -----------------------------------------------------------------------------
# M12b - HIETOGRAMA DE DISEÑO
# -----------------------------------------------------------------------------
tormenta:
  duracion_h: 3.0
  intervalo_calculo_min: 5       # Δt; se usa también en HEC-HMS y en tlag 'hechms'
  metodo: "huff"
  huff:
    cuartil: 2
    probabilidad_excedencia: 50
    tabla: "data/referencia/huff_cuartiles.csv"
  hipotesis_p24_a_pd:
    - h1_directa                 # P3h = P24h
    - h2_idf                     # integrando la IDF sobre la duración
    - h3_factor                  # P3h = P24h * coeficiente documentado
  hipotesis_adoptada: null       # lo define el consultor tras comparar
  coeficiente_desagregacion:
    valor: null
    fuente: ""                   # obligatorio si se usa h3_factor
  advertir_si_duracion_menor_tc: true

# -----------------------------------------------------------------------------
# MODO DE ANALISIS
# -----------------------------------------------------------------------------
# DECISION DEL CONSULTOR, 2026-08-08. Registrada en MANIFIESTO.yaml.
#
# No todo estudio se resuelve con un modelo lluvia-escorrentia por subcuencas.
# En cuencas grandes como la del rio Bogota el tratamiento hidrologico es
# distinto por la magnitud de los caudales y el tamano del area intervenida: no
# se construye modelo HEC-HMS y la caracterizacion es GENERAL, sobre una sola
# unidad.
#
#   general    una sola cuenca, la que entrega el M02. Sin modelo HEC-HMS. Los
#              modulos caracterizan el conjunto y declaran expresamente que no
#              hay desagregacion por subcuencas.
#   detallado  subcuencas y tramos delimitados en HEC-HMS (M09 --importar), con
#              caracterizacion y modelo por unidad.
#
# El modo NO es una comodidad de ejecucion: cambia lo que significa cada
# resultado. Un tiempo de concentracion de una cuenca de miles de kilometros
# cuadrados no tiene el mismo sentido que el de una subcuenca de decenas, y los
# modulos deben decirlo en lugar de entregar una cifra sin contexto.
analisis:
  modo: "general"                # general | detallado
  # Capa que representa la cuenca cuando el modo es 'general'.
  cuenca_general: "data/03_SIG/vector/area_influencia.shp"
  # Justificacion que viaja al informe. Obligatoria en modo general: un estudio
  # que no explica por que no modelo la cuenca no es defendible.
  motivo_general: >-
    Cuenca de gran magnitud sobre el rio Bogota. El tratamiento hidrologico
    corresponde a caudales y area intervenida que no se resuelven con un modelo
    lluvia-escorrentia por subcuencas, de modo que la caracterizacion es general
    y no se construye modelo HEC-HMS.

# -----------------------------------------------------------------------------
# M10 - CARACTERIZACIÓN
# -----------------------------------------------------------------------------
morfometria:
  parametros:
    geometria: [area, perimetro, longitud_axial, ancho_medio,
                coef_forma, coef_compacidad]
    relieve: [cota_max, cota_min, cota_media, desnivel_altitudinal,
              curva_hipsometrica, pendiente_media_cuenca]
    drenaje: [long_cauce_principal, pendiente_media_cauce, indice_sinuosidad,
              orden_corrientes, densidad_drenaje, frecuencia_corrientes,
              longitud_total_cauces, razon_bifurcacion]
    respuesta: [tiempo_concentracion, tiempo_rezago, numero_curva,
                grupo_hidrologico, tiempo_viaje]

  relieve:
    # El DEM es el mismo que recorta el M02. No se declara aquí de nuevo para
    # que no puedan divergir.
    intervalo_hipsometrico_m: 25.0
    # Resoluciones de contraste, como múltiplo de la celda del DEM. Con celda de
    # 12,5 m dan 50, 100 y 200 m. Existen para MEDIR, y no suponer, cuánto de la
    # pendiente calculada celda a celda es relieve y cuánto es error del DEM:
    # sobre terreno real la pendiente media baja poco al agregar, mientras que
    # la que produce el ruido se desploma.
    escalas_diagnostico: [4, 8, 16]
    # Umbral de pendiente, en m/m, bajo el cual una celda de la malla más
    # gruesa se considera LLANA. Sobre ese subconjunto se mide el ruido
    # vertical del DEM, porque ahí la señal de relieve es despreciable.
    pendiente_llana_mm: 0.005
    # Por encima de esta relación entre la pendiente calculada a resolución
    # nativa y la de la malla más gruesa, se advierte: la cifra nativa no
    # describe el terreno sino el error del DEM.
    razon_maxima_nativa_gruesa: 2.0

# -----------------------------------------------------------------------------
# M02b - RED DE DRENAJE TOPOLÓGICA
#
# La cartografía del IGAC parte los ríos anchos en dos representaciones: donde
# caben dos orillas a 1:100.000 se dibuja un POLÍGONO, y aguas arriba una
# POLILÍNEA. Medido sobre el Río Bogotá, la polilínea cubre 85,4 km del norte y
# el polígono el resto hacia el sur; se tocan en Y = 2.107.000. Trazar el cauce
# principal sobre la capa de líneas devolvería 85 km de los más de 300 reales,
# y lo haría sin ninguna señal de error.
#
# Este módulo repone el eje que falta, empalma las dos representaciones,
# resuelve la adyacencia y calcula el orden de Strahler. Su producto es la
# única red con topología del estudio, y la consumen el M10 y el M16.
# -----------------------------------------------------------------------------
red_topologica:
  # Resolución de rasterización para derivar el eje. El Río Bogotá tiene 55,8 m
  # de ancho medio: a 12,5 m quedan cuatro o cinco celdas de través, suficientes
  # para un esqueleto continuo. Con celdas más gruesas el polígono se fragmenta
  # y el eje sale cortado.
  resolucion_eje_m: 12.5
  # El adelgazamiento deja espolones de una o dos celdas en los ensanchamientos
  # del cauce. No son cauce y ensucian el conteo de corrientes de orden 1.
  longitud_minima_tramo_m: 30.0
  salida_eje: "data/03_SIG/vector/eje_drenaje_doble.shp"
  salida_red: "data/03_SIG/vector/red_topologica.shp"

tiempo_concentracion:
  tabla_aplicabilidad: "data/referencia/tc_aplicabilidad.csv"
  filtrar_por_tipo_cuenca: true
  valor_adoptado: "mediana"      # mediana del subconjunto aplicable
  min_formulas_aplicables: 5     # por debajo: advertir, no adoptar automáticamente
  cv_maximo_admisible: 0.60      # por encima: advertir
  reportar_sensibilidad_caudal: true

tiempo_rezago:
  criterio: "scs"                # scs = 0.6*Tc | hechms = Δt/2 + 0.6*Tc
  # Δt es el intervalo de cálculo (tormenta.intervalo_calculo_min),
  # NO la duración total de la tormenta.
  validar_coherencia_con_transform: true

numero_curva:
  condicion_humedad: "II"        # I | II | III
  tabla_cn: "data/referencia/cn_scs.csv"
  tabla_grupo_hidrologico: "data/referencia/hsg_textura.csv"
  homologacion_suelos: "data/00_insumos_usuario/homologacion/suelos.csv"
  homologacion_cobertura: "data/00_insumos_usuario/homologacion/cobertura.csv"
  advertir_escala_incompatible: true
  # Precedencia de insumos. Si el consultor aporta suelos o cobertura propios en
  # data/00_insumos_usuario, ESOS mandan. Si no, se usan las capas de base
  # declaradas en referencia_nacional, y el modulo lo declara en su reporte: un
  # numero de curva derivado de una capa global no vale lo mismo que uno
  # derivado de un estudio de suelos del proyecto, y el informe debe poder
  # distinguirlos.
  usar_base_si_no_aportado: true
  # Paso de la malla con que se muestrea el raster de grupo hidrologico. El
  # HYSOGs tiene celda de unos 231 m: muestrear mas fino no aporta detalle y
  # multiplica el coste.
  muestreo_suelos_m: 250.0
  # DECISION CON MARGEN. Los grupos duales (A/D, B/D, C/D) describen un suelo
  # cuyo grupo depende de si esta drenado. 'no_drenado' los asigna al grupo D,
  # el mas desfavorable y el del lado seguro para el diseno; 'drenado' los
  # asigna a su grupo drenado. La eleccion cambia el numero de curva en decenas
  # de unidades sobre la fraccion del area afectada, y debe declararse en el
  # informe. Si el estudio dispone de informacion de drenaje, esa manda.
  grupos_duales: "no_drenado"   # no_drenado | drenado

# -----------------------------------------------------------------------------
# M13 / M14 - MODELO HEC-HMS
# -----------------------------------------------------------------------------
hec_hms:
  transform: "scs_uh"            # scs_uh | clark | snyder | modclark
  loss: "scs_cn"
  baseflow: "recession"
  transito:
    metodos: [muskingum, muskingum_cunge]
    metodo_adoptado: "muskingum_cunge"
    muskingum:
      celeridad_ms: null
    muskingum_cunge:
      forma_seccion: "trapezoidal"
      n_manning: null
  control:
    intervalo_min: 5             # debe coincidir con tormenta.intervalo_calculo_min

  # --- M09: intercambio con el paso manual -----------------------------------
  # CLAUDE.md, seccion 4: la delimitacion asistida de HEC-HMS es el UNICO paso
  # con intervencion manual obligatoria. El M09 esta a caballo de el: prepara lo
  # que el programa necesita y despues lee lo que produjo.
  intercambio:
    insumos: "data/04_modelos/hec_hms/insumos"
    salida: "data/04_modelos/hec_hms/salida"
    # Nombres que el consultor debe dar a lo que exporte desde HEC-HMS.
    subcuencas: "subcuencas.shp"
    corrientes: "corrientes.shp"
    # Fraccion MINIMA que la cuenca delimitada debe representar de la
    # preliminar. No es una tolerancia de igualdad: para el escenario 1 la
    # preliminar es la subzona entera, que sobredimensiona el area varias veces
    # y solo sirve de COTA SUPERIOR.
    #
    # El control por abajo es el que atrapa el fallo conocido: con el DEM de
    # radar sin reacondicionar, el analisis de terreno del M02 llego a producir
    # 6,59 km2 sobre una subzona de 5.926, una fraccion del 0,1%. En terreno
    # plano el ruido vertical gobierna las direcciones de flujo y el resultado
    # es una cuenca verosimil y equivocada. Ese riesgo alcanza igual a HEC-HMS,
    # porque el DEM se entrega sin reacondicionar por decision declarada.
    fraccion_minima_pct: 5.0
    # Area minima de subcuenca. Por debajo suele tratarse de un artefacto del
    # trazado y no de una unidad hidrologica.
    area_minima_subcuenca_km2: 0.5

calibracion:
  activar_si_hay_series: true
  fuente_caudales: [socrata, usuario]
  metricas: [nash_sutcliffe, rmse, pbias, r2]

# -----------------------------------------------------------------------------
# M18 / M19 - BALANCE HÍDRICO
# -----------------------------------------------------------------------------
balance_hidrico:
  activar: true
  metodo: "budyko"
  evapotranspiracion:
    metodo: "turc"               # turc | thornthwaite | penman_monteith | cenicafe
  infiltracion:
    metodo: "scs"
  contrastar_con_ena: true
  ena_anio: 2022

caudal_ambiental:
  metodos: [q95, qirh]
  umbral_irh: 0.7
  cdc_si_irh_menor: 75           # porcentaje de la CDC
  cdc_si_irh_mayor: 85
  metodo_adoptado: "qirh"

# -----------------------------------------------------------------------------
# GRÁFICAS DE LOS MÓDULOS DE ANÁLISIS
# -----------------------------------------------------------------------------
# Punto único de estilo, consumido por src/graficos.py. CLAUDE.md no asignaba la
# generación de gráficas a ningún módulo: el bloque 'informe' define cómo el M15
# las numera y rotula, y 'cartografia' corresponde al M16, que son mapas. Cada
# módulo de análisis emite las suyas y el M15 las selecciona y coloca.
#
# Si cada módulo fijara su propio aspecto, las figuras del informe saldrían con
# tipografías y colores distintos, y esa inconsistencia se nota en un entregable.
graficos:
  directorio: "data/05_resultados/graficos"
  # El vectorial sirve al informe, que puede escalarlo sin pérdida; el mapa de
  # bits sirve a la revisión rápida y a los visores que no interpretan SVG.
  formatos: [png, svg]
  dpi: 300                       # igual que cartografia, para no mezclar calidades
  ancho_cm: 16.0                 # ancho útil de página con márgenes de informe
  alto_cm: 10.0
  tamano_fuente: 9.0
  tipografia: "DejaVu Sans"      # si falta, matplotlib recurre a su propia sans
  rejilla: true
  # Paleta de identificación de series. El gris de rejillas y contornos no sale
  # de aquí: no identifica ninguna serie.
  paleta: ["#1f4e79", "#c00000", "#2e7d32", "#e07b00", "#6a1b9a", "#00838f"]
  # Rampa para categorías ORDINALES (umbrales, periodos de retorno, rangos de
  # altitud). La paleta de arriba es categórica y no tiene orden: aplicada a
  # categorías ordenadas hace que los dos extremos salgan en tonos parecidos.
  rampa: "Blues"

  # DECISION DEL CONSULTOR, 2026-08-08. Registrada en MANIFIESTO.yaml.
  #
  # Una figura por ESTACION, ademas de la rejilla de resumen. Una rejilla de
  # treinta y dos paneles sirve para revisar de un vistazo, pero no se puede
  # insertar en el informe: cada panel queda del tamano de una estampilla. Las
  # rutinas heredadas (EDA.py, Impute.py) escribian una figura por estacion en un
  # subdirectorio Graph, y se recupera ese criterio.
  #
  # Se agrupan por TEMA y no por modulo: quien redacta el capitulo de
  # consistencia busca todas las curvas de doble masa juntas, no las del M05
  # mezcladas por tipo.
  #
  # El directorio se llama 'individuales' y no 'estaciones' porque no todas lo
  # son: las isoyetas se emiten una por fase ENSO y una por periodo de retorno.
  figuras_individuales: true
  directorio_individuales: "data/05_resultados/graficos/individuales"
  # Ancho de la figura individual. Menor que el de las agregadas: una figura
  # suelta ocupa media pagina, no el ancho util completo.
  ancho_individual_cm: 11.0
  alto_individual_cm: 8.0
  # Nombre presentable de cada variable en los rótulos. Las claves son las de
  # ideam.descarga.series_por_variable, que son identificadores sin tilde: usarlas
  # tal cual en una figura del informe se nota. Una variable no listada aquí
  # aparece con su clave, sin fallar.
  # Sistema en que se rotulan las figuras geográficas. El nulo significa "el
  # mismo en que el consultor ingresó el punto de descarga", que es lo que hace
  # reconocibles las cifras: el informe de referencia rotula sus mapas en
  # coordenadas MAGNA Ciudad Bogotá, no en latitud y longitud.
  #
  # DEBE ser un sistema PROYECTADO. Las figuras se dibujan a escala equivalente
  # y en grados eso deforma las distancias con la latitud.
  crs_figuras: null
  nombres_variable:
    precipitacion: "Precipitación"
    caudal: "Caudal"
    temperatura: "Temperatura"
    evaporacion: "Evaporación"

# -----------------------------------------------------------------------------
# M15 / M16 / M17 - SALIDAS
# -----------------------------------------------------------------------------
informe:
  plantilla: "templates/informe.dotx"
  formato_figuras: "Ilustración"
  formato_graficos: "Gráfico"
  formato_tablas: "Tabla"
  numeracion_por_capitulo: true

cartografia:
  plantillas_qpt: "templates/mapas"
  escalas: [1000, 2000, 5000, 10000, 25000]
  formato_salida: [pdf, png]
  dpi: 300

anexos:
  estructura: "config/anexos.yaml"
  verificar_completitud: true
  calcular_hash: true

# -----------------------------------------------------------------------------
# EJECUCIÓN
# -----------------------------------------------------------------------------
ejecucion:
  nivel_log: "INFO"
  detener_en_advertencia: false
  guardar_intermedios: true
  semilla_aleatoria: 42
