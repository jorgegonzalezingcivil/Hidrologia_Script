# =============================================================================
# CONFIGURACIÓN DEL ESTUDIO HIDROLÓGICO
# -----------------------------------------------------------------------------
# Único punto de edición de parámetros. Ningún módulo debe contener valores
# embebidos. Toda decisión con margen técnico queda registrada aquí.
# =============================================================================

proyecto:
  nombre: "Estudio Hidrológico - PLANTILLA"
  contratante: ""
  consultor: ""
  anio_estudio: 2026            # controla el filtro de estaciones suspendidas
  responsable: ""

# -----------------------------------------------------------------------------
# ENTORNOS DE EJECUCIÓN
# Se adopta el esquema de doble entorno (ver CLAUDE.md, sección 3).
# -----------------------------------------------------------------------------
entornos:
  qgis:
    # DESVIACIÓN documentada respecto de CLAUDE.md, sección 3, que adopta el
    # esquema LTR. Se declara la versión 4.2.0 instalada en la máquina, que no
    # es LTR. Consecuencia asumida: los módulos SIG quedan expuestos a cambios
    # de API en actualizaciones menores de la serie 4.x. La decisión y su
    # justificación están registradas en MANIFIESTO.yaml.
    version: "4.2.0"
    es_ltr: false
    python: "C:/Program Files/QGIS 4.2.0/bin/python-qgis.bat"
    prefix_path: "C:/Program Files/QGIS 4.2.0/apps/qgis"
  venv:
    python: ".venv/Scripts/python.exe"

software:
  hec_hms:
    ruta: "C:/Program Files/HEC/HEC-HMS/4.13"
    version: "4.13"

# -----------------------------------------------------------------------------
# SISTEMA DE REFERENCIA
# -----------------------------------------------------------------------------
crs:
  calculo: "EPSG:9377"           # MAGNA-SIRGAS / Origen Nacional CTM12
  geografico: "EPSG:4326"        # solo consulta a servicios externos
  reproyeccion_explicita: true   # nunca reproyectar de forma implícita

# -----------------------------------------------------------------------------
# M00c - VERIFICACIÓN DE INSUMOS DEL USUARIO
# Las rutas internas del manifiesto se resuelven contra el directorio del propio
# manifiesto, no contra la raíz del repositorio.
# -----------------------------------------------------------------------------
insumos_usuario:
  manifiesto: "data/00_insumos_usuario/MANIFIESTO.yaml"
  generar_homologacion: true     # crea la tabla con los valores únicos del insumo
  delimitador_csv: ";"           # separador de las tablas de homologación
  tabla_escala_area: "data/referencia/escala_area_suelos.csv"
  cuenca_referencia: "data/03_SIG/vector/cuenca_preliminar.shp"
  max_valores_homologacion: 500  # por encima, la tabla deja de ser diligenciable

# -----------------------------------------------------------------------------
# M00b - PROYECTO QGIS
# El árbol de grupos y capas se declara aparte, en el archivo indicado en
# 'declaracion'. El .qgz se regenera por completo en cada ejecución; la
# simbología no vive dentro del proyecto sino en los .qml del directorio
# 'estilos', de modo que los ajustes del consultor sobreviven a la regeneración.
# -----------------------------------------------------------------------------
proyecto_qgis:
  declaracion: "config/proyecto_qgis.yaml"
  archivo: "data/03_SIG/proyecto/estudio_hidrologico.qgz"
  estilos: "data/03_SIG/proyecto/estilos"
  titulo: "Estudio hidrológico"
  escribir_estilo_inicial: true  # crea el .qml por defecto si aún no existe
  detener_si_falta_capa: false   # true: una capa declarada ausente detiene el módulo

# -----------------------------------------------------------------------------
# M01 - PUNTO DE DESCARGA Y SUBZONA HIDROGRÁFICA
# -----------------------------------------------------------------------------
# El punto se declara en el sistema de referencia en que el consultor lo tenga,
# no en uno fijo. 'crs' indica en qué sistema están expresados 'x' e 'y', y el
# M01 reproyecta de forma explícita al CRS de cálculo (CLAUDE.md, sección 5).
#
#   CRS proyectado (EPSG:3116, 9377, 21818...):  x = Este,     y = Norte
#   CRS geográfico (EPSG:4326, 4686):            x = longitud, y = latitud
#
# El orden x, y es siempre el mismo. En un CRS geográfico eso significa que la
# longitud va primero, que es el error de transcripción más común: el M01
# verifica que el punto caiga dentro de Colombia y se detiene si no.
punto_descarga:
  nombre: "Descarga"
  crs: "EPSG:3116"               # MAGNA-SIRGAS / Colombia Bogota zone
  x: 1003512.4                   # Este
  y: 1025917.54                  # Norte

# -----------------------------------------------------------------------------
# CAPAS NACIONALES DE REFERENCIA
# -----------------------------------------------------------------------------
# El drenaje 1:100.000 del IGAC ocupa 645 MB entre sus dos capas. Versionarlo
# haría inmanejable el repositorio y convertiría el entregable en algo que no se
# puede enviar. Vive fuera del árbol del proyecto, en una sola copia por máquina
# compartida por todos los estudios, y el repositorio versiona únicamente el
# recorte al área de influencia que produce el M02.
#
# 'directorio' debe ser una ruta absoluta fuera del repositorio. El esquema lo
# verifica y detiene la carga si apunta dentro.
referencia_nacional:
  directorio: "C:/SIG_Referencia_Nacional"
  drenaje_sencillo: "Drenaje_Sencillo.shp"
  drenaje_doble: "Drenaje_Doble.shp"
  escala: "1:100000"
  fuente: "IGAC"
  fecha: "2021-07-29"
  # Adaptador de nombres de campo. Ambas capas comparten el del nombre.
  campos:
    nombre: "NOMBRE_GEO"
  # Tolerancia de conexión entre un afluente y el cauce receptor. Medido sobre
  # la zona del estudio, el 93% de las desembocaduras que alcanzan el drenaje
  # doble lo tocan exactamente; unos pocos metros cubren el resto.
  tolerancia_conexion_m: 5.0
  # Proporción máxima de nodos que pueden incumplir la convención de sentido de
  # digitalización antes de que el módulo se detenga. Medido: 3,17% en la
  # ventana de 25 km alrededor del punto.
  max_incumplimiento_sentido_pct: 10.0
  # Productos versionables que deja el recorte, dentro del repositorio.
  salida_recorte_sencillo: "data/referencia/sig/drenaje_sencillo_area.shp"
  salida_recorte_doble: "data/referencia/sig/drenaje_doble_area.shp"
  salida_grafo: "data/02_procesado/red_drenaje_grafo.json"

subzonas_hidrograficas:
  archivo: "data/referencia/sig/Zonificacion_hidrografica_2013.shp"
  tolerancia_m: 500.0            # distancia máxima admitida si el punto cae fuera
  # Adaptador de nombres de campo. La capa la publica el IDEAM y sus nombres
  # pueden cambiar entre versiones; se declaran aquí y no en el código.
  campos:
    codigo_szh: "COD_SZH"
    nombre_szh: "NOM_SZH"
    codigo_zh: "COD_ZH"
    nombre_zh: "NOM_ZH"
    codigo_ah: "COD_AH"
    nombre_ah: "NOM_AH"
  salida_punto: "data/03_SIG/vector/punto_descarga.shp"
  salida_subzona: "data/03_SIG/vector/subzona_intersectada.shp"

# -----------------------------------------------------------------------------
# M02 - MODELO DIGITAL DE TERRENO
# -----------------------------------------------------------------------------
dem:
  fuente: "ALOS_PALSAR_RTC"
  resolucion_m: 12.5
  earthdata:
    netrc: true                  # credenciales en un archivo netrc, nunca aquí
    # Ubicación del archivo de credenciales. null usa ~/.netrc, que es lo
    # estándar y lo que leen también curl, wget y GDAL.
    #
    # Se admite declarar otra ruta para compartir un solo archivo entre varios
    # estudios o entre varios equipos, pero DEBE quedar fuera del repositorio:
    # la carpeta del proyecto se comprime y se entrega como anexo, y ni el
    # .gitignore ni ninguna protección de git alcanzan a un .zip o a una copia.
    # El M02 se detiene si la ruta declarada cae dentro del repositorio.
    ruta_netrc: null
  area_influencia:
    metodo: "envolvente"         # envolvente del polígono delimitado
    buffer_km: 1.0

  # --- Búsqueda y descarga de escenas ---------------------------------------
  # ALOS PALSAR acumula muchas adquisiciones sobre la misma huella espacial. El
  # modelo de elevación que acompaña a cada producto RTC no cambia entre
  # pasadas, de modo que se deduplica por huella y luego se elige el
  # subconjunto mínimo que cubre el área. Sin esa reducción, la subzona del Río
  # Bogotá exigiría descargar 217 escenas y 62 GB en lugar de una fracción.
  asf:
    nivel: "RTC_HI_RES"          # ALOS_PALSAR_RTC_HIGH_RES; trae el DEM a 12,5 m
    plataforma: "ALOS"
    # Ventana de adquisición de las trayectorias. null en ambas usa todo el
    # catálogo. Restringirla reduce la descarga, pero puede dejar el área sin
    # cubrir: el módulo reporta la cobertura alcanzada y advierte si baja de
    # cobertura_minima_pct.
    fecha_inicio: "2011-02-10"
    fecha_fin: "2011-03-22"
    buffer_busqueda_km: 2.0      # holgura sobre la subzona del M01
    max_escenas: 40              # tope de seguridad; por encima se detiene
    max_volumen_gb: 15.0         # tope de descarga; por encima se detiene
    verificar_md5: true
    reintentos: 3
    patron_dem_en_zip: ".dem.tif"
    cobertura_minima_pct: 99.0   # por debajo se advierte de huecos sin cubrir

  # --- Delimitación preliminar ----------------------------------------------
  # El método NO es fijo: se elige según dónde caiga el punto de descarga.
  # Los dos enfoques tienen dominios complementarios y medidos en este proyecto.
  #
  #   Escenario 1, punto sobre drenaje doble. Ríos anchos, en valles amplios y
  #     planos. El DEM de radar falla ahí: sobre el Río Bogotá, con 3 m de
  #     desnivel real en 20 km, encaminó el flujo por el ruido y produjo una
  #     cuenca de 6,59 km2 en lugar de la real. Método: cartográfico.
  #
  #   Escenario 2, punto sobre drenaje sencillo o su aferencia. Recorrido
  #     directo sobre la red de polilíneas, sin eje ni empalme. Método:
  #     cartográfico.
  #
  #   Escenario 3, punto sin intersección con ninguna capa. Si el cauce no está
  #     cartografiado a 1:100.000 es pequeño, y una cuenca pequeña suele estar
  #     en ladera con pendiente marcada. Ahí el DEM sí es fiable, porque el
  #     modo de fallo anterior exige terreno plano. Método: terreno.
  delimitacion:
    metodo: "automatico"         # automatico | cartografico | terreno
    umbral_drenaje_doble_m: 50.0   # distancia máxima para declarar escenario 1
    umbral_drenaje_sencillo_m: 150.0  # ídem para escenario 2
    tolerancia_empalme_eje_m: 200.0   # unión del eje con el drenaje sencillo
    # Buffer sobre la red trazada, por escenario. Es la holgura que absorbe la
    # conectividad imperfecta de la cartografía: medido sobre la subzona, el
    # 85,1% de los tramos toca a su receptor y el 15% restante está a cientos
    # de metros, no a unos pocos. No hay tolerancia que lo arregle, de modo que
    # se compensa con buffer. Un exceso solo cuesta disco; un defecto trunca la
    # cuenca y contamina todo lo que viene después.
    buffer_red_km:
      escenario_1: 8.0           # el que más holgura necesita
      escenario_2: 5.0
    # Solo aplican al escenario 3, que sí analiza terreno.
    umbral_celdas_cauce: 1000    # celdas acumuladas para definir cauce
    radio_ajuste_m: 250.0        # búsqueda del cauce alrededor del punto
    detener_si_toca_borde: true  # una cuenca truncada no es utilizable
    salida_dem: "data/03_SIG/raster/dem_recortado.tif"
    salida_cuenca: "data/03_SIG/vector/cuenca_preliminar.shp"
    salida_envolvente: "data/03_SIG/vector/envolvente.shp"
    salida_area_influencia: "data/03_SIG/vector/area_influencia.shp"

# -----------------------------------------------------------------------------
# M03 - SELECCIÓN DE ESTACIONES
# -----------------------------------------------------------------------------
estaciones:
  buffer_adicional_km: 1.0       # holgura sobre el área de influencia del M02
  catalogo: "data/referencia/sig/CNE_IDEAM_Final.shp"
  fecha_catalogo: "2024-01-01"   # descarga del CNE, para trazabilidad
  # Adaptador de nombres de campo del Catálogo Nacional de Estaciones. Los
  # campos d_* traen la descripción legible de los códigos.
  campos:
    codigo: "CODIGO"
    nombre: "nombre"
    categoria: "CATEGORIA"
    categoria_desc: "d_CATEGORI"
    estado: "d_ESTADO"
    entidad: "ENTIDAD"
    altitud: "altitud"
    latitud: "latitud"
    longitud: "longitud"
    corriente: "d_CORRIENT"
    departamento: "d_DEPARTAM"
    municipio: "d_MUNICIPI"
    subzona: "d_SUBZONA_"
    fecha_instalacion: "FECHA_INST"
    fecha_suspension: "FECHA_SUSP"
  salida_seleccionadas: "data/03_SIG/vector/estaciones_seleccionadas.shp"
  salida_descartadas: "data/03_SIG/vector/estaciones_descartadas.shp"
  inventario_csv: "data/02_procesado/estaciones/inventario_estaciones.csv"
  categorias_por_variable:
    precipitacion: [AM, CO, CP, PG, PM, SP, SS]
    temperatura:   [AM, CO, CP, SP, SS]
    evaporacion:   [AM, CO, CP]
    caudal:        [LG, LM, RM]

# -----------------------------------------------------------------------------
# M04 - INGESTA IDEAM
# -----------------------------------------------------------------------------
ideam:
  fuente_primaria: "socrata"     # socrata | dhime_zip
  socrata:
    dominio: "www.datos.gov.co"
    token: ""                    # token de aplicación (gratuito). Vacío = sin token
    limite_pagina: 50000
    dataset_catalogo: "hp9r-jxuu"
  dhime_zip:
    patron_archivo: "*.csv"      # se descubre por patrón, nunca por nombre fijo
    perfiles: "config/perfiles_ideam.yaml"
  deduplicacion:
    clave: [CodigoEstacion, Parametro, Fecha]
    precedencia_aprobacion: [Definitivo, Preliminar]
    reportar_conflictos: true
  nivel_aprobacion:
    usar_como_filtro: false      # marca informativa, no criterio de descarte
  escala_temporal:
    deteccion: "cruzada"         # mapeo de Parametro + espaciamiento modal
    detener_si_discrepa: true
  agregacion_diaria_a_mensual:
    max_dias_faltantes: 3        # por encima de este valor el mes se marca nulo
  precipitacion_mensual:
    fuente_primaria: "mensual_ideam"
    completar_con_agregacion_diaria: true
    reporte_discrepancias: true

# -----------------------------------------------------------------------------
# M04b - SENSIBILIDAD DE LONGITUD DE SERIES
# -----------------------------------------------------------------------------
sensibilidad_series:
  umbrales_anios: [10, 15, 20, 25, 30]
  ventanas: [[1980, null], [1990, null], [2000, null]]   # null = año del estudio
  anios_max_suspension: 5
  umbral_adoptado_anios: null    # lo define el consultor tras revisar la matriz
  ventana_adoptada: null

# -----------------------------------------------------------------------------
# M05 - PROCESAMIENTO DE PRECIPITACIÓN MENSUAL
# Orden fijo: anómalos -> consistencia -> complemento
# -----------------------------------------------------------------------------
anomalos:
  metodo: "IQR"                  # IQR | ER | ZSCORE
  q1: 0.25                       # valores normativos, no calibrados manualmente
  q3: 0.75
  k_sigma: 3.0
  zscore_umbral: 3.0
  tratamiento: "marcar"          # marcar | drop | cap | imputar
  aplicar_a_serie_maximos: false # NUNCA true: truncaría el dato de diseño

consistencia:
  metodos: [doble_masa, correlacion, pettitt, snht, mann_kendall, rachas]
  correlacion_minima: 0.80
  n_estaciones_vecinas: 5
  descartar_bajo_umbral: true

complemento:
  metodos_evaluados: [regresion_vecinas, razon_normal, idw, knn, mice]
  metodo_adoptado: null          # lo define el consultor
  validacion_cruzada: true       # enmascarar datos conocidos y medir RMSE
  k_vecinos: 5
  valor_minimo: 0                # 0 para lluvia; null para temperatura
  max_porcentaje_sintetico: 25   # advertir si se supera

# -----------------------------------------------------------------------------
# M05b - ENSO
# -----------------------------------------------------------------------------
enso:
  url_oni: "https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt"
  umbral_anomalia_c: 0.5
  temporadas_consecutivas: 5
  criterio: "consecutivo"        # consecutivo | no_consecutivo
  base_anual: "calendario"       # calendario | hidrologico
  elimina_registros: false       # invariante: ENSO nunca descarta datos

# -----------------------------------------------------------------------------
# M06 / M08 / M11 - INTERPOLACIÓN
# -----------------------------------------------------------------------------
interpolacion:
  metodo: "IDW"                  # IDW | KRIGING | TIN | SPLINE
  idw:
    potencia: 2
    radio_busqueda: null         # null = todos los puntos
  resolucion_raster_m: 12.5
  validacion_cruzada: true

# -----------------------------------------------------------------------------
# M07 - ANÁLISIS DE FRECUENCIA
# -----------------------------------------------------------------------------
frecuencia:
  periodos_retorno: [2.33, 5, 10, 15, 25, 50, 100, 500]
  distribuciones:
    - normal
    - lognormal2
    - lognormal3
    - gumbel_max
    - gev
    - pearson3
    - logpearson3
    - exponencial
    - weibull
    - gamma
  ajuste: [momentos, momentos_l, maxima_verosimilitud]
  pruebas: [ks, anderson_darling, chi2]
  criterios_seleccion: [aic, bic]
  distribucion_adoptada: null    # null = automática por criterio; o forzar una
  outliers_altos_bajos: "bulletin17c"

# -----------------------------------------------------------------------------
# M11 - ZONIFICACIÓN PLUVIOMÉTRICA
# -----------------------------------------------------------------------------
zonificacion_pluviometrica:
  diferencia_maxima_pct: 5.0
  considerar_gradiente_altitudinal: true
  ponderar_por_area: true

# -----------------------------------------------------------------------------
# M11c - FACTOR DE REDUCCIÓN POR ÁREA
# -----------------------------------------------------------------------------
arf:
  aplicar: "evaluar"             # evaluar | forzar_si | forzar_no
  tabla: "data/referencia/arf_invias.csv"
  verificacion_analitica: true

# -----------------------------------------------------------------------------
# M12a - CURVAS IDF
# -----------------------------------------------------------------------------
idf:
  metodologias: [invias, silva]
  coeficientes_invias: "data/referencia/idf_coef_invias.csv"
  consultar_idf_ideam: true
  antiguedad_maxima_anios: 15    # advertir si la IDF publicada es más antigua
  duraciones_min: [5, 10, 15, 20, 30, 45, 60, 90, 120, 180, 360, 720, 1440]

cambio_climatico:
  aplicar: true
  fuente: "data/referencia/cc_comunicaciones.csv"
  comunicacion: "cuarta"         # tercera | cuarta
  escenarios: [rcp45, rcp85]
  horizontes: ["2011-2040", "2041-2070", "2071-2100"]
  # Regla condicional: si el factor proyecta disminución, NO se afecta el
  # hietograma y se documenta la decisión como margen de seguridad.
  solo_si_incremento: true

# -----------------------------------------------------------------------------
# M12b - HIETOGRAMA DE DISEÑO
# -----------------------------------------------------------------------------
tormenta:
  duracion_h: 3.0
  intervalo_calculo_min: 5       # Δt; se usa también en HEC-HMS y en tlag 'hechms'
  metodo: "huff"
  huff:
    cuartil: 2
    probabilidad_excedencia: 50
    tabla: "data/referencia/huff_cuartiles.csv"
  hipotesis_p24_a_pd:
    - h1_directa                 # P3h = P24h
    - h2_idf                     # integrando la IDF sobre la duración
    - h3_factor                  # P3h = P24h * coeficiente documentado
  hipotesis_adoptada: null       # lo define el consultor tras comparar
  coeficiente_desagregacion:
    valor: null
    fuente: ""                   # obligatorio si se usa h3_factor
  advertir_si_duracion_menor_tc: true

# -----------------------------------------------------------------------------
# M10 - CARACTERIZACIÓN
# -----------------------------------------------------------------------------
morfometria:
  parametros:
    geometria: [area, perimetro, longitud_axial, ancho_medio,
                coef_forma, coef_compacidad]
    relieve: [cota_max, cota_min, cota_media, desnivel_altitudinal,
              curva_hipsometrica, pendiente_media_cuenca]
    drenaje: [long_cauce_principal, pendiente_media_cauce, indice_sinuosidad,
              orden_corrientes, densidad_drenaje, frecuencia_corrientes,
              longitud_total_cauces, razon_bifurcacion]
    respuesta: [tiempo_concentracion, tiempo_rezago, numero_curva,
                grupo_hidrologico, tiempo_viaje]

tiempo_concentracion:
  tabla_aplicabilidad: "data/referencia/tc_aplicabilidad.csv"
  filtrar_por_tipo_cuenca: true
  valor_adoptado: "mediana"      # mediana del subconjunto aplicable
  min_formulas_aplicables: 5     # por debajo: advertir, no adoptar automáticamente
  cv_maximo_admisible: 0.60      # por encima: advertir
  reportar_sensibilidad_caudal: true

tiempo_rezago:
  criterio: "scs"                # scs = 0.6*Tc | hechms = Δt/2 + 0.6*Tc
  # Δt es el intervalo de cálculo (tormenta.intervalo_calculo_min),
  # NO la duración total de la tormenta.
  validar_coherencia_con_transform: true

numero_curva:
  condicion_humedad: "II"        # I | II | III
  tabla_cn: "data/referencia/cn_scs.csv"
  tabla_grupo_hidrologico: "data/referencia/hsg_textura.csv"
  homologacion_suelos: "data/00_insumos_usuario/homologacion/suelos.csv"
  homologacion_cobertura: "data/00_insumos_usuario/homologacion/cobertura.csv"
  advertir_escala_incompatible: true

# -----------------------------------------------------------------------------
# M13 / M14 - MODELO HEC-HMS
# -----------------------------------------------------------------------------
hec_hms:
  transform: "scs_uh"            # scs_uh | clark | snyder | modclark
  loss: "scs_cn"
  baseflow: "recession"
  transito:
    metodos: [muskingum, muskingum_cunge]
    metodo_adoptado: "muskingum_cunge"
    muskingum:
      celeridad_ms: null
    muskingum_cunge:
      forma_seccion: "trapezoidal"
      n_manning: null
  control:
    intervalo_min: 5             # debe coincidir con tormenta.intervalo_calculo_min

calibracion:
  activar_si_hay_series: true
  fuente_caudales: [socrata, usuario]
  metricas: [nash_sutcliffe, rmse, pbias, r2]

# -----------------------------------------------------------------------------
# M18 / M19 - BALANCE HÍDRICO
# -----------------------------------------------------------------------------
balance_hidrico:
  activar: true
  metodo: "budyko"
  evapotranspiracion:
    metodo: "turc"               # turc | thornthwaite | penman_monteith | cenicafe
  infiltracion:
    metodo: "scs"
  contrastar_con_ena: true
  ena_anio: 2022

caudal_ambiental:
  metodos: [q95, qirh]
  umbral_irh: 0.7
  cdc_si_irh_menor: 75           # porcentaje de la CDC
  cdc_si_irh_mayor: 85
  metodo_adoptado: "qirh"

# -----------------------------------------------------------------------------
# M15 / M16 / M17 - SALIDAS
# -----------------------------------------------------------------------------
informe:
  plantilla: "templates/informe.dotx"
