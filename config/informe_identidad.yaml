# =============================================================================
# IDENTIDAD DEL ESTUDIO EN EL INFORME  (insumo del M15)
# -----------------------------------------------------------------------------
# QUE PROBLEMA RESUELVE. La plantilla se derivo de un informe del consultor ya
# entregado (CLAUDE.md, seccion 10) y conserva su redaccion. Esa redaccion
# nombra al estudio del que salio, y arrastra sus cifras: el informe de este
# estudio llego a decir "un IRH de 0.87 para la Quebrada No. 2, lo que las
# clasifica como Muy Alta" cuando la cadena habia calculado 0,70, y a citar un
# caudal ambiental de 23,04 l/s cuando este estudio da 551 l/s.
#
# NO LO DETECTABA NADA. Un parrafo asi no es una instruccion en verde, no es
# una tabla sin llenar y no es una figura que falte: es prosa correcta, bien
# escrita, sobre otro proyecto. El M15 la copiaba intacta y el informe salia
# afirmando resultados ajenos con toda naturalidad. Es el peor modo de fallo
# posible en un entregable, porque no se ve.
#
# COMO SE COMPRUEBA. Aqui se declaran los terminos que identifican al informe
# de referencia. El M15 busca cada uno en la prosa del documento y reporta el
# parrafo que lo contenga, SALVO que el estudio lo declare como propio en su
# configuracion: un termino puede coincidir legitimamente, y de hecho ocurre,
# porque el contratante de este estudio es el mismo del de referencia.
#
# NO ES UN FILTRO NI UNA CORRECCION AUTOMATICA. Reescribir la frase exigiria
# saber que dice el estudio nuevo, y eso no se deduce. Se reporta, con el
# parrafo entero, y el consultor decide.
# =============================================================================

version: 1

# Claves de la configuracion del estudio cuyo valor es un identificador PROPIO.
# Un termino ajeno que coincida con uno de estos no se reporta.
propios:
  - proyecto.nombre
  - proyecto.contratante
  - proyecto.consultor
  - proyecto.corriente
  - proyecto.municipio
  - proyecto.departamento
  - proyecto.autoridad_ambiental

# Terminos del informe de referencia. 'que_es' explica de que se trata, para
# que el hallazgo diga por que se reporta y no solo que aparecio.
ajenos:
  - termino: "Quebrada No. 2"
    que_es: "la corriente del estudio de referencia"
  - termino: "Villavicencio"
    que_es: "el municipio del estudio de referencia"
  - termino: "CORMACARENA"
    que_es: "la autoridad ambiental del estudio de referencia"
  - termino: "Juanambú"
    que_es: "el proyecto del estudio de referencia"
  - termino: "Juananmbú"
    que_es: "el proyecto del estudio de referencia, con la errata del original"
  - termino: "Maizaro"
    que_es: "un cuerpo de agua del estudio de referencia"
  - termino: "Calatrava"
    que_es: "un cuerpo de agua del estudio de referencia"
  - termino: "Apto. Vanguardia"
    que_es: >-
      la estacion de temperatura del estudio de referencia. Se declara con el
      prefijo 'Apto.' y no como 'Vanguardia' a secas porque el nombre podria
      corresponder a una estacion legitima de otro estudio.
  - termino: "AOC71597"
    que_es: "la orden de servicio del estudio de referencia"

  # SEGUNDA TANDA. La primera lista solo cubria los nombres mas visibles y
  # dejaba pasar prosa que afirma resultados del estudio de referencia sin
  # nombrarlo: sus estaciones, sus cifras de caudal ambiental y su capitulo de
  # analisis hidraulico, que este estudio no realizo. Se descubrio volcando los
  # parrafos resaltados del documento ya generado, no de la plantilla.
  - termino: "Qda. NN"
    que_es: "como el estudio de referencia nombra su corriente en el balance"
  - termino: "Acacías"
    que_es: "una estacion del estudio de referencia, en el Meta"
  - termino: "MANZANARES"
    que_es: "una estacion del estudio de referencia"
  - termino: "SALINAS DE UPIN"
    que_es: "una estacion del estudio de referencia"
  - termino: "ICA V"
    que_es: "una estacion del estudio de referencia"
  - termino: "Departamento del Meta"
    que_es: "el departamento del estudio de referencia"
  - termino: "23.04 l/s"
    que_es: "el caudal ambiental del estudio de referencia"
  - termino: "9.71 l/s"
    que_es: "el Q95 del estudio de referencia"
  - termino: "69.69 l/s"
    que_es: >-
      el caudal medio multianual del estudio de referencia. Estaba en la
      conclusion del balance, que este estudio cierra en 2.281,8 l/s.
  - termino: "disminución de precipitación"
    que_es: >-
      la proyeccion de cambio climatico del estudio de referencia. En este
      estudio la proyeccion es de INCREMENTO, del 10,58 por ciento, y el
      parrafo afirma lo contrario de lo que el modelo aplica.

# -----------------------------------------------------------------------------
# PARRAFOS DE UN ANALISIS QUE ESTA CADENA NO REALIZA
#
# La plantilla cubre un entregable mas amplio que el de la cadena: su titulo es
# "Estudios hidrologicos, modelacion hidraulica de cauces y analisis de
# socavacion", y la cadena produce el primero de los tres. Las conclusiones de
# los otros dos siguen en el documento con las cifras del estudio de
# referencia: profundidades de socavacion, galibo, ampliacion del puente,
# gradacion del enrocado. No las detecta la comprobacion de identidad porque no
# nombran a nadie.
#
# NO SE BORRAN. Sirven de modelo de redaccion para cuando el analisis
# hidraulico exista, y borrarlas obligaria a rehacerlas desde cero. Se marcan
# en ROSA para que no puedan confundirse con una conclusion de este estudio.
# -----------------------------------------------------------------------------
fuera_de_alcance:
  motivo: >-
    corresponde a la modelacion hidraulica y al analisis de socavacion, que no
    forman parte de este estudio hidrologico. Las cifras son las del informe de
    referencia y hay que reescribirlas cuando ese analisis se realice.
  fragmentos:
    - "Se construyó ll modelo hidráulico en 1D"
    - "Se observó que el estribo izquierdo del puente"
    - "Se construyó el modelo hidráulico 2D"
    - "El análisis de socavación para la creciente de periodo de retorno"
    - "En cuanto a la socavación local en estribos"
    - "De acuerdo con el análisis del software utilizado no se tiene socavación"
    - "A partir de los resultados de lámina de agua de creciente de 100 años"
    - "Se recomienda la ampliación de la longitud del puente"
    - "Se recomienda la instalación de un enrocado de protección"
    - "Se recomienda tener en cuenta las alturas de lámina de agua"
    - "Para los análisis de socavación se utiliza los resultados de las granulometrías"
