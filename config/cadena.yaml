# =============================================================================
# CADENA DE EJECUCIÓN
# -----------------------------------------------------------------------------
# Declara el orden de los módulos, con qué intérprete corre cada uno y con qué
# argumentos. La lee 'ejecutar_cadena.py'.
#
# Está aquí y no en el código para poder ajustar el orden, saltar un módulo o
# cambiar sus argumentos sin tocar el programa. Un estudio que necesite una
# cadena propia pone su copia en config/cadena.yaml y esa manda.
#
# CAMPOS DE CADA PASO
#   modulo       identificador corto, el que se usa en --desde, --hasta y --solo
#   nombre       descripción legible, la que aparece en el resumen
#   script       ruta relativa a la raíz del CÓDIGO
#   entorno      venv | qgis. Las dos rutas de intérprete están en config.yaml
#   argumentos   los propios del módulo, además de --raiz que se añade siempre
#   estado       disponible | pendiente
#   modos        modos de análisis en que aplica. Vacío significa que aplica a
#                todos
#   opcional     un fallo no detiene la cadena, solo se reporta
#   manual       la cadena se detiene aquí y da instrucciones. Es el único paso
#                con intervención obligatoria (CLAUDE.md, sección 4)
#
# LOS PASOS 'pendiente' NO SON UN OLVIDO. Están declarados a propósito: la
# cadena es a la vez plan de ejecución y hoja de ruta, y así se ve de un vistazo
# hasta dónde llega hoy la herramienta. El orquestador se detiene al llegar al
# primero y lo dice.
# =============================================================================

pasos:

  # --- Preparación ---------------------------------------------------------
  - modulo: M00
    nombre: "Configuración, utilidades comunes y logging"
    script: "src/M00_configuracion.py"
    entorno: venv
    estado: disponible

  - modulo: M00c
    nombre: "Verificación de insumos del usuario"
    script: "src/M00c_insumos.py"
    entorno: venv
    estado: disponible

  # --- Marco geográfico ----------------------------------------------------
  - modulo: M01
    nombre: "Punto de descarga y subzona hidrográfica"
    script: "src/M01_punto_descarga.py"
    entorno: qgis
    estado: disponible

  - modulo: M02a
    nombre: "DEM y recortes acotados por la subzona"
    script: "src/M02_dem_delimitacion.py"
    entorno: qgis
    argumentos: ["--fase", "preliminar"]
    estado: disponible

  - modulo: M02b
    nombre: "Red de drenaje topológica"
    script: "src/M02b_red_drenaje.py"
    entorno: qgis
    estado: disponible

  # El área preliminar necesita la red, y la red necesita el DEM: por eso el
  # M02 va en dos fases y la segunda cae DESPUÉS del M02b.
  - modulo: M02c
    nombre: "Área de influencia preliminar, acotada por trazado de red"
    script: "src/M02_dem_delimitacion.py"
    entorno: qgis
    argumentos: ["--fase", "area"]
    estado: disponible

  # --- Delimitación definitiva ----------------------------------------------
  # EL PASO MANUAL VA AQUI Y NO DESPUES DE LA PRECIPITACION. El orden anterior
  # ejecutaba toda la cadena de precipitación (M03 a M08, que es la cara: la
  # descarga del IDEAM, el análisis de frecuencia y dos juegos de isoyetas)
  # ANTES de conocer la cuenca definitiva, y por tanto sobre el área preliminar,
  # que sobredimensiona varias veces. Medido en este estudio: 990,7 km2 de área
  # preliminar para una cuenca de 220,3. Sobre una cuenca pequeña dentro de una
  # subzona grande esa desproporción crece, y no aporta nada a cambio.
  #
  # El adelanto es posible porque el M09a solo necesita el DEM, el punto, el
  # área preliminar y el drenaje, todo del M01 y el M02: NINGUN producto de
  # precipitación. Se comprobó antes de reordenar.
  - modulo: M09a
    nombre: "Insumos para HEC-HMS"
    script: "src/M09_hec_hms.py"
    entorno: venv
    argumentos: ["--preparar"]
    estado: disponible
    modos: [detallado]

  - modulo: HEC
    nombre: "Delimitación asistida en HEC-HMS"
    entorno: manual
    manual: true
    estado: disponible
    modos: [detallado]
    nombre_largo: >-
      Abrir HEC-HMS, cargar los insumos que dejó el M09 en el directorio de
      intercambio y delimitar las subcuencas con el geoprocesamiento asistido.
      Es el único paso con intervención manual obligatoria (CLAUDE.md,
      sección 4). Al terminar, exportar y relanzar la cadena desde M09b.

  - modulo: M09b
    nombre: "Importación de subcuencas y área de influencia definitiva"
    script: "src/M09_hec_hms.py"
    entorno: venv
    argumentos: ["--importar"]
    estado: disponible
    modos: [detallado]

  - modulo: M00b
    nombre: "Proyecto QGIS"
    script: "src/M00b_proyecto_qgis.py"
    entorno: qgis
    estado: disponible
    opcional: true

  # --- Datos ----------------------------------------------------------------
  - modulo: M03
    nombre: "Selección de estaciones"
    script: "src/M03_seleccion_estaciones.py"
    entorno: venv
    estado: disponible

  - modulo: M04
    nombre: "Ingesta IDEAM"
    script: "src/M04_ingesta_ideam.py"
    entorno: venv
    argumentos: ["--descargar"]
    estado: disponible

  - modulo: M04b
    nombre: "Sensibilidad de longitud de series"
    script: "src/M04b_sensibilidad_series.py"
    entorno: venv
    estado: disponible

  - modulo: M05
    nombre: "Precipitación mensual: anómalos, consistencia, complemento"
    script: "src/M05_precipitacion_mensual.py"
    entorno: venv
    estado: disponible

  - modulo: M05b
    nombre: "Clasificación ENSO-ONI"
    script: "src/M05b_enso.py"
    entorno: venv
    estado: disponible

  # --- Precipitación --------------------------------------------------------
  - modulo: M06
    nombre: "Isoyetas de precipitación total por fase ENSO"
    script: "src/M06_isoyetas.py"
    entorno: qgis
    estado: disponible

  - modulo: M07
    nombre: "Pmáx 24 h y análisis de frecuencia"
    script: "src/M07_frecuencia.py"
    entorno: venv
    estado: disponible

  - modulo: M08
    nombre: "Isoyetas de Pmáx por periodo de retorno"
    script: "src/M08_isoyetas_pmax.py"
    entorno: qgis
    estado: disponible

  # --- Delimitación definitiva ---------------------------------------------
  # --- Caracterización ------------------------------------------------------
  # El M09 y el paso manual ya no van aquí: se adelantaron delante del M03 para
  # que la precipitación se analice sobre la cuenca definitiva y no sobre el
  # área preliminar. El motivo completo está junto al M09a.
  - modulo: M10
    nombre: "Caracterización morfométrica e hidrológica"
    script: "src/M10_morfometria.py"
    entorno: venv
    estado: disponible

  - modulo: M11
    nombre: "Zonificación pluviométrica y precipitación media"
    script: "src/M11_zonificacion.py"
    # La sección 8 lo declaraba en QGIS porque se pensó que interpolaría. No
    # interpola: el M06 y el M08 ya dejaron los campos escritos, y lo que hace
    # es estadística zonal, que el venv resuelve con el lector de GeoTIFF y el
    # barrido de comun.geometria.
    entorno: venv
    estado: disponible

  - modulo: M11c
    nombre: "Factor de reducción por área"
    script: "src/M11c_arf.py"
    entorno: venv
    estado: disponible

  # --- Tormenta de diseño ---------------------------------------------------
  - modulo: M12a
    nombre: "Curvas IDF y factores de cambio climático"
    script: "src/M12a_idf.py"
    entorno: venv
    estado: disponible

  - modulo: M12b
    nombre: "Hietogramas de diseño (Huff)"
    script: "src/M12b_hietogramas.py"
    entorno: venv
    estado: disponible

  # --- Modelo ---------------------------------------------------------------
  - modulo: M13
    # No ESCRIBE el proyecto: el consultor lo entrega construido con la
    # delimitacion asistida y la cadena lo ACTUALIZA con los parametros
    # calculados, la meteorologia y los escenarios.
    nombre: "Actualización del proyecto HEC-HMS y escenarios"
    script: "src/M13_hec_hms.py"
    entorno: venv
    estado: disponible
    modos: [detallado]

  - modulo: M14
    # Computa los ocho escenarios SIN ABRIR el programa, con la API de guion de
    # HEC-HMS, y lee los resultados de sus DSS. Cada corrida se valida contra su
    # propio log: el codigo de salida del proceso no dice si el calculo sirvio.
    nombre: "Ejecución de simulaciones y extracción de resultados"
    script: "src/M14_simulaciones.py"
    entorno: venv
    estado: disponible
    modos: [detallado]

  # VERIFICACION, que NO es la calibracion. Contrasta el modelo contra las
  # crecientes observadas en las estaciones que caen dentro de la cuenca.
  - modulo: M14c
    nombre: "Verificación de crecientes contra caudal observado"
    script: "src/M14c_verificacion.py"
    entorno: venv
    estado: disponible
    modos: [detallado]

  - modulo: M14b
    nombre: "Calibración"
    script: "src/M14b_calibracion.py"
    entorno: venv
    # NO VIABLE CON LOS DATOS DISPONIBLES, y no es lo mismo que pendiente.
    # Calibrar exige ajustar los parametros contra hidrogramas de tormentas
    # concretas, y para eso hace falta caudal continuo horario o diario. Lo que
    # hay es escala MENSUAL: la CAR publica el maximo de los medios diarios de
    # cada mes, y las estaciones LG y LM del IDEAM en el area registran nivel,
    # no caudal. Los dos anios de caudal diario del archivo satelital tampoco
    # alcanzan.
    #
    # En su lugar corre el M14c, que verifica sin ajustar. Si un estudio futuro
    # trae series de caudal utilizables, este paso vuelve a 'pendiente'.
    estado: no_viable
    modos: [detallado]
    opcional: true

  # --- Balance y régimen ----------------------------------------------------
  - modulo: M18
    # DOS ESCALAS: multianual por subcuenca y mensual por cuenca, que se
    # comparan entre si. La lluvia se interpola por PROXIMIDAD y no por
    # elevacion, y eso esta medido sobre el estudio, no supuesto.
    nombre: "Balance hídrico a largo plazo (Budyko)"
    script: "src/M18_balance.py"
    entorno: venv
    estado: disponible

  - modulo: M18a
    # Ajusta el campo termico contra la ELEVACION, no por distancia: en montana
    # la cota lo explica mucho mejor que la vecindad horizontal. Los
    # coeficientes se recalculan siempre con las estaciones del estudio.
    nombre: "Temperatura y evapotranspiración"
    script: "src/M18a_temperatura.py"
    entorno: venv
    estado: disponible

  - modulo: M18b
    # Schosinsky y Losilla: C = Kfc + Kp + Kv. Los parametros salen del suelo
    # de ESTE estudio, del grupo hidrologico que el M10 determino, no de un
    # valor tomado de un estudio de otra zona.
    nombre: "Infiltración"
    script: "src/M18b_infiltracion.py"
    entorno: venv
    estado: disponible

  - modulo: M19
    # HOY entrega solo la curva de duracion y sus percentiles; el IRH y el
    # caudal ambiental quedan pendientes y el modulo lo declara en su reporte.
    nombre: "Curva de duración, IRH y caudal ambiental"
    script: "src/M19_duracion.py"
    entorno: venv
    estado: disponible

  # --- Entrega --------------------------------------------------------------
  - modulo: M15p
    # PREPARA LA PLANTILLA, una sola vez y no en cada estudio: toma el informe
    # base del consultor, conserva su formato integro y sustituye el contenido
    # del proyecto anterior por marcadores. Fuera de la cadena a proposito.
    nombre: "Generador de la plantilla con marcadores"
    script: "src/M15_plantilla.py"
    entorno: venv
    estado: disponible
    opcional: true
    modos: [detallado]

  - modulo: M15
    # El formato, la estructura y la redaccion viven fuera del codigo: la
    # plantilla se deriva del informe de referencia del consultor, el arbol de
    # capitulos esta en config/informe.yaml y el texto en templates/informe.
    nombre: "Redacción del informe en Word"
    script: "src/M15_informe.py"
    entorno: venv
    estado: disponible

  - modulo: M16
    # LA ESCALA SE CALCULA, no se declara: desde la extension de la capa que
    # encuadra y del marco de la plancha, redondeando hacia arriba a la serie
    # normalizada. Una lista fija de escalas es inservible en cuanto cambia el
    # tamano de la cuenca, y el error no se ve hasta imprimir.
    nombre: "Cartografía temática"
    script: "src/M16_cartografia.py"
    entorno: qgis
    estado: disponible

  - modulo: M17
    nombre: "Ensamble y verificación de anexos"
    script: "src/M17_anexos.py"
    entorno: venv
    estado: disponible
