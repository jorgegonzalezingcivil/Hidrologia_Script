# =============================================================================
# CORRECCIONES A LAS INSTRUCCIONES DE LA PLANTILLA  (insumo del M15)
# -----------------------------------------------------------------------------
# Que hacer cuando una instruccion de la plantilla pide lo que no corresponde.
#
# POR QUE NO SE CORRIGE EN EL DOCUMENTO. La plantilla del consultor es la fuente
# y no se toca; templates/informe_base.docx es una copia derivada que se
# regenera a partir de ella, de modo que una correccion escrita alli se
# perderia sin aviso la proxima vez. Aqui sobrevive, y ademas queda dicha: el
# modulo la aplica y la registra en el log, con lo que el informe puede explicar
# por que una figura no es la que la instruccion nombraba.
#
# SE IDENTIFICA POR LA LEYENDA, por la misma razon que las tablas: las leyendas
# se componen con campos SEQ sin resultado en cache y dicen "Ilustracion -."
# hasta que Word actualice los campos, asi que el numero no sirve para
# emparejar. La leyenda se compara sin prefijo, sin tildes y sin distinguir
# mayusculas.
#
# EN LAS FIGURAS LA LEYENDA VA ANTES de la instruccion, y en las tablas
# despues. No es un descuido de la plantilla: es su composicion.
#
# Cuando el consultor corrija su plantilla, la entrada correspondiente se
# retira de aqui. Si una leyenda declarada deja de existir, el modulo lo avisa.
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# NOMBRES QUE EL INFORME ESCRIBE DE OTRA FORMA QUE SUS FUENTES
#
# Se aplica a lo que el modulo escribe en las tablas. No es un arreglo del dato:
# el CSV del inventario conserva la razon social tal como la entrega el
# Catalogo Nacional de Estaciones, que es lo que hay que poder mostrar ante una
# revision. Lo que cambia es como se nombra en el informe.
# -----------------------------------------------------------------------------
texto:

  - busca: "INSTITUTO DE HIDROLOGÍA METEOROLOGÍA Y ESTUDIOS AMBIENTALES"
    pone: "IDEAM"
    motivo: >-
      El catalogo entrega la entidad operadora con su razon social completa en
      las 44 estaciones del inventario, y el informe la nombra por su sigla.

# -----------------------------------------------------------------------------
# CORRECCIONES DE FIGURA: NINGUNA PENDIENTE
#
# Las dos que hubo ("Areas microcuencas" pedia el grafico de barras en lugar
# del mapa, y "Curva Hipsometrica" pedia ese mismo grafico) ESTAN APLICADAS EN
# LA PLANTILLA, por tools/consolidar_plantilla.py. Ya no hacen falta aqui: el
# repositorio es la fuente de verdad de templates/informe_base.docx y el
# defecto se arreglo en su sitio.
#
# Esta seccion se conserva vacia porque el mecanismo sigue sirviendo: si
# aparece otra instruccion equivocada y conviene corregirla sin tocar el
# documento, se declara aqui. Recordar que la leyenda sola no identifica una
# instruccion cuando la plantilla la repite; entonces hace falta 'pedia'.
# -----------------------------------------------------------------------------
figuras: []
